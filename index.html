  .ml-chip{background:#fff; border:1px solid #000}
  .ml-fk ul.far li{color:#000}
  .ml-rule{background:#fff; border:1.5px solid #000}
}

/* measures-practice styles (prefix mp-) */
.mp-kinds{display:flex; flex-wrap:wrap; gap:8px}
.mp-kinds button{border:0; border-radius:14px; background:var(--paper-2); color:var(--ink); font-family:var(--display); font-weight:700; font-size:16px; padding:8px 14px; min-height:44px; box-shadow:0 2px 0 var(--paper-3)}
.mp-kinds button.on{background:var(--lemon); box-shadow:0 2px 0 var(--sun-deep)}

/* ladder picture */
.mp-lad{display:flex; align-items:stretch; justify-content:center; gap:2px; max-width:100%}
.mp-chip{flex:0 1 auto; min-width:0; width:clamp(42px,12vw,64px); display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; border-radius:12px; background:var(--paper-2); color:var(--ink-soft)}
.mp-chip b{font-family:var(--display); font-size:clamp(16px,4.6vw,22px)}
.mp-chip span{font-size:clamp(11px,3vw,14px); font-weight:700; min-height:1.2em; overflow-wrap:anywhere; text-align:center}
.mp-chip.on{background:var(--accent-soft); color:var(--ink); box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.mp-chip.from{background:var(--lemon)}
.mp-chip.to{background:color-mix(in srgb,var(--mint) 35%,var(--paper))}
.mp-r{flex:0 0 auto; justify-content:center; width:clamp(22px,7vw,36px); display:flex; flex-direction:column; align-items:center; font-size:clamp(10px,2.8vw,13px); color:var(--ink-soft); line-height:1.1}
.mp-r i{font-style:normal; font-size:clamp(12px,3.5vw,16px)}
.mp-r b{font-weight:700}
.mp-r.on{color:var(--accent-deep)}

/* choice buttons */
.mp-opts{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}
.mp-opt{border:0; border-radius:18px; background:var(--paper-2); color:var(--ink); min-width:84px; min-height:72px; padding:8px 16px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 2px 0 var(--paper-3)}
.mp-opt b{font-family:var(--display); font-size:28px; line-height:1.1}
.mp-opt small{font-size:13px; font-weight:700; color:var(--ink-soft)}
.mp-opt:active{transform:translateY(2px)}
.mp-opt.right{background:color-mix(in srgb,var(--mint) 35%,var(--paper)); box-shadow:inset 0 0 0 2px var(--mint-deep)}
.mp-opt.wrong{background:var(--pink-2); box-shadow:inset 0 0 0 2px var(--pink)}
.mp-opt[disabled]{cursor:default}

/* Гошины записи */
.mp-lines{display:flex; flex-direction:column; gap:10px}
.mp-line{border:0; text-align:left; border-radius:14px; background:var(--paper-2); color:var(--ink); font-family:var(--display); font-weight:600; font-size:19px; padding:12px 16px; min-height:52px; box-shadow:0 2px 0 var(--paper-3); overflow-wrap:anywhere}
div.mp-line{box-shadow:none}
.mp-line.wrong,.mp-line.bad{background:var(--pink-2); box-shadow:inset 0 0 0 2px var(--pink)}
.mp-line.fine{background:color-mix(in srgb,var(--mint) 25%,var(--paper))}

/* расстановка */
.mp-row-lab{display:flex; align-items:center; gap:8px; color:var(--ink-soft); font-weight:700; font-size:14px}
.mp-row-lab i{flex:1; height:2px; background:var(--paper-3); position:relative}
.mp-row-lab i::after{content:''; position:absolute; right:0; top:-4px; border:5px solid transparent; border-left:8px solid var(--paper-3); border-right:0}
.mp-row,.mp-tray{display:flex; flex-wrap:wrap; gap:10px}
.mp-slot{min-width:72px; min-height:64px; border-radius:14px; border:2px dashed var(--paper-3); display:grid; place-items:center; color:var(--ink-soft); font-weight:700; font-family:var(--display)}
.mp-card{border:0; border-radius:14px; background:var(--paper-2); color:var(--ink); min-width:72px; min-height:64px; padding:8px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 2px 0 var(--paper-3); font-family:var(--display)}
.mp-card b{font-size:20px; white-space:nowrap}
.mp-card small{font-size:12px; font-weight:700; color:var(--ink-soft)}
.mp-card.in{background:var(--lemon); box-shadow:0 2px 0 var(--sun-deep)}
.mp-card.right{background:color-mix(in srgb,var(--mint) 35%,var(--paper)); box-shadow:inset 0 0 0 2px var(--mint-deep)}
.mp-card.wrong{background:var(--pink-2); box-shadow:inset 0 0 0 2px var(--pink)}
.mp-card[disabled]{cursor:default}
@media (max-width:480px){
  .mp-opt{min-width:72px; flex:1 1 72px}
  .mp-slot,.mp-card{min-width:64px; flex:1 1 64px}
}

<main id="app" class="app"></main>
<script>
/* core: helpers, router, registries, keypad, click dispatch */
const app = document.getElementById('app');
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d){ try { const v = localStorage.getItem('skz_' + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('skz_' + k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
function plural(n, f){ n = Math.abs(n) % 100; const d = n % 10; if (n > 10 && n < 20) return f[2]; if (d > 1 && d < 5) return f[1]; if (d === 1) return f[0]; return f[2]; }
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;


/* ---------- state + router ---------- */
let view = 'home';
const PAD = { val:'', submit:null };

/* Module registries. Each module file adds its own entries, so modules never edit each other:
   VIEWS[name] = render function; ACTIONS[data-act] = (button, event) => {};
   LEAVE.push(fn) runs on every screen change (stop timers etc.);
   HOME_TILES.push({ order, html: () => '<button class="district" data-act="go" data-go="...">…</button>' }). */
const VIEWS = {}, ACTIONS = {}, LEAVE = [], HOME_TILES = [];

function go(v){
  LEAVE.forEach(fn => fn());
  view = v; render(); window.scrollTo(0, 0);
}
function render(){ (VIEWS[view] || VIEWS.home)(); }
function topbar(title, back = 'home', backText = '← В город'){
  return `<div class="topbar"><button class="back" data-act="go" data-go="${back}">${backText}</button><span class="topbar-title">${title}</span>${fsBtn()}</div>`;
}

/* fullscreen: on a tablet the browser bars eat the screen. Hidden where the browser can't do it (iPhone Safari) */
const FS = {
  can: () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled),
  on: () => !!(document.fullscreenElement || document.webkitFullscreenElement)
};
const fsLabel = () => FS.on() ? 'Выйти из полного экрана' : 'На весь экран';
function fsBtn(){ return FS.can() ? `<button class="fs-btn" data-act="fs" aria-label="${fsLabel()}"><span aria-hidden="true">${FS.on() ? '⤡' : '⤢'}</span><span class="fs-text">${fsLabel()}</span></button>` : ''; }
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () =>
  document.querySelectorAll('.fs-btn').forEach(b => { b.outerHTML = fsBtn(); })));
function padHTML(label){
  PAD.val = '';
  const keys = [1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-act="key" data-k="${n}">${n}</button>`).join('');
  return `<div class="pad"><div class="pad-label">${label}</div><div class="pad-display" id="pad-display" aria-live="polite">&nbsp;</div>
    <div class="pad-keys">${keys}<button class="key key-soft" data-act="key" data-k="del" aria-label="Стереть">⌫</button><button class="key" data-act="key" data-k="0">0</button><button class="key key-go" data-act="key" data-k="ok">Готово</button></div></div>`;
}


/* ---------- events ---------- */
ACTIONS.go = (t) => go(t.dataset.go);
ACTIONS.fs = () => {
  const el = document.documentElement;
  if (FS.on()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else { const r = el.requestFullscreen || el.webkitRequestFullscreen; if (r) { const p = r.call(el); if (p && p.catch) p.catch(() => {}); } }
};
ACTIONS.key = (t) => {
  const k = t.dataset.k;
  if (k === 'del') PAD.val = PAD.val.slice(0, -1);
  else if (k === 'ok'){ if (PAD.val !== '' && PAD.submit) PAD.submit(parseInt(PAD.val, 10)); return; }
  else if (PAD.val.length < 4) PAD.val += k;
  const d = $('#pad-display'); if (d) d.textContent = PAD.val || '\u00a0';
};
app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const fn = ACTIONS[t.dataset.act]; if (fn) fn(t, e);
});
document.addEventListener('keydown', (e) => {
  if (!$('#pad-display') || e.target.tagName === 'TEXTAREA') return;
  if (/^[0-9]$/.test(e.key)){ if (PAD.val.length < 4) PAD.val += e.key; }
  else if (e.key === 'Backspace') PAD.val = PAD.val.slice(0, -1);
  else if (e.key === 'Enter'){ if (PAD.val !== '' && PAD.submit) PAD.submit(parseInt(PAD.val, 10)); return; }
  else return;
  $('#pad-display').textContent = PAD.val || ' ';
});

/* home screen + album of own stories */
function renderHome(){
  app.innerHTML = `
  <header class="hero">
    <div class="hero-goat" aria-hidden="true">🐐</div>
    <div class="hero-text">
      <p class="eyebrow">Город Сан-Козлос</p>
      <h1>Миссии Сан-Козлоса</h1>
      <p class="lead">Козёл Гоша берётся за любую работу в городе. Разбираем его истории по шагам: сначала рисуем настоящие предметы, потом превращаем их в схему, и только потом считаем.</p>
    </div>
    ${fsBtn()}
  </header>
  <section class="districts">
    ${HOME_TILES.slice().sort((x, y) => x.order - y.order).map(t => t.html()).join('')}
  </section>
  <details class="parents">
    <summary>Для родителей: как заниматься</summary>
    <ul>
      <li><b>Идея — от конкретного к абстрактному, постепенно.</b> Сначала история рисуется монетами и машинами, потом те же предметы превращаются в полоски, потом в пример. Полоски — это не новая задача, а короткая запись той же картинки.</li>
      <li><b>Первые разы сидите рядом.</b> Просите пересказать историю своими словами: кто что сделал и что поменялось.</li>
      <li><b>Не называйте действие.</b> Спрашивайте: «Где у нас вопрос? Это целое или часть?» Действие получается из схемы.</li>
      <li><b>10–15 минут в день</b> полезнее часа в выходные. Начинайте с «Без пальцев», потом одна-две миссии.</li>
      <li><b>Хвалите за схему и объяснение</b>, а не за скорость. Ошибка в приложении ничего не стоит, ответ проверяется «наоборот».</li>
      <li><b>«Твоя история» — самое важное.</b> Пусть придумывает и рисует свои задачи, а вы их решайте (иногда нарочно неправильно, чтобы он поймал ошибку).</li>
    </ul>
  </details>`;
}

VIEWS.home = renderHome;
HOME_TILES.push({ order:100, html: () => { const album = store.get('album', []); return `
    <button class="district" data-act="go" data-go="album">
      <span class="ico" aria-hidden="true">🎨</span>
      <h2>Мой альбом</h2>
      <p>Твои истории и рисунки. Придумай задачу — пусть её решат взрослые.</p>
      <span class="meta">${album.length ? album.length + ' ' + plural(album.length, ['история','истории','историй']) : 'Пока пусто'}</span>
    </button>
`; } });

/* ---------- album ---------- */
function renderAlbum(){
  const album = store.get('album', []);
  app.innerHTML = topbar('Мой альбом') + (album.length ? `<section class="agrid">${album.map(a => `
    <article class="card acard"><img src="${a.img}" alt="Рисунок к истории"><span class="expr-small">${a.expr}</span>
      <p>${a.text.replace(/[<>&]/g, c => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;' }[c]))}</p>
      <span class="meta">По миссии «${a.mission}» · ${a.date}</span>
      <div class="row"><button class="btn ghost" data-act="del" data-id="${a.id}">Удалить</button></div></article>`).join('')}</section>`
    : `<section class="card empty"><span class="big" aria-hidden="true">🎨</span><h2>Здесь будут твои истории</h2>
       <p>Пройди миссию, и в конце придумай свою историю с рисунком. Она появится тут.</p>
       <button class="btn" data-act="go" data-go="missions">К миссиям</button></section>`);
}

VIEWS.album = renderAlbum;
ACTIONS.del = (t) => { const album = store.get('album', []).filter(x => String(x.id) !== t.dataset.id); store.set('album', album); renderAlbum(); };

/* missions: story -> concrete scene (objects) -> bar diagram -> kid picks the operation -> calc -> own story.
   Every mission is a TEMPLATE with a number generator: the story and the schema stay, the numbers are new each run,
   so re-playing a mission is never memorization. Questions about the story offer THREE explanations to pick from,
   and the operation is picked by the kid (with feedback) before the app shows the number sentence. */
let M = null;      // current mission

/* plural forms for {n:key} placeholders in texts */
const PLUR = {
  монета:['монета','монеты','монет'], машина:['машина','машины','машин'],
  листовка:['листовка','листовки','листовок'], этаж:['этаж','этажа','этажей'],
  бак:['бак','бака','баков'], наклейка:['наклейка','наклейки','наклеек'],
  бутылка:['бутылка','бутылки','бутылок'], домик:['домик','домика','домиков'],
  кактус:['кактус','кактуса','кактусов'], миссия:['миссия','миссии','миссий'],
  коробка:['коробка','коробки','коробок'], пончик:['пончик','пончика','пончиков'],
  тарелка:['тарелка','тарелки','тарелок'], полка:['полка','полки','полок'],
  кучка:['кучка','кучки','кучек'], яблоко:['яблоко','яблока','яблок'],
  пассажир:['пассажир','пассажира','пассажиров'], турист:['турист','туриста','туристов'],
  ряд:['ряд','ряда','рядов'], раз:['раз','раза','раз'],
  порция:['порция','порции','порций'], билет:['билет','билета','билетов'], жетон:['жетон','жетона','жетонов']
};
function fmt(tpl, v){
  return tpl.replace(/\{(\w+)(?::([^}]+))?\}/g, (all, k, u) => {
    const n = v[k];
    if (n == null) return all;
    return u ? `${n} ${PLUR[u] ? plural(n, PLUR[u]) : u}` : String(n);
  });
}

const TPLS = [
 { id:'m1', title:'Пицца и гонка', icon:'🍕', item:'🪙', schema:'join', unk:'whole',
   text:'Гоша развёз пиццу и заработал {a:монета}. Потом выиграл гонку на мопеде и получил ещё {b:монета}. Сколько монет Гоша заработал за день?',
   labels:{a:'за пиццу', b:'за гонку', whole:'всего за день'},
   gen(){ let a = rand(23,58), b = rand(14,39); if (b === a) b = b < 39 ? b + 1 : b - 1; return {a, b}; },
   events:[
     { t:'Гоша развёз пиццу и заработал {a:монета}.', r:'a' },
     { t:'Потом выиграл гонку на мопеде и получил ещё {b:монета}.', r:'b',
       lq:{ q:'После гонки монет у Гоши стало больше, меньше или столько же?',
         opts:[
           { t:'Больше', ok:true, why:'Гоша получил ещё монеты — их стало больше. Новые кладём рядом с прежними.' },
           { t:'Меньше', why:'Меньше бывает, когда монеты отдали или потратили. А тут Гоша получил.' },
           { t:'Столько же', why:'Столько же — когда ничего не поменялось. Но {b:монета} сверху — это перемена!' } ] } },
     { t:'Сколько монет Гоша заработал за день?', r:'whole', ask:true }],
   unit:['монету','монеты','монет'], done:'За день Гоша заработал {ans} {unit}.' },
 { id:'j2', title:'Листовки по улицам', icon:'📄', item:'📄', schema:'join', unk:'whole',
   text:'Гоша расклеил объявления: на первой улице {a:листовка}, на второй — ещё {b:листовка}. Сколько всего листовок он расклеил?',
   labels:{a:'первая улица', b:'вторая улица', whole:'все листовки'},
   gen(){ let a = rand(24,52), b = rand(15,38); if (b === a) b = b < 38 ? b + 1 : b - 1; return {a, b}; },
   events:[
     { t:'На первой улице Гоша расклеил {a:листовка}.', r:'a',
       lq:{ q:'{a} — это все объявления или только первая улица?',
         opts:[
           { t:'Только первая улица', ok:true, why:'Дальше будут ещё улицы. {a} — это первая часть, кладём её слева.' },
           { t:'Все объявления', why:'Нет, вторая улица ещё впереди. Сначала рисуем только первую часть.' },
           { t:'Вторая улица', why:'Вторая улица будет дальше. {a} — то, что расклеено на первой.' } ] } },
     { t:'На второй улице он расклеил ещё {b:листовка}.', r:'b' },
     { t:'Сколько всего листовок он расклеил?', r:'whole', ask:true }],
   unit:['листовку','листовки','листовок'], done:'Гоша расклеил всего {ans} {unit}.' },
 { id:'m7', title:'Турбо-скейт', icon:'🛹', item:'🪙', schema:'join', unk:'b',
   text:'Новый турбо-скейт стоит {whole:монета}. У Гоши уже есть {a:монета}. Сколько монет ему ещё нужно накопить?',
   labels:{whole:'цена скейта', a:'уже есть', b:'ещё накопить'},
   trap:'В истории есть слово «ещё», а действие — вычитание. Слова могут обманывать, схема — нет.',
   gen(){ const whole = Math.round(rand(70,95) / 5) * 5, a = rand(26, whole - 16); return {whole, a}; },
   events:[
     { t:'Новый турбо-скейт стоит {whole:монета}.', r:'whole' },
     { t:'У Гоши уже есть {a:монета}.', r:'a',
       lq:{ q:'{a} монет — это больше цены скейта или только часть цены?',
         opts:[
           { t:'Часть цены', ok:true, why:'{a} меньше {whole}. Это часть денег, которые уже есть. Остальное место пустое: тех монет ещё нет.' },
           { t:'Больше цены', why:'{a} меньше, чем {whole}. Больше быть никак не может.' },
           { t:'Ровно цена', why:'Ровно цена — это когда монет столько же, сколько стоит скейт. А тут меньше.' } ] } },
     { t:'Сколько монет ему ещё нужно накопить?', r:'b', ask:true }],
   unit:['монету','монеты','монет'], done:'Гоше нужно накопить ещё {ans} {unit}.' },
 { id:'j4', title:'Билет в аквапарк', icon:'🏄', item:'🪙', schema:'join', unk:'b',
   text:'Билет в аквапарк стоит {whole:монета}. У Гоши есть {a:монета}. Сколько монет не хватает?',

           { t:'Сколько не хватает', ok:true, why:'Есть {a}, билет {whole}. Пустое место в полоске — то, чего не хватает.' },
           { t:'Сколько уже есть', why:'Это мы знаем: {a}. Написано в истории.' },
           { t:'Сколько стоит билет', why:'И это знаем: {whole}. Неизвестно только пустое место.' } ] } },
     { t:'Сколько монет не хватает?', r:'b', ask:true }],

/* ---------- building a concrete mission from a template ---------- */
const unkOf = (cfg) => Object.keys(cfg.slots).find(k => cfg.slots[k] === '?');
function buildMission(tpl){
  const g = tpl.gen();
  const slots = {}; Object.keys(tpl.labels).forEach(k => slots[k] = k === tpl.unk ? '?' : g[k]);
  const cfg = { schema:tpl.schema, slots, labels:tpl.labels, events:[] };
  const d = derive(cfg);
  const ans = { '+':d.x + d.y, '−':d.x - d.y, '×':d.x * d.y, ':':d.x / d.y }[d.op];
  const V = Object.assign({}, g, { ans });
  const evts = tpl.events.map(e => ({ r:e.r, ask:!!e.ask, t:fmt(e.t, V),
    lq:e.lq ? { q:fmt(e.lq.q, V), opts:e.lq.opts.map(o => ({ t:fmt(o.t, V), ok:!!o.ok, why:fmt(o.why, V) })) } : null }));
  cfg.events = evts;
  return { tpl, id:tpl.id, title:tpl.title, icon:tpl.icon, item:tpl.item, schema:tpl.schema,
    trap:tpl.trap ? fmt(tpl.trap, V) : null, text:fmt(tpl.text, V), labels:tpl.labels, slots,
    events:evts, answer:ans, unit:tpl.unit, done:tpl.done, d, cfg };
}

const storyHTML = (m) => m.text.replace(/(\d+)/g, '<span class="n">$1</span>');
const storyMini = (m) => `<section class="card story-mini"><span class="story-icon" aria-hidden="true">${m.icon}</span><div><span class="eyebrow">Условие </span><p class="story-text">${storyHTML(m)}</p></div></section>`;
const allRev = () => Object.fromEntries(Object.keys(M.cfg.slots).map(k => [k, true]));

function derive(cfg){
  const s = cfg.slots, L = cfg.labels, sc = cfg.schema;
  const unk = unkOf(cfg);
  if (sc === 'join' || sc === 'remove'){
    if (unk === 'whole') return { op:'+', x:s.a, y:s.b, rule:`Вопрос — про всю полоску («${L.whole}»). Целое собираем из частей, значит <b>складываем</b>.` };
    const other = unk === 'a' ? s.b : s.a;
    return { op:'−', x:s.whole, y:other, rule:`Вопрос — про часть полоски («${L[unk]}»). От целого отрезаем известную часть, значит <b>вычитаем</b>.` };
  }
  if (sc === 'compare'){
    if (unk === 'diff') return { op:'−', x:s.big, y:s.small, rule:'Вопрос — про пунктир, то есть разницу. От длинной полоски отрезаем короткую: <b>вычитаем</b>.' };
    if (unk === 'big') return { op:'+', x:s.small, y:s.diff, rule:'Вопрос — про длинную полоску. Она = короткая + пунктир: <b>складываем</b>.' };
    return { op:'−', x:s.big, y:s.diff, rule:'Вопрос — про короткую полоску. Она = длинная без пунктира: <b>вычитаем</b>.' };
  }
  if (unk === 'total') return { op:'×', x:s.size, y:s.count, rule:`Одна порция (${s.size}) повторяется ${s.count} раз. Собираем порции: <b>умножаем</b>.` };
  if (unk === 'size') return { op:':', x:s.total, y:s.count, rule:`Раздаём ${s.total} поровну на ${s.count} частей: <b>делим</b>.` };
  return { op:':', x:s.total, y:s.size, rule:`Раскладываем ${s.total} по ${s.size} в порцию: <b>делим</b>.` };
}
const exprText = (d, ans) => `${d.x} ${d.op} ${d.y} = ${ans == null ? '<span class="qm">?</span>' : ans}`;

/* why a wrong operation does not fit (kid language, short) */
function opWhy(d, wrong){
  if (d.op === '×' && wrong === '+')
    return `Сложить можно: ${Array(3).fill(d.x).join(' + ')} + … (${d.y} раз). Но одинаковые порции считают короче — умножением. Жми ×.`;
  if (wrong === '+')
    return d.op === '−' ? 'Плюс сделал бы число ещё больше. А мы ищем кусочек — он меньше целого.'
      : 'Сложить — значит собрать в кучу. А нам нужно разобрать целое на равные части.';
  if (wrong === '−')
    return d.op === '+' ? 'Вычесть — значит убрать. А тут части на месте, и мы собираем их вместе.'
      : d.op === '×' ? 'Минус уменьшает. А тут порция повторяется снова и снова — число растёт.'
      : 'Минус убирает один раз. А тут делим всё поровну.';
  if (wrong === '×')
    return d.op === '+' ? `Умножение — для одинаковых порций. Тут числа разные: ${d.x} и ${d.y}.`
      : 'Умножение собирает целое из порций. А целое уже известно — его надо раздать.';
  /* wrong ':' */
  return d.op === '+' ? 'Деление раскладывает целое на части. А целое мы как раз ищем.'
    : d.op === '−' ? 'Делить — значит раскладывать поровну. Тут ничего не раскладываем.'
    : 'Деление раскладывает целое на порции. У нас наоборот: порции даны — собираем целое.';
}

function addSteps(a, b){
  const st = []; let cur = a; const bt = Math.floor(b / 10) * 10, bo = b % 10;
  if (bt > 0){ st.push(`Сначала десятки: ${cur} + ${bt} = ${cur + bt}`); cur += bt; }
  if (bo > 0){ const c = (10 - cur % 10) % 10;
    if (c > 0 && c < bo){ st.push(`До круглого не хватает ${c}: ${cur} + ${c} = ${cur + c}`); st.push(`Осталось добавить ${bo - c}: ${cur + c} + ${bo - c} = ${cur + bo}`); }
    else st.push(`Теперь единицы: ${cur} + ${bo} = ${cur + bo}`); }
  return st;
}
function subSteps(a, b){
  const st = []; let cur = a; const bt = Math.floor(b / 10) * 10, bo = b % 10;
  if (bt > 0){ st.push(`Сначала десятки: ${cur} − ${bt} = ${cur - bt}`); cur -= bt; }
  if (bo > 0){ const o = cur % 10;
    if (o > 0 && o < bo){ st.push(`Спускаемся до круглого: ${cur} − ${o} = ${cur - o}`); st.push(`Убрать ещё ${bo - o}: ${cur - o} − ${bo - o} = ${cur - bo}`); }
    else st.push(`Теперь единицы: ${cur} − ${bo} = ${cur - bo}`); }
  return st;
}
function calcSteps(d){
  let st;
  if (d.op === '+') st = addSteps(d.x, d.y);
  else if (d.op === '−') st = subSteps(d.x, d.y);
  else if (d.op === '×') st = [`«По ${d.x} взять ${d.y} раз»: ${Array(d.y).fill(d.x).join(' + ')}`, `Складывать долго — это уже есть в таблице умножения: ${d.x} × ${d.y} = ${d.x * d.y}`];
  else st = ['Деление — умножение наоборот.', `Ищем число: ? × ${d.y} = ${d.x}`, `Прыгай по ${d.y}: ${d.y}, ${d.y * 2}, ${d.y * 3}… до ${d.x}. Сколько прыжков? Ответ = ${d.x / d.y}`];
  const last = st.length - 1;
  st[last] = st[last].replace(/= -?\d+$/, '= ?');   // the last number stays for the kid
  return st;
}
function verify(d, g, ans){
  const dir = g > ans ? 'Многовато.' : 'Маловато.';
  if (d.op === '+') return `Проверим наоборот: ${g} − ${d.y} = ${g - d.y}, а другая часть была ${d.x}. ${dir}`;
  if (d.op === '−') return `Проверим наоборот: ${g} + ${d.y} = ${g + d.y}, а должно быть ${d.x}. ${dir}`;
  if (d.op === '×') return `Попрыгай по ${d.x}: нужно ${d.y} прыжков. Где окажешься? ${dir}`;
  return `Проверим наоборот: ${g} × ${d.y} = ${g * d.y}, а должно быть ${d.x}. ${dir}`;
}
function verifyOk(d, ans){
  if (d.op === '+') return `${ans} − ${d.y} = ${d.x} ✓`;
  if (d.op === '−') return `${ans} + ${d.y} = ${d.x} ✓`;
  if (d.op === '×') return `${ans} : ${d.y} = ${d.x} ✓`;
  return `${ans} × ${d.y} = ${d.x} ✓`;
}

/* ---------- the picture: objects or bars ----------
   One renderer for every step. rev = which story places are already known (slot keys). o.mode 'obj' draws the real
   things (up to 12 one by one, more as packs of 10), 'bar' draws plain bars with numbers. In 'obj' mode the whole is
   a bracket over its parts, so the same coins are never drawn twice. o.ask = the question beat: every place is a button. */
const objs = (n, it) => {
  const one = `<i class="o1">${it}</i>`;
  if (n <= 12) return `<span class="objs">${one.repeat(n)}</span>`;
  return `<span class="objs">${`<i class="o10">${it}<b>10</b></i>`.repeat(Math.floor(n / 10))}${one.repeat(n % 10)}</span>`;
};
const packsText = (n) => n > 12 && n % 10 ? ` — это ${Math.floor(n / 10)} ${plural(Math.floor(n / 10), ['пачка','пачки','пачек'])} по 10 и ещё ${n % 10}` : (n > 12 ? ` — это ${n / 10} ${plural(n / 10, ['пачка','пачки','пачек'])} по 10` : '');

function sceneDia(rev, o = {}){
  const c = M.cfg, S = c.schema, sl = c.slots, L = c.labels, it = M.m.item, ans = M.m.answer;
  const obj = o.mode !== 'bar';
  const val = (k) => sl[k] === '?' ? ans : sl[k];
  const num = (k) => sl[k] === '?' ? (o.reveal ? ans : null) : sl[k];
  const body = (k, on, things = true) => {
    const n = on ? num(k) : null, q = on && sl[k] === '?' ? (o.reveal ? ' ans' : ' q') : '';
    return `<span class="slot-label">${on || o.ask ? L[k] : ''}</span>${obj && things && n != null ? objs(n, it) : ''}<span class="slot-val${q}">${on ? (n ?? '?') : ''}</span>`;
  };
  const el = (k, cls, style, on, inner) => {
    const cl = `${cls}${on ? '' : ' ghost'}${o.fresh === k ? ' fresh' : ''}`;
    if (o.ask) return `<button class="${cl} tap" style="${style}" data-act="rq" data-k="${k}" ${on && o.qMiss ? 'disabled' : ''} aria-label="${L[k]}">${inner}</button>`;
    return `<div class="${cl}" style="${style}">${inner}</div>`;
  };
  const seg = (k, cls, grow, ghost, things) => {   // not known yet: an empty outline (ghost) or an invisible spacer that keeps the lengths true
    const on = !!rev[k];
    if (!on && !ghost) return `<div class="seg spacer" style="flex-grow:${grow}"></div>`;
    return el(k, `seg ${cls}`, `flex-grow:${grow}`, on, body(k, on, things));
  };
  const brace = (k) => el(k, 'brace', '', !!rev[k], body(k, !!rev[k], false));
  let h = '';
  if (S !== 'groups'){
    const [top, p, q] = S === 'compare' ? ['big', 'small', 'diff'] : ['whole', 'a', 'b'];
    const cls = { whole:'seg-whole', a:'seg-a', b:S === 'remove' ? 'seg-gone' : 'seg-b', big:'seg-big', small:'seg-small', diff:'seg-diff' };
    const low = rev[p] || rev[q], ghostLow = o.ask || (rev[top] && low);
    const lowRow = `<div class="bar-row">${seg(p, cls[p], val(p), ghostLow)}${seg(q, cls[q], val(q), ghostLow)}</div>`;
    if (obj && S !== 'compare' && (low || o.ask)){
      if (rev[top] || o.ask) h += brace(top);
      h += lowRow;
    } else {
      if (rev[top] || o.ask) h += `<div class="bar-row">${seg(top, cls[top], 1, true)}</div>`;
      if (low || o.ask) h += lowRow;
    }
  } else {
    const n = Math.max(1, Math.min(val('count'), 10)), boxesOn = rev.size || rev.count || o.ask;
    const sizeN = rev.size ? num('size') : null, fr = o.fresh === 'count' || o.fresh === 'size' ? ' fresh' : '';
    if (rev.total || o.ask) h += obj && boxesOn ? brace('total') : `<div class="bar-row">${seg('total', 'seg-whole', 1, true)}</div>`;
    if (boxesOn){   // an unknown count must not be countable on the picture, so its boxes stay a single "…"
      let boxes = seg('size', 'seg-box first', 1, true);
      if (rev.count && (sl.count !== '?' || o.reveal)) boxes += Array.from({ length:n - 1 }, () => `<div class="seg seg-box${rev.size ? '' : ' ghost'}${fr}" style="flex-grow:1">${rev.size && obj && sizeN != null ? objs(sizeN, it) : ''}<span class="box-val">${rev.size ? (sizeN ?? '?') : ''}</span></div>`).join('');
      else boxes += rev.total || o.ask ? `<div class="seg seg-more ghost" style="flex-grow:${n - 1}"><span class="box-val">…</span></div>` : `<div class="seg spacer" style="flex-grow:${n - 1}"></div>`;
      h += `<div class="bar-row boxes">${boxes}</div>`;
    }
    if (rev.count || o.ask) h += `<div class="count-row">${seg('count', 'seg-count', 0, true, false)}</div>`;
  }
  return `<div class="dia ${obj ? 'obj' : 'bar'}${o.morph ? ' morph' : ''}">${h}</div>`;
}
const modeSwitch = () => `<div class="seg-ctl mode-ctl" role="group" aria-label="Как рисовать"><button class="${M.mode === 'obj' ? 'on' : ''}" data-act="mode" data-m="obj">Предметы</button><button class="${M.mode === 'bar' ? 'on' : ''}" data-act="mode" data-m="bar">Полоски</button></div>`;

/* ---------- step 1: the story sentence by sentence, on the picture ----------
   Each sentence comes with a question about the story itself: pick the RIGHT EXPLANATION of three.
   Wrong picks come back at the end ("повтор"), so tapping at random only makes the mission longer. */
const rpNew = () => ({ i:0, phase:'', redo:null, miss:[], lqOrder:null, picked:null, pickedWhy:'', qMiss:false, qMsg:'', fresh:null, done:false });
function rpCur(){ const rp = M.rp, j = rp.redo ? rp.redo[0] : rp.i; return [j, M.cfg.events[j]]; }
function rpEnter(){
  const rp = M.rp, [, e] = rpCur();
  Object.assign(rp, { lqOrder:null, picked:null, pickedWhy:'', qMiss:false, qMsg:'', fresh:null });
  if (e.ask) rp.phase = 'ask';
  else if (e.lq) rp.phase = 'q';
  else { rp.phase = 'shown'; rp.fresh = e.r; }
}
const rpText = (t) => t.replace(/(\d+)/g, '<span class="n">$1</span>');
const pieceCap = (k) => { const n = M.cfg.slots[k]; return `<p class="piece-cap">На картинке: <b>${M.cfg.labels[k]} — ${n}</b>${M.m.item ? packsText(n) : ''}.</p>`; };

function rpHTML(){
  const rp = M.rp, evs = M.cfg.events, [j, e] = rpCur();
  const showMode = store.get('bars', false);
  if (rp.done){
    return `<section class="card replay-card">
      <div class="beat-head"><span class="eyebrow">Готово</span>${showMode ? modeSwitch() : ''}</div>
      <h2>Вся история на картинке</h2>
      ${sceneDia(allRev(), { mode:M.mode })}
      <p class="rule">Всё, что известно, нарисовано. Знак <span class="n">?</span> стоит там, что нужно найти.</p>
      <div class="row"><button class="btn" data-act="step" data-to="2">Дальше: превращаем в схему →</button></div></section>`;
  }
  const rev = {}; evs.slice(0, j).forEach(x => { rev[x.r] = true; });
  if (rp.phase === 'shown') rev[e.r] = true;
  const head = `<div class="beat-head"><span class="eyebrow">${rp.redo ? 'Повтор: тут ты сначала ошибся' : `Предложение ${j + 1} из ${evs.length}`}</span>${showMode ? modeSwitch() : ''}</div>
    <p class="beat${rp.fresh || rp.phase !== 'shown' ? ' enter' : ''}">${rpText(e.t)}</p>`;
  if (e.ask){
    return `<section class="card replay-card">${head}
      <p class="prompt">Это вопрос задачи. Что нужно найти? Нажми на это место на картинке, туда встанет <span class="n">?</span></p>
      ${sceneDia(rev, { mode:M.mode, ask:true, qMiss:rp.qMiss })}
      ${rp.qMsg ? `<div class="feedback soft" aria-live="polite"><p>${rp.qMsg}</p></div>` : ''}</section>`;
  }
  let act;
  if (rp.phase === 'q'){
    if (!rp.lqOrder) rp.lqOrder = rpShuffle([0, 1, 2]);
    act = `<p class="prompt">${rpText(e.lq.q)}</p>
      <div class="answers three">${rp.lqOrder.map(i => `<button class="btn ghost" data-act="lq" data-i="${i}">${e.lq.opts[i].t}</button>`).join('')}</div>`;
  } else {
    const fb = e.lq ? `<div class="feedback ${rp.picked ? 'ok' : 'soft'}" aria-live="polite"><p><b>${rp.picked ? 'Верно.' : 'Не совсем.'}</b> ${rp.pickedWhy}</p></div>` : '';
    act = fb + pieceCap(e.r) + `<div class="row"><button class="btn" data-act="rnext">Следующее предложение →</button></div>`;
  }
  return `<section class="card replay-card">${head}
    ${sceneDia(rev, { mode:M.mode, fresh:rp.fresh })}
    ${act}</section>`;
}
const rpShuffle = (a) => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
function rpAnswer(i){
  const rp = M.rp, [j, e] = rpCur(), opt = e.lq.opts[i];
  rp.picked = opt.ok; rp.pickedWhy = opt.why; rp.phase = 'shown'; rp.fresh = e.r;
  if (!opt.ok && !rp.redo && !rp.miss.includes(j)) rp.miss.push(j);
  render();
}
function rpNext(){
  const rp = M.rp;
  if (rp.redo){ rp.redo.shift(); if (!rp.redo.length){ rp.redo = null; rp.done = true; render(); return; } }
  else rp.i++;
  rpEnter(); render();
}
function rpQuestion(k){
  const rp = M.rp, [, e] = rpCur(), c = M.cfg;
  if (k === e.r){
    if (rp.miss.length){ rp.redo = rp.miss.slice(); rpEnter(); }
    else rp.done = true;
  } else {
    rp.qMiss = true;
    rp.qMsg = `«${c.labels[k]}» мы уже знаем: ${c.slots[k]}. А спрашивают: «${e.t}» Найди на картинке пустое место.`;
  }
  render();
}

function renderMission(){
  const m = M.m, idx = TPLS.indexOf(m.tpl);
  const stepper = `<ol class="stepper">${STEPS.map((s, i) => { const cls = `${i < M.step ? 'past' : ''}${i === M.step ? ' now' : ''}`;
    return `<li class="${cls}">${i <= M.max && i !== M.step ? `<button data-act="step" data-to="${i}">${s}</button>` : `<span>${s}</span>`}</li>`; }).join('')}</ol>`;
  let body = '';

      <p class="tip">Представь сцену: кто там? что делает? что поменялось? Дальше нарисуем это по предложениям.</p>`;
  }

  if (M.step === 2){
    const sc = SCHEMAS[M.cfg.schema];
    body = storyMini(m) + `<section class="card">

      <p class="rule">Рисовать каждый предмет долго, а если их тысяча? Поэтому предметы заменяют <b>полоской</b>: чем больше предметов, тем длиннее полоска. Число пишут прямо на ней.</p>
      ${sceneDia(allRev(), { mode:M.mode, morph:M.morph })}
      ${M.barSeen ? `
        <div class="row"><button class="btn" data-act="step" data-to="3">Дальше: выбираем действие →</button></div>`
      : `<div class="row"><button class="btn" data-act="tobar">Превратить предметы в полоски</button></div>`}
      </section>
      ${M.barSeen ? `<section class="card">
        <div class="schema-name"><span class="eyebrow">Такая схема называется</span><b>${sc.name}</b><p>${sc.what}</p></div>
        <p class="dia-cap">Переключай «Предметы» и «Полоски» на верхней картинке: это одна и та же история, просто нарисована короче.</p>
      </section>` : ''}`;
  }

  if (M.step === 3){
    const d = derive(M.cfg), sc = SCHEMAS[M.cfg.schema], L = M.cfg.labels, unk = unkOf(M.cfg);
    const ops = [['+','Сложить'],['−','Вычесть'],['×','Умножить'],[':','Разделить']];
    body = storyMini(m) + `<section class="card">
      ${sceneDia(allRev(), { mode:M.mode })}
      <div class="schema-name"><span class="eyebrow">Схема</span><b>${sc.name}</b><p>${sc.what}</p></div>
      ${M.opOk ? `
        <p class="rule">${d.rule}</p>
        <p class="expr">${exprText(d)}</p>
        ${m.trap ? `<p class="trap">${m.trap}</p>` : ''}
        <div class="row"><button class="btn" data-act="step" data-to="4">Считаем →</button></div>`
      : `<p class="prompt">Каким действием найдём «${L[unk]}»? Сначала подумай, потом нажми.</p>
        <div class="ops" style="margin-top:12px">${ops.map(([o, n]) => `<button data-act="mop" data-op="${o}" aria-label="${n}">${o}</button>`).join('')}</div>
        ${M.opMsg ? `<div class="feedback soft" aria-live="polite"><p>${M.opMsg}</p></div>` : ''}`}
      </section>`;
  }

  if (M.step === 4){
    const d = derive(M.cfg);
    if (!M.solved3){
      const st = calcSteps(d).slice(0, M.hintN);
      body = storyMini(m) + `<section class="card">${sceneDia(allRev(), { mode:'bar' })}<p class="expr">${exprText(d)}</p>
        <div class="calc-grid">
          <div style="display:flex;flex-direction:column;gap:14px">
            <p class="rule">Посчитай в уме. Трудно — открой подсказку: она покажет шаги.</p>
            ${st.length ? `<ol class="steps">${st.map(s => `<li>${s}</li>`).join('')}</ol>` : ''}
            ${M.hintN < calcSteps(d).length ? `<div class="row"><button class="btn ghost" data-act="hint">${M.hintN ? 'Следующий шаг' : 'Как посчитать без пальцев?'}</button></div>` : ''}
            ${M.calcMsg ? `<div class="feedback soft"><p>${M.calcMsg}</p></div>` : ''}
          </div>
          ${padHTML('Твой ответ')}
        </div></section>`;
    } else {
      body = `<section class="card">
        <div class="win"><span class="win-goat" aria-hidden="true">🐐</span><div style="flex:1 1 260px;min-width:0"><h2>Миссия выполнена</h2>
        <p class="rule">${m.done.replace('{ans}', m.answer).replace('{unit}', plural(m.answer, m.unit))}</p></div></div>
        <p class="expr">${exprText(d, m.answer)}</p>
        <p class="check-line">Проверка наоборот: ${verifyOk(d, m.answer)}</p>
        <div class="beat-head"><span class="eyebrow">Ответ на картинке</span>${modeSwitch()}</div>
        ${sceneDia(allRev(), { mode:M.mode, reveal:true })}
        <div class="row"><button class="btn" data-act="step" data-to="5">Придумать свою историю →</button><button class="btn ghost" data-act="restart">Ещё раз с новыми числами</button><button class="btn ghost" data-act="go" data-go="missions">К миссиям</button></div></section>`;
    }
  }

  if (M.step === 5){
    const d = derive(M.cfg);
    const colors = ['#1b2230','#e0782f','#d94f73','#1f7f6b','#2b4acb','#e5b53a','#7a4a24'];
    body = `<section class="card">
      <h2>Теперь ты автор</h2>
      <p class="rule">Придумай свою историю, где тоже получается <b>${d.x} ${d.op} ${d.y}</b>. Про что угодно: машины, гонки, Гошу, своих героев. Напиши и нарисуй.</p>
      <div class="own-grid">
        <div style="display:flex;flex-direction:column;gap:10px"><label for="own-text"><b>Моя история</b></label>
          <textarea id="own-text" placeholder="Например: у Бакса было…"></textarea></div>
        <div class="canvas-wrap"><b>Мой рисунок</b>
          <canvas id="draw" width="800" height="500" aria-label="Поле для рисования"></canvas>
          <div class="tools">${colors.map(c => `<button class="swatch ${M.color === c ? 'on' : ''}" style="background:${c}" data-act="color" data-c="${c}" aria-label="Цвет"></button>`).join('')}
            <button class="tool ${M.size === 6 ? 'on' : ''}" data-act="brush" data-s="6">Тонко</button><button class="tool ${M.size === 16 ? 'on' : ''}" data-act="brush" data-s="16">Толсто</button>
            <button class="tool" data-act="eraser">Ластик</button><button class="tool" data-act="clear">Очистить</button></div></div>
      </div>
      <p id="save-msg" class="rule" hidden></p>
      <div class="row"><button class="btn mint" data-act="save-own">Сохранить в альбом</button><button class="btn ghost" data-act="go" data-go="missions">Пропустить</button></div></section>`;
  }

  app.innerHTML = topbar(`Миссия ${idx + 1} · ${m.title}`, 'missions', '← Все миссии') + stepper + body;
  if (M.step === 4 && !M.solved3) PAD.submit = submitMission;
  if (M.step === 5) initCanvas();
  M.rp.fresh = null; M.morph = false;   // a new piece animates once
}

function submitMission(g){
  const d = derive(M.cfg), ans = M.m.answer;
  if (g === ans){
    M.solved3 = true; M.max = Math.max(M.max, 5);
    const done = store.get('done', []); if (!done.includes(M.m.id)){ done.push(M.m.id); store.set('done', done); }
  } else {
    M.calcTries++;
    if (M.calcTries >= 2 && calcSteps(d).length){
      M.hintN = calcSteps(d).length;
      M.calcMsg = 'Разберём по шагам. Дойди по ним до конца и введи ответ.';
    } else M.calcMsg = verify(d, g, ans);
  }
  render();
}

/* drawing */
let drawCtx = null, drawing = false, eraser = false, last = null;
function initCanvas(){
  const cv = $('#draw'); if (!cv) return;
  drawCtx = cv.getContext('2d'); drawCtx.fillStyle = '#fff'; drawCtx.fillRect(0, 0, cv.width, cv.height);
  drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round'; eraser = false;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener('pointerdown', e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); dot(last); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); line(last, p); last = p; });
  const stop = () => { drawing = false; };
  cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
}
function stroke(){ drawCtx.strokeStyle = eraser ? '#fff' : M.color; drawCtx.fillStyle = drawCtx.strokeStyle; drawCtx.lineWidth = eraser ? 28 : M.size; }
function dot(p){ stroke(); drawCtx.beginPath(); drawCtx.arc(p[0], p[1], drawCtx.lineWidth / 2, 0, Math.PI * 2); drawCtx.fill(); }
function line(a, b){ stroke(); drawCtx.beginPath(); drawCtx.moveTo(a[0], a[1]); drawCtx.lineTo(b[0], b[1]); drawCtx.stroke(); }
function setTool(sel, attr, val){ document.querySelectorAll(sel).forEach(b => b.classList.toggle('on', b.dataset[attr] === String(val))); }
function saveOwn(){
  const text = $('#own-text').value.trim(), msg = $('#save-msg'), d = derive(M.cfg);
  msg.hidden = false;
  if (!text){ msg.textContent = 'Напиши хотя бы пару предложений: что случилось в твоей истории?'; return; }
  const img = $('#draw').toDataURL('image/jpeg', .7);
  const album = store.get('album', []);
  album.unshift({ id:Date.now(), mission:M.m.title, expr:`${d.x} ${d.op} ${d.y}`, text, img, date:new Date().toLocaleDateString('ru-RU') });
  if (store.set('album', album)) { msg.textContent = 'Сохранено в альбом! Покажи историю взрослым, пусть решат.'; }
  else msg.textContent = 'Не получилось сохранить: в браузере закончилось место или сохранение выключено.';
}

VIEWS.mission = renderMission;
ACTIONS.open = (t) => openMission(t.dataset.id);
ACTIONS.restart = () => openMission(M.m.id);
ACTIONS.step = (t) => { M.step = +t.dataset.to; M.max = Math.max(M.max, M.step); M.hintN = 0; M.calcMsg = '';
  if (M.step === 2 && !M.barSeen) M.mode = 'obj';
  render(); window.scrollTo(0, 0); };
ACTIONS.lq = (t) => rpAnswer(+t.dataset.i);
ACTIONS.rnext = () => rpNext();
ACTIONS.rq = (t) => rpQuestion(t.dataset.k);
ACTIONS.mode = (t) => { M.mode = t.dataset.m; render(); };
ACTIONS.tobar = () => { M.barSeen = true; M.mode = 'bar'; M.morph = true; store.set('bars', true); render(); };
ACTIONS.mop = (t) => {
  const d = derive(M.cfg);
  if (t.dataset.op === d.op){ M.opOk = d.op; M.opMsg = ''; M.max = Math.max(M.max, 4); }
  else M.opMsg = opWhy(d, t.dataset.op);
  render();
};
ACTIONS.hint = () => { M.hintN++; render(); };
ACTIONS.color = (t) => { M.color = t.dataset.c; eraser = false; setTool('.swatch', 'c', M.color); document.querySelectorAll('[data-act="eraser"]').forEach(b => b.classList.remove('on')); };
ACTIONS.brush = (t) => { M.size = +t.dataset.s; eraser = false; setTool('[data-act="brush"]', 's', M.size); };
ACTIONS.eraser = (t) => { eraser = !eraser; t.classList.toggle('on', eraser); };
ACTIONS.clear = () => { const cv = $('#draw'); drawCtx.fillStyle = '#fff'; drawCtx.fillRect(0, 0, cv.width, cv.height); };
ACTIONS['save-own'] = () => saveOwn();

      <span class="meta">${done.length} из ${TPLS.length} пройдено</span>
    </button>
`; } });

/* schemas trainer «Какая схема?»: rapid-fire recognition practice.
   Each task: a fresh story (random template, random numbers) -> pick one of the four bar schemas ->
   pick the operation. Wrong picks are explained and the task does not move on until it is solved,
   so random tapping just shows more explanations. Score counts first-try answers only. */
(() => {
const KINDS = ['join', 'remove', 'compare', 'groups'];
const HINT = {
  join:'Подсказка: в истории две части складываются в одно целое.',
  remove:'Подсказка: в истории что-то было, часть ушла — ищут остаток (или сколько было сначала).',
  compare:'Подсказка: в истории два героя и слова «на сколько» или «на … больше / меньше».',
  groups:'Подсказка: в истории есть одинаковые порции: «по столько-то» или «поровну».'
};
let SH = null;

function newRound(){
  const tasks = [], used = {};
  for (let i = 0; i < 10; i++){
    let tpl, guard = 0;
    do { tpl = TPLS[rand(0, TPLS.length - 1)]; guard++; } while (used[tpl.id] && guard < 40);
    used[tpl.id] = 1;
    tasks.push({ m:buildMission(tpl), sMiss:0, oMiss:0, sFirst:false, oFirst:false, sOrder:null });
  }
  SH = { tasks, i:0, phase:'schema', fb:'', opFb:'', wrong:null };
}

/* tiny bar diagrams, the same shapes the missions use */
function miniDia(k){
  const row = (...cells) => `<div class="ms-row">${cells.map(([c, w]) => `<i class="${c}" style="flex:${w} 1 0"></i>`).join('')}</div>`;
  if (k === 'join') return `<div class="ms">${row(['v', 10])}${row(['m', 5], ['s', 5])}</div>`;
  if (k === 'remove') return `<div class="ms">${row(['v', 10])}${row(['m', 6], ['g', 4])}</div>`;
  if (k === 'compare') return `<div class="ms">${row(['s', 10])}${row(['m', 7], ['d', 3])}</div>`;
  return `<div class="ms">${row(['v', 10])}${row(['m', 3], ['m', 3], ['m', 3])}</div>`;
}

function taskHTML(){
  const t = SH.tasks[SH.i], m = t.m, sc = m.schema;
  const story = `<section class="card story-mini"><span class="story-icon" aria-hidden="true">${m.icon}</span>
    <div><span class="eyebrow">Задача ${SH.i + 1} из ${SH.tasks.length} </span>
    <p class="story-text">${m.text.replace(/(\d+)/g, '<span class="n">$1</span>')}</p></div></section>`;

  if (SH.phase === 'schema'){
    if (!t.sOrder) t.sOrder = KINDS.slice().sort(() => Math.random() - .5);
    return story + `<section class="card">
      <p class="prompt">Какая схема подходит этой истории?</p>
      <div class="sch-grid">${t.sOrder.map(k => `
        <button class="sch-card${SH.wrong === k ? ' wrong' : ''}${t.sMiss >= 2 && k === sc ? ' hint' : ''}" data-act="spick" data-k="${k}">
          <h4>${SCHEMAS[k].name}</h4>${miniDia(k)}<small>${SCHEMAS[k].what}</small>
        </button>`).join('')}</div>
      ${SH.fb ? `<div class="feedback soft" aria-live="polite"><p>${SH.fb}</p></div>` : ''}
    </section>`;
  }

  const d = m.d, ops = [['+','Сложить'],['−','Вычесть'],['×','Умножить'],[':','Разделить']];
  if (SH.phase === 'done'){
    return story + `<section class="card">
      <div class="win"><span class="win-goat" aria-hidden="true">🐐</span><div><h2>Верно!</h2>
        <p class="check-line">${SCHEMAS[sc].name} · ${d.x} ${d.op} ${d.y} = ${m.answer}</p>
        <p class="rule">${d.rule}</p></div></div>
      <div class="row"><button class="btn mint" data-act="snext">${SH.i + 1 < SH.tasks.length ? 'Следующая задача →' : 'Итог →'}</button></div>
    </section>`;
  }
  return story + `<section class="card">
    <div class="schema-name"><span class="eyebrow">Схема</span><b>${SCHEMAS[sc].name}</b><p>${SCHEMAS[sc].what}</p></div>
    <p class="prompt">Каким действием найдём «${m.labels[unkOf(m.cfg)]}»?</p>
    <div class="ops">${ops.map(([o, n]) => `<button data-act="sop" data-op="${o}" aria-label="${n}">${o}</button>`).join('')}</div>
    ${SH.opFb ? `<div class="feedback soft" aria-live="polite"><p>${SH.opFb}</p></div>` : ''}
  </section>`;
}

function finishHTML(){

/* two-step word problems «Два шага»: the kid PLANS the solution first.
   Flow: story -> "what do we find first?" (pick the right intermediate question of three) ->
   answer intermediate step(s) on the keypad -> pick the final operation -> final answer ->
   full numbered solution + reverse check. Numbers are generated fresh every time; wrong picks and
   answers are explained, and after two misses the step chain is shown. */
(() => {
const f = (n, k) => `${n} ${plural(n, PLUR[k])}`;

const TYPES = [
  { /* заработал и потратил: (A + B) − C */
    make(){
      const A = rand(20, 60), B = rand(15, 45), C = rand(12, A + B - 12);

        text:`У Гоши было ${f(A,'монета')}. За день он заработал ещё ${f(B,'монета')}, а вечером потратил ${f(C,'монета')} на корм для Бакса. Сколько монет у него осталось?`,
        plans:[
          { t:`Сколько монет стало, когда Гоша заработал ещё ${f(B,'монета')}?`, ok:true,
            why:'Верно. Сначала узнаем, сколько стало, и только потом вычтем корм.' },
          { t:'Сколько монет осталось у Гоши?', why:'Это ГЛАВНЫЙ вопрос задачи, он самый последний. Пока мы не знаем, сколько стало, на него не ответить.' },
          { t:'Сколько монет Гоша потратил на корм?', why:`Это уже написано в истории: ${f(C,'монета')}. Считать не нужно.` } ],
        steps:[{ q:'Шаг 1: сколько монет стало после заработка?', x:A, op:'+', y:B, ans:mid, label:'стало после заработка' }],
        fin:{ op:'−', x:mid, y:C, ans, q:'Последний шаг: сколько осталось после корма?', label:'осталось' },
        check:`${ans} + ${C} = ${mid}`
      };
    } },
  { /* мороженое и лимонад: n·p + k */
    make(){
      const n = rand(3, 6), p = rand(8, 25), k = rand(30, 70);
      const mid = n * p, ans = mid + k;
      return {
        text:`Гоша купил ${f(n,'порция')} мороженого по ${f(p,'монета')} и бутылку лимонада за ${f(k,'монета')}. Сколько всего монет он заплатил?`,
        plans:[
          { t:`Сколько стоят все ${plural(n, ['порция','порции','порций'])} мороженого?`, ok:true,
            why:'Верно. Сначала посчитаем мороженое, потом добавим лимонад.' },
          { t:'Сколько всего монет Гоша заплатил?', why:'Это ГЛАВНЫЙ вопрос задачи. Чтобы на него ответить, сначала посчитаем мороженое.' },
          { t:'Сколько стоит одна порция мороженого?', why:`Это уже написано в истории: ${f(p,'монета')}. Считать не нужно.` } ],
        steps:[{ q:'Шаг 1: сколько стоят все порции мороженого?', x:p, op:'×', y:n, ans:mid, label:'мороженое' }],
        fin:{ op:'+', x:mid, y:k, ans, q:'Последний шаг: сколько заплатил всего?', label:'всего заплатил' },
        check:`${ans} − ${k} = ${mid}`
      };
    } },
  { /* копилка и наклейки: A − n·p */
    make(){
      const n = rand(3, 5), p = rand(9, 20), A = n * p + rand(15, 60);
      const mid = n * p, ans = A - mid;
      return {
        text:`В копилке у Гоши лежало ${f(A,'монета')}. Он достал деньги и купил ${f(n,'наклейка')} по ${f(p,'монета')}. Сколько монет осталось в копилке?`,
        plans:[
          { t:'Сколько монет ушли на наклейки?', ok:true,
            why:'Верно. Сначала узнаем, сколько он заплатил, потом вычтем это из копилки.' },
          { t:'Сколько монет осталось в копилке?', why:'Это ГЛАВНЫЙ вопрос задачи. Пока мы не знаем стоимость наклеек, на него не ответить.' },

    } },
  { /* Гоша и Бакс вместе: X + (X − d) */
    make(){

        text:`Гоша наиграл в автомате ${f(X,'монета')}, а пёс Бакс — на ${f(d,'монета')} меньше. Сколько монет они наиграли вместе?`,

  { /* билеты и жетоны: n·p + m·q */
    make(){

          { t:'Сколько стоит один жетон?', why:`Это уже написано в истории: ${f(q,'монета')}. Считать не нужно.` } ],

        fin:{ op:'+', x:s1, y:s2, ans, q:'Последний шаг: сколько заплатил всего?', label:'всего заплатил' },

    } }
];

/* step chain for a hint: full reasoning, the last number hidden for the kid */
function chainFor(s){
  let st = s.op === '+' ? addSteps(s.x, s.y) : s.op === '−' ? subSteps(s.x, s.y)
    : [`«По ${s.x} взять ${s.y} раз»: ${Array(s.y).fill(s.x).join(' + ')} = ${s.x * s.y}`];
  st = st.slice();
  const last = st.length - 1;
  st[last] = st[last].replace(/= -?\d+$/, '= ?');
  return st;
}

let TW = null;

    let ti; do { ti = rand(0, TYPES.length - 1); } while (ti === prev && TYPES.length > 1);
    prev = ti;
    tasks.push({ t:TYPES[ti].make(), order:null, planMiss:0, stepMiss:0, finMiss:0, opOk:null,
                 planFirst:false, finFirst:false, si:0, opMsg:'', msg:'' });

  TW = { tasks, i:0, phase:'plan', fb:'' };
}

}

      <p class="tip-ink">Лучший результат: план ${best.split(':')[0]} из 8</p>

/* tens trainer "Без пальцев": a bus with 10 seats.
   Add: passengers board until the bus is full (10), the full bus parks, the rest ride the next bus.
   Sub: passengers get off the part-full bus first, then a full bus (10) comes out of the parking.
   Number on screen = parked buses × 10 + passengers in the working bus. */
(() => {
let T = null, T_UID = 0, T_TIMERS = [], T_HAND = null;
const T_FACES = ['🧑','👩','👨','🧒','👵','👦','👧','🧔','👴','👱','🐶','🐷'];
const tRep = (n, k) => Array(Math.max(0, n)).fill(k);
const tLater = (ms, fn) => T_TIMERS.push(setTimeout(fn, reduced ? Math.min(ms, 120) : ms));
function tStopTimers(){ T_TIMERS.forEach(clearTimeout); T_TIMERS = []; }

function makeTens(mode, level, a, b){
  const t = Math.floor(a / 10), o = a % 10;
  const s = { mode, level, a, b, depot:[], bus:null, stop:[], out:[], phase:'play', demo:false, msg:'', busFx:'' };
  for (let i = 0; i < t; i++) s.depot.push(++T_UID);
  s.bus = { id:++T_UID, pax: Array.from({ length:o }, () => ({ id:++T_UID, k:'o' })) };
  if (mode === 'add') s.stop = Array.from({ length:b }, () => ({ id:++T_UID, k:'n' }));
  return s;
}
function newTens(mode = T ? T.mode : 'add', level = T ? T.level : '20'){
  tStopTimers();
  let a, b;
  if (mode === 'add'){
    if (level === '20'){ a = rand(6, 9); b = rand(11 - a, 9); }
    else { const t = rand(1, 7), o = rand(5, 9); b = rand(11 - o, 9); a = 10 * t + o; }
  } else {
    if (level === '20'){ const o = rand(1, 8); b = rand(o + 1, 9); a = 10 + o; }
    else { const t = rand(2, 9), o = rand(1, 8); b = rand(o + 1, 9); a = 10 * t + o; }
  }
  T = makeTens(mode, level, a, b);
}
function demoSeen(mode){ return store.get('tens_demo_' + mode, false); }

/* ---------- moves ---------- */
function tapPax(id){
  if (!T || T.phase !== 'play') return;
  if (T.mode === 'add'){
    const i = T.stop.findIndex(p => p.id === id); if (i < 0) return;
    T.bus.pax.push(T.stop.splice(i, 1)[0]);
    if (T.bus.pax.length === 10){ T.phase = 'auto'; drawTens(); tLater(1000, parkBus); }
    else drawTens();
  } else {
    const i = T.bus.pax.findIndex(p => p.id === id); if (i < 0) return;
    const p = T.bus.pax.splice(i, 1)[0]; p.k = 'x'; T.out.push(p);
    if (T.out.length === T.b){ T.phase = 'auto'; drawTens(); tLater(800, finishAuto); }
    else if (!T.bus.pax.length){ T.phase = 'auto'; drawTens(); tLater(500, () => { T.busFx = 'leave'; drawTens(); tLater(800, unparkBus); }); }
    else drawTens();
  }
}
/* full bus drives into the parking, an empty one pulls up, the rest board by themselves */

  if (T.stop.length){ T.bus.pax.push(T.stop.shift()); drawTens(); tLater(550, boardRest); }
  else tLater(400, finishAuto);
}
/* empty bus has left; a full bus (10) comes out of the parking */
function unparkBus(){
  T.bus = { id:T.depot.pop(), pax: Array.from({ length:10 }, () => ({ id:++T_UID, k:'o', fresh:1 })) };

}

const TRI_TYPES = {

function triType(s){

  if (s[0] === s[1] || s[1] === s[2] || s[0] === s[2]) return 'isosceles';

}
const needPred = (t) => (t.kind === 'predict' || t.predict) && P.pred == null;
const needPick = (t) => t.pick && !P.picked;

const CELL = 40, X0 = 1, Y0 = 1;
function perimPoint(w, h, d){
  if (d <= w) return [d, 0];

const TRI_COL = '#e8590c';
function triGeom(sd){
  const [a, b, c] = sd;                        // AB, BC, CA
  const cx = (a * a + c * c - b * b) / (2 * a), cy = Math.sqrt(Math.max(0, c * c - cx * cx));

  const ox = (480 - (maxx - minx) * k) / 2 - minx * k, oy = 320 - (320 - cy * k) / 2 - 10;

function triPoint(V, sd, d){

  const sd = [P.pos >= w, P.pos >= w + h, P.pos >= 2 * w + h, P.pos >= per];
  s += `<text class="lbl ${sd[0] ? 'done' : ''}" x="${px(w / 2)}" y="${py(0) - 10}" text-anchor="middle">${w} м</text>`;
  s += `<text class="lbl ${sd[1] ? 'done' : ''}" x="${px(w) + 12}" y="${py(h / 2) + 6}">${h} м</text>`;
  s += `<text class="lbl ${sd[2] ? 'done' : ''}" x="${px(w / 2)}" y="${py(h) + 24}" text-anchor="middle">${w} м</text>`;
  s += `<text class="lbl ${sd[3] ? 'done' : ''}" x="${px(0) - 12}" y="${py(h / 2) + 6}" text-anchor="end">${h} м</text>`;
  const gp = P.walking || P.walked ? perimPoint(w, h, P.pos).map((v, i) => i ? py(v) : px(v)) : [px(w / 2), py(h / 2)];
  s += `<text x="${gp[0]}" y="${gp[1] + 11}" font-size="32" text-anchor="middle">🐐</text>`;
  svg.innerHTML = s;
  const c = $('#pen-count'); if (c) c.textContent = P.pos;
}
function penChain(w, h){
  const per = 2 * (w + h);
  const short = w === h ? `${w} × 4 = ${per}: четыре одинаковые стороны, значит, можно умножить.` : `(${w} + ${h}) × 2 = ${per}: пара сторон «${w} и ${h}» повторяется 2 раза.`;
  return `<p class="chain">${w} + ${h} + ${w} + ${h} = ${per} м</p><p class="rule">Короче: ${short}</p>
    <p class="rule">Длина забора вокруг загона называется <b>периметр</b>. А клетки внутри — это место для Гоши: ${w} × ${h} = ${w * h} клеток. Это <b>площадь</b>.</p>`;
}
function triChain(t){
  const [a, b, c] = t.sides, per = a + b + c, type = triType(t.sides), ty = TRI_TYPES[type];
  const head = `<p class="rule">Это <b>${ty.name.toLowerCase()}</b> треугольник: ${ty.rule}.</p>`;
  if (type === 'scalene') return `${head}<p class="chain">${a} + ${b} + ${c} = ${per} м</p><p class="rule">Все стороны разные, повторов нет, поэтому умножать нечего: только складываем.</p>`;
  if (type === 'equilateral') return `${head}<p class="chain">${a} + ${a} + ${a} = ${per} м</p><p class="rule">Короче: ${a} × 3 = ${per}. Три одинаковые стороны, значит, можно умножить, как у квадрата.</p>`;
  const [e, o] = a === b ? [a, c] : a === c ? [a, b] : [b, a];
  return `${head}<p class="chain">${e} + ${e} + ${o} = ${per} м</p><p class="rule">Короче: ${e} × 2 + ${o} = ${per}. Одинаковые стороны умножаем, а третью просто прибавляем.</p>`;
}
function walk(){
  if (P.walking) return;
  const t = PEN_TASKS[P.t];
  if (needPred(t) || needPick(t)) return;
  const per = penPer(t);
  P.walking = true; P.walked = false; P.pos = 0; P.result = ''; P.phase = '';
  renderPen();
  P.timer = setInterval(() => {
    P.pos++; drawPen();
    if (P.pos >= per){ clearInterval(P.timer); P.timer = null; P.walking = false; P.walked = true; afterWalk(per); }
  }, reduced ? 60 : 230);
}
function penDone(){ const d = store.get('penDone', []); if (!d.includes(P.t)){ d.push(P.t); store.set('penDone', d); } }
function afterWalk(per){
  const t = PEN_TASKS[P.t], { w, h } = P;
  if (t.kind === 'tri'){
    const rt = t.predict && P.pred !== per ? `<p class="rule">Гоша насчитал ${per} м, а у тебя было ${P.pred}. Посмотри, как он считал:</p>` : t.predict ? `<p class="rule"><b>Ты посчитал точно: ${per} м!</b></p>` : `<p class="rule"><b>Гоша насчитал ${per} м забора.</b></p>`;
    P.result = rt + triChain(t);
    if (!t.predict || P.pred === per) penDone();
  } else if (t.kind === 'build'){
    const ok = (w === t.w && h === t.h) || (w === t.h && h === t.w);
    P.result = (ok ? '<p class="rule"><b>Готово, загон 5 на 3!</b> Гоша насчитал:</p>' : `<p class="rule">Загон получился ${w} на ${h}, а нужен 5 на 3. Но посмотри, сколько забора ушло:</p>`) + penChain(w, h);
    if (ok) penDone();
  } else if (t.kind === 'predict'){
    P.result = (P.pred === per ? `<p class="rule"><b>Ты посчитал точно: ${per} м!</b></p>` : `<p class="rule">Гоша насчитал ${per} м, а у тебя было ${P.pred}. Посмотри: у квадрата 4 стороны, и каждая по 4 метра.</p>`) + penChain(w, h);
    if (P.pred === per) penDone();
  } else if (t.kind === 'target'){
    if (per === t.target){
      const key = [Math.min(w, h), Math.max(w, h)].join('×');
      if (!P.found.includes(key)) P.found.push(key);
      const list = P.found.map(k => { const [a, b] = k.split('×').map(Number); return `<span>${a} на ${b}: места ${a * b} клеток</span>`; }).join('');
      P.result = `<p class="rule"><b>Ровно 20 метров!</b> ${w} + ${h} + ${w} + ${h} = 20.</p><p class="rule">Найдено загонов: ${P.found.length}. ${P.found.length < 3 ? 'Попробуй найти ещё один, по-другому.' : 'Сравни места внутри: в каком загоне Гоше просторнее всего? Забор одинаковый, а места разное!'}</p><div class="found">${list}</div>`;
      if (P.found.length >= 2) penDone();
    } else {
      P.result = `<p class="rule">Ушло ${per} м: ${w} + ${h} + ${w} + ${h} = ${per}. ${per < 20 ? 'Забор ещё остался, сделай загон побольше.' : 'Забора не хватило, сделай загон поменьше.'}</p>`;
    }
  } else if (t.kind === 'cost'){
    P.phase = 'op';
    P.result = `<p class="chain">6 + 2 + 6 + 2 = ${per} м забора</p><p class="rule">Каждый метр стоит 3 монеты. Какое действие поможет узнать цену всего забора?</p>`;
  }
  renderPen();
}
function penOp(op){
  if (op === '×'){ P.phase = 'calc'; P.result = `<p class="chain">16 м по 3 монеты: 3 × 16 = ?</p><p class="rule">Верно, умножение: одна и та же цена повторяется 16 раз. Подсказка: 3 × 16 = 3 × 10 + 3 × 6.</p>`; }
  else P.result = `<p class="chain">6 + 2 + 6 + 2 = 16 м забора</p><p class="rule">${{ '+':'Если сложить 16 и 3, получится, будто метров стало на 3 больше. А нам за каждый метр нужно заплатить по 3 монеты.', '−':'Вычитать — это убирать. Мы ничего не убираем, а платим за каждый метр.', ':':'Делить — это раздавать поровну. А тут за каждый из 16 метров платим одно и то же: по 3 монеты.' }[op]} Попробуй другое действие.</p>`;

}
function penPick(k){
  const t = PEN_TASKS[P.t];
  if (k === triType(t.sides)){

    P.result = `<p class="rule"><b>Верно!</b> ${ty.name} треугольник: ${ty.rule}. Одинаковые стороны покрашены одним цветом и отмечены чёрточкой. Запускай Гошу, он посчитает забор.</p>`;
  } else {
    P.result = `<p class="rule">Не совсем. Сравни числа: ${t.sides.join(', ')}. Сколько среди них одинаковых? Попробуй ещё.</p>`;

}
function renderPen(){

      ${tri && (!t.pick || P.picked) ? `<p class="tri-type"><b>${TRI_TYPES[triType(t.sides)].name}</b> треугольник: ${TRI_TYPES[triType(t.sides)].rule}</p>` : ''}

        ${tri ? '' : `<div class="dim">Высота <button data-act="pdim" data-d="h-" ${dis || P.h <= 1 ? 'disabled' : ''} aria-label="Ниже">−</button><output>${P.h}</output><button data-act="pdim" data-d="h+" ${dis || P.h >= 6 ? 'disabled' : ''} aria-label="Выше">+</button></div>`}

const rub = (n) => n + ' ₽';

let S = null;   // current task state

/* ---------- helpers ---------- */
function groups(src){ const b = src || S.basket; return KEYS.filter(k => b[k] > 0).map(k => ({ k, n:b[k], p:ITEMS[k].p, it:ITEMS[k] })); }
function sumOf(b){ return groups(b).reduce((s, g) => s + g.n * g.p, 0); }

/* stops for counting up from `small` to `big` via round numbers: 435 -> 440 -> 500 -> 1000 */
function upSteps(small, big, names){
  const stops = [small];
  const r10 = Math.ceil(small / 10) * 10, r100 = Math.ceil(small / 100) * 100;
  if (r10 > small && r10 < big) stops.push(r10);
  if (r100 > stops[stops.length - 1] && r100 < big) stops.push(r100);
  stops.push(big);
  const out = [];
  for (let i = 0; i < stops.length - 1; i++){
    const a = stops[i], b = stops[i + 1], d = b - a;
    out.push({ label:`От ${a} до ${b}: сколько добавить?`, answer:d, reveal:`От ${a} до ${b} добавить ${d}: ${a} + ${d} = ${b}.` });
  }
  return out;
}

/* generic "big − small = ?" question, checked by small + answer = big */
function subSpec(o){

        rows:[{ l:n.big, segs:[{ v:big, c:'a', t:big }] }, { l:'Проверка', segs:[{ v:small, c:'b', t:small }, { v, c:'c', t:v }] }] };
    },
    steps:upSteps(small, big, n),
    win:`Проверка: ${small} + ${ans} = ${big}. Сходится!`,
    trio:trio([{ l:n.big, v:big }, { l:n.small, v:small }, { l:n.ans, v:ans }])

}

function totalSpec(){

  let steps = [], win;

    win = `${g.p} × ${g.n} = ${S.total}: ${g.n} одинаковых блока по ${g.p} — это умножение.`;
  } else {
    const subs = [];
    gs.forEach(g => {
      if (g.n > 1){
        const list = Array.from({ length:g.n }, (_, i) => g.p * (i + 1)).join(', ');
        steps.push({ label:`${g.n} ${nameOf(g.k, g.n)} по ${g.p} — сколько это?`, answer:g.n * g.p, reveal:`${g.p} × ${g.n}: ${list}. Итого ${g.n * g.p}.` });
      }
      subs.push(g.n * g.p);
    });
    let run = subs[0];
    for (let i = 1; i < subs.length; i++){
      const nx = run + subs[i];
      steps.push({ label:`${run} + ${subs[i]} = ?`, answer:nx, reveal:`${run} + ${subs[i]} = ${nx}.` });
      run = nx;
    }
    win = subs.join(' + ') + ' = ' + S.total + '.';
  }
  return {
    label:'Сколько стоит вся корзина?', answer:S.total, ctx:'',
    wrong(v){
      if (gs.length === 1){
        const g = gs[0];
        return { text: v % g.n === 0
          ? `Проверим наоборот: ${v} ÷ ${g.n} = ${v / g.n}, а одна штука стоит ${g.p}. Не сходится.`
          : `Проверим наоборот: ${v} не делится на ${g.n} поровну, а блоки одинаковые (по ${g.p}). Не сходится.`, rows:rows(v) };
      }
      const est = gs.reduce((s, g) => s + g.n * Math.round(g.p / 10) * 10, 0);
      return { text:`Прикинем: если округлить цены до десятков, выйдет около ${est}. Ты сказал ${v}. ${Math.abs(v - est) <= units * 5 ? 'Близко, но посчитай точнее.' : 'Это далеко от прикидки.'}`, rows:rows(v) };
    },
    steps, win, trio:''
  };
}

function enoughSpec(){
  const have = S.t.have, total = S.total;
  if (total <= have) return subSpec({ big:have, small:total, label:'Хватит! Сколько денег останется?', n:{ big:'Есть', small:'Потратим', ans:'Останется' } });
  return subSpec({ big:total, small:have, label:'Не хватит. Сколько не хватает?', n:{ big:'Нужно', small:'Есть', ans:'Не хватает' } });
}
function buildSpec(stage){
  if (stage === 'total') return totalSpec();
  if (stage === 'change') return subSpec({ big:S.paidSum, small:S.total, label:'Сколько сдачи должен дать кассир?', n:{ big:'Дал', small:'Цена', ans:'Сдача' } });
  if (stage === 'left') return subSpec({ big:S.t.balance, small:S.total, label:'Сколько денег останется на карте?', n:{ big:'Было', small:'Потратил', ans:'Осталось' } });
  return enoughSpec();
}

/* ---------- state ---------- */
function start(id){
  const t = TASKS.find(x => x.id === id);
  S = { t, basket:{}, total:0, revealed:false, stages:t.stages.slice(), si:0, a:null, note:'', wallet:Object.assign({}, t.wallet || {}), paid:[], paidSum:0, payFb:'', pickFb:'', enough:null };
  go('shopTask');
}
function stage(){ return S.stages[S.si]; }
function next(){
  S.a = null; S.si++; S.note = ''; S.enough = null;
  while (S.si < S.stages.length){
    if (stage() === 'change' && S.paidSum === S.total){ S.note = 'Заплатил ровно: сдачи нет!'; S.si++; continue; }
    break;
  }
  if (S.si >= S.stages.length) finish(); else draw();
}
function finish(){
  const d = doneList(); if (!d.includes(S.t.id)){ d.push(S.t.id); store.set('shopDone', d); }
  S.finished = true; draw();
}

function draw(){

  const st = stage();

  const stepper = `<ol class="stepper">${vis.map(x => `<li class="${x === st ? 'now' : S.stages.indexOf(x) < S.si ? 'past' : ''}">${STAGE_NAME[x]}</li>`).join('')}</ol>`;
  let body = '';
  if (st === 'pick'){
    body = `<div class="sh-pick">${shelfHTML()}<div class="sh-side">${basketHTML()}${S.pickFb}
      <button class="btn mint" data-act="shopPick">Готово, это всё</button></div></div>`;
  } else if (st === 'pay'){
    body = `<div class="sh-pick">${basketHTML()}${walletHTML()}</div>`;
  } else if (st === 'enough' && !S.enough){
    body = `<div class="sh-pick">${basketHTML()}<section class="card sh-ask"><h2>Хватит ли денег?</h2>
      <div class="sh-trio"><div class="sh-tbox"><small>Есть</small><b>${rub(t.have)}</b></div><span class="sh-op">?</span><div class="sh-tbox"><small>Корзина</small><b>${rub(S.total)}</b></div></div>

  } else {

  if (S.a && !S.a.solved) PAD.submit = askSubmit;

    <button class="btn ghost" data-act="go" data-go="shop">К списку</button></div></section>`;

/* ---------- ask logic ---------- */
function askSubmit(v){
  const a = S.a; if (!a || a.solved) return;
  const sp = a.spec;
  if (a.mode === 'main'){
    if (v === sp.answer){ a.solved = true; a.fb = ''; if (stage() === 'total') revealTotal(); }
    else {
      a.tries++;
      const w = sp.wrong(v);
      a.fb = `<div class="sh-fb"><p>${w.text}</p>${bars(w.rows)}</div>`;
      if (a.tries >= 2 && sp.steps.length){ a.mode = 'steps'; a.si = 0; a.done = []; a.fb += '<p class="sh-lead">Ничего страшного! Разберём по шагам.</p>'; }
    }
  } else {
    const st = sp.steps[a.si];
    a.done.push({ st, ok:v === st.answer });
    a.si++;
    a.fb = '';
    if (a.si >= sp.steps.length){ a.solved = true; if (stage() === 'total') revealTotal(); }
  }
  const keep = window.scrollY; draw(); window.scrollTo(0, keep);
}
function revealTotal(){ S.revealed = true; }

/* ---------- actions ---------- */
ACTIONS.shopOpen = (t) => start(parseInt(t.dataset.t, 10));
ACTIONS.shopAdd = (t) => { const k = t.dataset.k; if ((S.basket[k] || 0) < 9){ S.basket[k] = (S.basket[k] || 0) + 1; S.pickFb = ''; keepDraw(); } };
ACTIONS.shopSub = (t) => { const k = t.dataset.k; if (S.basket[k] > 0){ S.basket[k]--; S.pickFb = ''; keepDraw(); } };
function keepDraw(){ const y = window.scrollY; draw(); window.scrollTo(0, y); }
ACTIONS.shopPick = () => {
  const want = S.t.want, diff = [];
  KEYS.forEach(k => {
    const d = (want[k] || 0) - (S.basket[k] || 0);
    if (d > 0) diff.push(`не хватает: ${d} ${nameOf(k, d)}`);
    if (d < 0) diff.push(`лишнее: ${-d} ${nameOf(k, -d)}`);
  });
  if (diff.length){ S.pickFb = `<div class="sh-fb"><p>Сверим с заданием: ${diff.join('; ')}.</p></div>`; return keepDraw(); }
  S.basket = Object.assign({}, want); S.pickFb = ''; S.total = sumOf(S.basket);
  const gs = groups();
  if (gs.length === 1 && gs[0].n === 1){ S.revealed = true; S.stages = S.stages.filter(x => x !== 'total'); }
  S.si = S.stages.indexOf('pick') ; next();
};
ACTIONS.shopPut = (t) => { const id = t.dataset.id; if (S.wallet[id] > 0){ S.wallet[id]--; S.paid.push(id); S.payFb = ''; keepDraw(); } };
ACTIONS.shopBack = (t) => { const i = parseInt(t.dataset.i, 10), id = S.paid[i]; if (id){ S.paid.splice(i, 1); S.wallet[id]++; S.payFb = ''; keepDraw(); } };
ACTIONS.shopPay = () => {
  const sum = S.paid.reduce((s, id) => s + MONEY[id].v, 0);
  if (sum < S.total){
    S.payFb = `<div class="sh-fb"><p>Кассир качает головой: денег пока мало.</p>${bars([
      { l:'К оплате', segs:[{ v:S.total, c:'a', t:S.total }] },
      { l:'Отдал', segs:[{ v:sum, c:'b', t:sum }, { v:S.total - sum, c:'q', t:'?' }] }])}</div>`;
    return keepDraw();
  }
  S.paidSum = sum; S.payFb = ''; next();
};
ACTIONS.shopEnough = (t) => {
  const yes = t.dataset.v === '1', ok = yes === (S.total <= S.t.have);
  if (!ok){
    S.enoughFb = `<div class="sh-fb"><p>Посмотри на полоски: ${yes ? 'корзина длиннее, чем деньги' : 'денег не меньше, чем стоит корзина'}.</p>${bars([
      { l:'Есть', segs:[{ v:S.t.have, c:'a', t:S.t.have }] }, { l:'Корзина', segs:unitSegs() }])}</div>`;
    return keepDraw();
  }
  S.enoughFb = ''; S.enough = { ok:true }; S.a = null; keepDraw();
};

/* ---------- compare game ---------- */
const UN = { мм:['len', 1], см:['len', 10], дм:['len', 100], м:['len', 1000],

const CMP_GEN = {

  dmcm: () => { const a = rand(2, 9); return [[[a, 'дм']], [[near(10 * a, rand(1, 5)), 'см']]]; },
  cmmm: () => { const a = rand(2, 9); return [[[near(10 * a, rand(1, 5)), 'мм']], [[a, 'см']]]; },
  mcm: () => { const a = rand(1, 3); return [[[a, 'м']], [[pickOne([100 * a, 100 * a - 10 * rand(1, 5), 100 * a + 10 * rand(1, 5), 10 * a]), 'см']]]; },
  dmcm2: () => { const a = rand(1, 6), b = rand(1, 9), t = 10 * a + b; return [[[a, 'дм'], [b, 'см']], [[pickOne([t, t + rand(1, 9), t - rand(1, 9), 10 * b + a]), 'см']]]; },
  kg: () => { const a = rand(1, 3); return [[[a, 'кг']], [[pickOne([1000 * a, 1000 * a - 100 * rand(1, 5), 1000 * a + 100 * rand(1, 5), 100 * a]), 'г']]]; },
  time: () => Math.random() < .5 ? [[[1, 'ч']], [[pickOne([30, 50, 60, 70, 90, 100]), 'мин']]] : [[[pickOne([1, 2]), 'мин']], [[pickOne([50, 60, 90, 100, 120]), 'с']]],
  area: () => { const a = rand(1, 2); return [[[a, 'дм²']], [[pickOne([10 * a, 100 * a, 100 * a - 10 * rand(1, 5), 100 * a + 10 * rand(1, 5)]), 'см²']]]; },
  area2: () => [[[1, 'м²']], [[pickOne([10, 90, 100, 120]), 'дм²']]],
  diff: () => { const n = rand(2, 9), [u, v] = pickOne([['кг','м'], ['см','см²'], ['мин','см'], ['г','с'], ['м','м²'], ['ч','кг']]); return [[[n, u]], [[n, v]]]; }
};
const fmt = (v) => v.map(([n, u]) => `${n} ${u}`).join(' ');
const total = (v) => v.reduce((s, [n, u]) => s + n * UN[u][1], 0);
const kindOf = (v) => UN[v[0][1]][0];
function cmpAnswer(a, b){

  const x = total(a), y = total(b); return x < y ? '<' : x > y ? '>' : '=';
}

function explainHTML(q){
  const ka = kindOf(q.a), kb = kindOf(q.b);

    const lenArea = [ka, kb].includes('len') && [ka, kb].includes('area');
    return `<p>Это <b>разные величины</b>: ${KIND[ka][0]} (${KIND[ka][1]}?) и ${KIND[kb][0]} (${KIND[kb][1]}?). Сравнивать можно только одинаковые!</p>

/* timekit: shared by «Задачи на время» (time.js) and «Стрелочные часы» (clock.js).

const TK = (() => {

const clk = (t, twelve) => `<span class="tk-t"><b class="hr">${twelve ? h12(t) : H(t)}</b>:<b class="mn">${p2(Mi(t))}</b></span>`;

const dur = (d) => { const h = Math.floor(d / 60), m = d % 60;
  return `<span class="tk-t">${h ? `<b class="hr">${h}</b> ч` : ''}${h && m ? ' ' : ''}${m || !h ? `<b class="mn">${m}</b> мин` : ''}</span>`; };
const pick = (a) => a[rand(0, a.length - 1)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = rand(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- SVG clock ---------- */
const C = 120, R = 106;

/* o: id, cls, labels (minute numbers outside), zero60 (top label «0 / 60»), inner24, wedge (true = minutes passed this hour),

    if (d < 60 && st + d * 6 > 360) s += `<path class="tk-sweep${o.back ? ' back' : ''}" d="${sectorD(0, st + d * 6 - 360, R - 2)}"/>`; }
  for (let i = 0; i < 60; i++){
    const big = i % 5 === 0, [x0, y0] = pt(i * 6, R - 3), [x1, y1] = pt(i * 6, R - (big ? 17 : 9));
    s += `<line class="${big ? 'tk-tick5' : 'tk-tick'}" x1="${f1(x0)}" y1="${f1(y0)}" x2="${f1(x1)}" y2="${f1(y1)}"/>`;
  }
  for (let n = 1; n <= 12; n++){
    const [x, y] = pt(n * 30, R - 33);
    s += o.tap ? `<g class="tk-num-t" data-act="tknum" data-n="${n}"><circle cx="${f1(x)}" cy="${f1(y)}" r="15"/><text x="${f1(x)}" y="${f1(y)}" class="tk-num">${n}</text></g>`

  if (o.hands !== false) s += `<line class="tk-hh" data-hand="h" x1="${C}" y1="${C + 10}" x2="${C}" y2="${C - 54}" transform="rotate(${handH(t)} ${C} ${C})"/>
    <line class="tk-mh" data-hand="m" x1="${C}" y1="${C + 14}" x2="${C}" y2="${C - 90}" transform="rotate(${handM(t)} ${C} ${C})"/>

/* dragging: modules register DRAG[key] = { get, set(t), live?(t), end?(t), only?:'m'|'h', min?, max? } */
const DRAG = {};

function angleOf(svg, e){

  else { const tgt = mod(Math.round(a * 2 / 5) * 5, 720); t += mod(tgt - mod(t, 720) + 360, 720) - 360; }
  if (D.min != null) t = Math.max(D.min, t);
  if (D.max != null) t = Math.min(D.max, t);

  D.set(t); setHands(svg, t); if (D.live) D.live(t);

app.addEventListener('pointerdown', (e) => {
  const svg = e.target.closest('svg[data-drag]'); if (!svg) return;
  const D = DRAG[svg.dataset.drag]; if (!D) return;

/* animate a clock's hands from t0 to t1 (used for «прокрутить») */
let animId = 0;
function animate(id, t0, t1, tick, done){
  const my = ++animId, svg = document.getElementById(id); if (!svg) return;
  if (reduced){ setHands(svg, t1); tick && tick(t1); done && done(); return; }
  const ms = Math.min(4500, 900 + Math.abs(t1 - t0) * 25), start = performance.now();
  const step = (now) => {
    if (my !== animId || !document.body.contains(svg)) return;
    const k = Math.min(1, (now - start) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

/* ---------- «ч : мин» pad ---------- */
const TP = { h:'', m:'', slot:'h', mode:'clock', submit:null };
function timePad(label, mode){

  return `<div class="pad tk-pad" id="tk-pad"><div class="pad-label">${label}</div>

/* ---------- Lab: step-by-step problem in three levels ---------- */
/* problem p = { title, text (story html), say? (plain text for read-aloud), visual(k, done) → html,

  const L = { key, gen, S:null, opts,

    html(){ return labHTML(L); },

function ansOk(step, v){

  const helpBtn = mode === 'solo' && !S.done && S.miss ? `<button class="btn ghost" data-act="tklab" data-lab="${L.key}" data-op="help">Разобрать по шагам</button>` : '';
  const giveStep = mode === 'with' && !S.done && S.stepMiss >= 2 ? `<button class="btn ghost" data-act="tklab" data-lab="${L.key}" data-op="give">Покажи этот шаг</button>` : '';
  const win = S.done ? `<div class="win"><span class="win-goat" aria-hidden="true">🐐</span><div><h2>${S.given ? 'Вот ответ' : 'Верно!'}${S.star ? ' <span class="tk-star-pop">+1 ⭐</span>' : ''}</h2><p class="check-line">${p.win}</p></div></div>
      ${p.check ? `<p class="tk-check">✔ ${p.check}</p>` : ''}

    ${p.text ? `<div class="tk-story"><p class="rule">${p.text}</p></div>` : ''}
    ${p.visual ? `<div class="tk-vis">${p.visual(S.done ? n : shownK, S.done)}</div>` : ''}

        ${mode === 'watch' && !S.done && S.k === 0 ? '<p class="tip-ink">Смотри, как решать. Нажимай кнопку — будет появляться по одному шагу.</p>' : ''}
        ${mode === 'with' && !S.done && S.k === 0 && !S.help ? '<p class="tip-ink">Решаем по шагам. Отвечай на каждый вопрос.</p>' : ''}

function finishLab(L, given){

  if (!given && !S.miss && !S.help && mode !== 'watch'){ const g = 'stars_' + (L.opts.group || 'time'); store.set(g, store.get(g, 0) + 1); S.star = true; }
  if (lv === 'watch'){ const w = store.get('watched_' + L.key, 0) + 1; store.set('watched_' + L.key, w); if (w >= 2){ S.suggest = 'with'; S.streakMsg = 'Ты уже видел, как это решается. Попробуем вместе: теперь отвечаешь ты, а я подсказываю.'; } }

function bindLab(L){

  const cur = mode === 'with' ? p.steps[S.k] : mode === 'solo' ? p.final : null;
  if (!cur){ TP.submit = null; PAD.submit = null; return; }
  const onAns = (v) => {
    if (ansOk(cur, v)){
      S.msg = ''; S.stepMiss = 0;
      if (mode === 'with'){ S.k++; if (S.k >= p.steps.length) finishLab(L); }
      else { S.k = p.steps.length; finishLab(L); }
    } else {
      S.miss++; S.stepMiss++;
      const common = commonMsg(cur, v);
      S.msg = common || (mode === 'solo' ? (p.finalHint && p.finalHint(v)) || 'Не совсем. Попробуй ещё раз или разбери задачу по шагам.' : cur.hint || 'Не совсем, попробуй ещё раз.');

}
/* teaching moments that are about the entry itself, not the maths */
function rawMsg(cur, h, m){
  if (m >= 60) return `<b>${m} минут — так не пишут!</b> Минут бывает от 0 до 59. Как только набирается 60 минут — это уже целый час. ${m} мин = ${Math.floor(m / 60)} ч ${m % 60} мин.`;
  if (cur.kind === 'clock' && h > 24) return `Часов в сутках только 24: от 0 до 23. ${h} часов — так не бывает.`;
  return null;
}
function commonMsg(cur, v){
  if (cur.kind === 'clock' && !cur.twelve && mod(v, 720) === mod(cur.ans, 720) && mod(v, 1440) !== mod(cur.ans, 1440))
    return `Стрелки на часах стоят верно, но сейчас ${H(cur.ans) >= 12 ? 'вторая половина суток (после полудня)' : 'первая половина суток (до полудня)'}. Напиши время в 24-часовом счёте: ${H(cur.ans) >= 12 ? 'прибавь 12' : 'отними 12'}.`;
  return null;
}
ACTIONS.tklab = (t) => {
  const L = LABS[t.dataset.lab]; if (!L) return;
  const S = L.S, op = t.dataset.op;
  if (op === 'lvl'){ L.setLvl(t.dataset.v); if (t.dataset.next || (S && S.done)) L.fresh(); else { S.k = 0; S.msg = ''; S.help = false; S.miss = 0; S.stepMiss = 0; } }
  else if (op === 'step'){ if (S.k < S.p.steps.length) S.k++; else { finishLab(L); } }
  else if (op === 'next') L.fresh();
  else if (op === 'help'){ S.help = true; S.k = 0; S.msg = ''; S.stepMiss = 0; }
  else if (op === 'give'){ S.k++; S.stepMiss = 0; S.msg = ''; S.miss++; if (S.k >= S.p.steps.length) finishLab(L, true); }
