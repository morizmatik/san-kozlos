};

/* ---------- timeline ("лента времени") ---------- */
/* spec: { a, b: range shown (minutes), flags:[{t, label, cls}], jumps:[{a, b, label, back}], brace:{a, b, label} } */
function timeline(sp){
  const W = 640, X0 = 30, X1 = W - 30, Y = 104;
  const a = Math.floor(sp.a / 60) * 60, b = Math.max(a + 60, Math.ceil(sp.b / 60) * 60);
  const x = (t) => f1(X0 + (t - a) / (b - a) * (X1 - X0));
  const span = b - a, minor = span <= 120 ? 5 : span <= 240 ? 10 : 15;
  let s = `<line x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}" class="tl-axis"/>`;
  for (let t = a; t <= b; t += minor){
    const hr = t % 60 === 0, half = t % 30 === 0;
    s += `<line x1="${x(t)}" y1="${Y - (hr ? 10 : half ? 7 : 4)}" x2="${x(t)}" y2="${Y + (hr ? 10 : half ? 7 : 4)}" class="${hr ? 'tl-hr' : 'tl-min'}"/>`;
    if (hr) s += `<text x="${x(t)}" y="${Y + 30}" class="tl-hl">${clkTxt(t)}</text>`;
  }
  if (sp.brace){ const { a:p, b:q, label } = sp.brace; s += `<path d="M${x(p)} ${Y + 44}v8H${x(q)}v-8" class="tl-brace"/><text x="${f1((+x(p) + +x(q)) / 2)}" y="${Y + 72}" class="tl-bl">${label}</text>`; }
  (sp.jumps || []).forEach((j, i) => {
    const x0 = +x(j.a), x1 = +x(j.b), mid = (x0 + x1) / 2, hgt = Math.min(56, 18 + Math.abs(x1 - x0) * .35);
    s += `<path d="M${x0} ${Y - 4}Q${f1(mid)} ${f1(Y - 4 - hgt * 2)} ${x1} ${Y - 4}" class="tl-jump${j.back ? ' back' : ''}" style="animation-delay:${i * .05}s"/>
      <text x="${f1(mid)}" y="${f1(Y - 10 - hgt)}" class="tl-jl${j.back ? ' back' : ''}">${j.label}</text>`;
  });
  (sp.flags || []).forEach(f => { s += `<circle cx="${x(f.t)}" cy="${Y}" r="7" class="tl-dot ${f.cls || ''}"/>${f.label ? `<text x="${x(f.t)}" y="${Y + 30}" class="tl-fl ${f.cls || ''}">${f.label}</text>` : ''}`; });
  return `<svg class="tl" viewBox="0 0 ${W} ${sp.brace ? 184 : 146}" role="img" aria-label="Лента времени">${s}</svg>`;
}

/* ---------- column («в столбик») with carry/borrow notes ---------- */
function column(a, b, op, o = {}){
  const ah = Math.floor(a / 60), am = a % 60, bh = Math.floor(b / 60), bm = b % 60;
  let note = '', rh, rm, top = ['', ''];
  if (op === '+'){
    const s = am + bm; rh = ah + bh + (s >= 60 ? 1 : 0); rm = s % 60;
    if (s >= 60){ top = ['+1', '']; note = `${am} + ${bm} = ${s} мин — больше 60. 60 мин = 1 ч: отдаём их в часы, остаётся ${s - 60} мин.`; }
  } else {
    if (am < bm){ top = [`${ah - 1}`, `${am + 60}`]; note = `${am} мин − ${bm} мин не получится. Разменяем 1 час на 60 минут: ${ah} ч ${am} мин = ${ah - 1} ч ${am + 60} мин.`; rh = ah - 1 - bh; rm = am + 60 - bm; }
    else { rh = ah - bh; rm = am - bm; }
  }
  const cell = (v, cls = '') => `<span class="${cls}">${v}</span>`;
  const struck = op === '−' && am < bm && !o.noNote;
  if (o.noNote) top = ['', ''];
  return `<div class="tk-col">
    <div class="tk-colgrid">
      ${cell('')}${cell(top[0], 'tk-carry hr')}${cell('')}${cell(top[1], 'tk-carry mn')}${cell('')}
      ${cell('')}${cell(ah || '', 'hr' + (struck ? ' x' : ''))}${cell(ah ? 'ч' : '', 'u')}${cell(am, 'mn' + (struck ? ' x' : ''))}${cell('мин', 'u')}
      ${cell(op, 'op')}${cell(bh || '', 'hr')}${cell(bh ? 'ч' : '', 'u')}${cell(bm, 'mn')}${cell('мин', 'u')}
      <i class="tk-colline"></i>
      ${o.hide ? `${cell('')}${cell('?', 'qm')}${cell('ч', 'u')}${cell('?', 'qm')}${cell('мин', 'u')}` : `${cell('')}${cell(rh || (rh === 0 && rm === 0 ? 0 : ''), 'hr')}${cell(rh ? 'ч' : '', 'u')}${cell(rm, 'mn')}${cell('мин', 'u')}`}
    </div>${note && !o.noNote ? `<p class="tk-colnote">${note}</p>` : ''}</div>`;
}

/* ---------- step builders: end / start / duration (jump method) ---------- */
/* each returns steps; a step may carry .jump {a, b, label, back} — the arc drawn on the timeline once that step is done */
function endSteps(S, D, tw){
  const steps = [];
  const dh = Math.floor(D / 60), dm = D % 60;
  let cur = S;
  if (dh){ steps.push({ q:`Сначала прибавим целые часы: ${clk(cur, tw)} + ${dh} ч = ?`, kind:'clock', ans:cur + 60 * dh, twelve:tw, hint:`Минуты не меняются, к часам прибавь ${dh}: ${tw ? h12(cur) : H(cur)} + ${dh} = ?` }); steps[steps.length - 1].jump = ({ a:cur, b:cur + 60 * dh, label:`+${dh} ч` }); cur += 60 * dh; }
  if (dm){
    if (Mi(cur) + dm < 60){
      steps.push({ q:`Теперь минуты: ${Mi(cur)} мин + ${dm} мин = ?`, kind:'num', ans:Mi(cur) + dm, label:`<b>${Mi(cur) + dm} мин</b>`, hint:`Сложи ${Mi(cur)} и ${dm}. Получится меньше 60 — значит, час не меняется.` });
      steps[steps.length - 1].jump = ({ a:cur, b:cur + dm, label:`+${dm} мин` });
    } else {
      const a = 60 - Mi(cur), r = dm - a;
      steps.push({ q:`Прыгнем до круглого часа: от ${clk(cur, tw)} до ${clk(cur + a, tw)} — сколько минут?`, kind:'num', ans:a, label:`<b>${a} мин</b>`, hint:`В часе 60 минут. Уже прошло ${Mi(cur)}. До конца часа: 60 − ${Mi(cur)} = ?` });
      steps[steps.length - 1].jump = ({ a:cur, b:cur + a, label:`+${a}` });
      if (r){ steps.push({ q:`Прибавить надо было ${dm} мин, уже прибавили ${a}. Осталось: ${dm} − ${a} = ?`, kind:'num', ans:r, label:`<b>${r} мин</b>`, hint:`Отними от ${dm} те ${a} мин, что уже прибавили.` }); steps[steps.length - 1].jump = ({ a:cur + a, b:cur + dm, label:`+${r}` }); }
    }
  }
  return steps;
}
function startSteps(E, D, tw){
  const steps = [];
  const dh = Math.floor(D / 60), dm = D % 60;
  let cur = E;
  if (dh){ steps.push({ q:`Шагнём назад на целые часы: ${clk(cur, tw)} − ${dh} ч = ?`, kind:'clock', ans:cur - 60 * dh, twelve:tw, hint:`Минуты не меняются, от часов отними ${dh}: ${tw ? h12(cur) : H(cur)} − ${dh} = ?` }); steps[steps.length - 1].jump = ({ a:cur - 60 * dh, b:cur, label:`−${dh} ч`, back:true }); cur -= 60 * dh; }
  if (dm){
    if (Mi(cur) >= dm){
      steps.push({ q:`Теперь минуты: ${Mi(cur)} мин − ${dm} мин = ?`, kind:'num', ans:Mi(cur) - dm, label:`<b>${Mi(cur) - dm} мин</b>`, hint:`Минут на часах ${Mi(cur)}, а отнять надо ${dm}. Хватает — час не меняется.` });
      steps[steps.length - 1].jump = ({ a:cur - dm, b:cur, label:`−${dm} мин`, back:true });
    } else {
      const a = Mi(cur), r = dm - a;
      if (a){
        steps.push({ q:`Шагнём назад до круглого часа: от ${clk(cur, tw)} до ${clk(cur - a, tw)} — сколько минут?`, kind:'num', ans:a, label:`<b>${a} мин</b>`, hint:`Сколько минут прошло после ${tw ? h12(cur - a) : H(cur - a)}:00? Посмотри на минуты.` });
        steps[steps.length - 1].jump = ({ a:cur - a, b:cur, label:`−${a}`, back:true });
        steps.push({ q:`Отнять надо было ${dm} мин, уже отняли ${a}. Осталось: ${dm} − ${a} = ?`, kind:'num', ans:r, label:`<b>${r} мин</b>`, hint:`${dm} − ${a} = ?` });
      }
      steps.push({ q:`От ${clk(cur - a, tw)} назад ещё на ${r} мин. Сколько минут будет на часах: 60 − ${r} = ?`, kind:'num', ans:60 - r, label:`<b>${60 - r} мин</b> → ${clk(cur - dm, tw)}`, hint:`Шагая назад через круглый час, попадаем в предыдущий час. От его 60 минут отнимаем ${r}.` });
      steps[steps.length - 1].jump = ({ a:cur - dm, b:cur - a, label:`−${r}`, back:true });
    }
  }
  return steps;
}
function durSteps(S, E, tw){

  if (Mi(E) >= Mi(S)){
    if (he > hs){ steps.push({ q:`Сколько прошло целых часов: ${tw ? h12(S) : H(S)}:${p2(Mi(S))} → ${tw ? h12(he * 60 + Mi(S)) : H(he * 60 + Mi(S))}:${p2(Mi(S))}?`, kind:'num', ans:he - hs, label:`<b>${he - hs} ч</b>`, hint:`Минуты одинаковые. Сколько раз часовая стрелка перешла на следующее число?` });
      steps[steps.length - 1].jump = ({ a:S, b:S + 60 * (he - hs), label:`${he - hs} ч` }); }
    if (Mi(E) > Mi(S) || he === hs){ steps.push({ q:`Сколько ещё минут: ${Mi(S)} → ${Mi(E)}? ${Mi(E)} − ${Mi(S)} = ?`, kind:'num', ans:Mi(E) - Mi(S), label:`<b>${Mi(E) - Mi(S)} мин</b>`, hint:`Отними от ${Mi(E)} минуты начала: ${Mi(S)}.` });
      steps[steps.length - 1].jump = ({ a:S + 60 * (he - hs), b:E, label:`${Mi(E) - Mi(S)} мин` }); }
  } else {
    const a = 60 - Mi(S), w = he - hs - 1;
    steps.push({ q:`Прыгнем от ${clk(S, tw)} до круглого часа ${clk(S + a, tw)}. Сколько минут?`, kind:'num', ans:a, label:`<b>${a} мин</b>`, hint:`До конца часа: 60 − ${Mi(S)} = ?` });
    steps[steps.length - 1].jump = ({ a:S, b:S + a, label:`${a} мин` });
    if (w > 0){ steps.push({ q:`От ${clk(S + a, tw)} до ${clk(he * 60, tw)} — сколько целых часов?`, kind:'num', ans:w, label:`<b>${w} ч</b>`, hint:`${tw ? h12(he * 60) : he} − ${tw ? h12(S + a) : H(S + a)} = ?` }); steps[steps.length - 1].jump = ({ a:S + a, b:he * 60, label:`${w} ч` }); }
    if (Mi(E)){
      steps.push({ q:`От ${clk(he * 60, tw)} до ${clk(E, tw)} — сколько минут?`, kind:'num', ans:Mi(E), label:`<b>${Mi(E)} мин</b>`, hint:`Посмотри на минуты конечного времени.` });
      steps[steps.length - 1].jump = ({ a:he * 60, b:E, label:`${Mi(E)} мин` });
      steps.push({ q:`Сложим минутные прыжки: ${a} + ${Mi(E)} = ?`, kind:'num', ans:a + Mi(E), label:`<b>${a + Mi(E)} мин</b>`, hint:`${a} + ${Mi(E)} = ?` });
    }
  }
  return steps;
}

/* ---------- tab «Почувствуй время» ---------- */
function feelHTML(){

      <p class="tip-ink">Нажми «Старт», закрой глаза 🙈 и считай про себя. Когда покажется, что прошла ровно 1 минута, — жми «Стоп».</p></div>`;

        { q:`Прибавим их: ${x} + 12 = ?`, kind:'num', ans:h, label:`<b>${h}:00</b>`, hint:`${x} + 12 = ?` }

      win:`${x} ${plural(x, ['час', 'часа', 'часов'])} ${partOf(h)} = ${clk(h * 60)}`, check:`${h} − 12 = ${x}` };

      steps:[{ q:`${h} больше 12 — значит, стрелка идёт второй круг. Сколько часов прошло после полудня: ${h} − 12 = ?`, kind:'num', ans:x, label:`<b>${x}</b>`, hint:`${h} − 12 = ?` }],
      final:{ q:'На какое число показывает часовая стрелка?', kind:'num', ans:x, padLabel:'Число на циферблате' },
      finalHint:() => 'На циферблате только числа от 1 до 12. Отними 12.',

  if (r < .65){

      steps:[{ q:'Полночь — это конец одних суток (24:00) и начало следующих (0:00). Напиши одно из двух.', kind:'num', ans:0, ok:(v) => v === 0 || v === 24, label:'<b>0:00</b> или <b>24:00</b>' }],
      final:{ q:'Сколько часов в полночь?', kind:'num', ans:0, ok:(v) => v === 0 || v === 24, padLabel:'Часов' },
      finalHint:(v) => v === 12 ? 'На циферблате — да, 12. Но 12:00 на электронных часах — это полдень. А полночь — 0:00 (или 24:00).' : 'Стрелка на 12, сутки закончились. Подсказка: подойдут два ответа.',
      win:'Полночь = 0:00 = 24:00', check:'А полдень — 12:00' };
  }
  // crossing midnight
  const S = rand(20, 23) * 60 + 5 * rand(0, 11), dh = rand(24 - H(S), 4), dm = 5 * rand(0, 11 - Math.ceil(Mi(S) / 5)), D = dh * 60 + dm, E = S + D;
  const sum = H(S) + dh, story = pick([
    [`Поезд отправился в ${clkTxt(S)} и был в пути ${durTxt(D)}. Во сколько он прибыл?`, 'Поезд прибыл в'],
    [`Новогодний салют начали готовить в ${clkTxt(S)}. Подготовка заняла ${durTxt(D)}. Во сколько начался салют?`, 'Салют начался в'],
    [`Самолёт вылетел в ${clkTxt(S)} и летел ${durTxt(D)}. Во сколько он приземлился?`, 'Самолёт приземлился в']]);
  const steps = [
    { q:`Часы: ${H(S)} + ${dh} = ?`, kind:'num', ans:sum, label:`<b>${sum}</b>`, hint:`${H(S)} + ${dh} = ?` },
    ...(sum >= 24 ? [{ q:`${sum} часов не бывает — в сутках 24 часа. Начались новые сутки: ${sum} − 24 = ?`, kind:'num', ans:sum - 24, label:`<b>${sum - 24}</b> ч следующего дня`, hint:`${sum} − 24 = ?` }] : []),
    ...(dm ? [{ q:`Минуты: ${Mi(S)} + ${dm} = ?`, kind:'num', ans:Mi(S) + dm, label:`<b>${Mi(S) + dm} мин</b>`, hint:`${Mi(S)} + ${dm} = ?` }] : [])
  ];
  return { meta:{ type:'night', S, D, E }, title:'Через полночь', text:story[0], say:story[0],
    visual:(k, done) => timeline({ a:S, b:E, flags:[{ t:S, label:'', cls:'s' }, { t:E, label:done ? '' : '?', cls:'e' }, { t:1440, label:'', cls:'mid' }],
      jumps:k >= 1 || done ? [{ a:S, b:E, label:`+${durTxt(D)}` }] : [] }) + '<p class="tk-cap">Полночь: 24:00 = 0:00 — начинаются новые сутки.</p>',
    steps, final:{ q:story[1] + ' …?', kind:'clock', ans:E },
    finalHint:() => `Подсказка: ${H(S)} + ${dh} = ${sum}. Больше 24? Значит, наступили новые сутки — отними 24.`,
    win:`${story[1]} ${clk(E)}`, check:`${clkTxt(S)} + ${durTxt(D)} → через полночь → ${clkTxt(E)}` };
}

function track(am, bm){
  // two minute bars end to end on a 0..120 track, with the 60 line = 1 hour
  const s = am + bm;
  return `<div class="tk-track"><div class="tk-trk"><i class="a" style="width:${am / 120 * 100}%"></i><i class="b" style="width:${bm / 120 * 100}%"></i>
    <span class="l60" style="left:50%"><b>60 мин = 1 ч</b></span></div>
    <p class="tk-cap">${am} мин + ${bm} мин = <b>${s} мин</b>${s >= 60 ? ` — перешли за 60! Это 1 ч и ещё ${s - 60} мин.` : ' — меньше 60, час не набрался.'}</p></div>`;
}
function calcGen(){
  const add = Math.random() < .5, hard = Math.random() < .7;
  const m5 = () => 5 * rand(1, 11);
  let a, b, story = '';
  if (add){
    let am, bm; do { am = m5(); bm = m5(); } while (hard ? am + bm < 65 : am + bm >= 60);
    a = rand(0, 3) * 60 + am; b = rand(0, 2) * 60 + bm;
    if (a < 60 && b < 60 && Math.random() < .6) story = pick([`Гоша делал математику ${durTxt(a)}, а потом русский ${durTxt(b)}. Сколько времени он делал уроки?`,
      `Гоша ехал на автобусе ${durTxt(a)}, а потом шёл пешком ${durTxt(b)}. Сколько времени занял путь?`]);
  } else {
    let am, bm; do { am = 5 * rand(0, 11); bm = m5(); } while (hard ? am >= bm : am < bm);
    const ah = rand(1, 4), bh = rand(0, ah - (am < bm ? 1 : 0));
    a = ah * 60 + am; b = bh * 60 + bm;
    if (a - b <= 0){ b = bm; a = ah * 60 + am; }
    if (Math.random() < .4 && a >= 60) story = pick([`Мультфильм идёт ${durTxt(a)}. Гоша посмотрел ${durTxt(b)}. Сколько ещё осталось?`,
      `На прогулку дали ${durTxt(a)}. Гоша гуляет уже ${durTxt(b)}. Сколько времени осталось?`]);
  }
  const ah = Math.floor(a / 60), am = a % 60, bh = Math.floor(b / 60), bm = b % 60;
  const res = add ? a + b : a - b, op = add ? '+' : '−';
  const steps = [];
  if (add){
    const s = am + bm;
    steps.push({ q:`Складываем минуты: ${am} + ${bm} = ?`, kind:'num', ans:s, label:`<b>${s} мин</b>`, hint:`${am} + ${bm} = ?` });
    if (s >= 60) steps.push({ q:`${s} мин — больше 60! 60 мин отдаём в часы. Сколько минут останется? ${s} − 60 = ?`, kind:'num', ans:s - 60, label:`<b>${s - 60} мин</b> и <b>+1 ч</b>`, hint:`${s} − 60 = ?` });
    if (ah || bh || s >= 60) steps.push({ q:`Складываем часы${s >= 60 ? ' (не забудь +1 перенесённый)' : ''}: ${[ah, bh].filter(Boolean).concat(s >= 60 ? [1] : []).join(' + ')} = ?`, kind:'num', ans:Math.floor(res / 60), label:`<b>${Math.floor(res / 60)} ч</b>`, hint:'Сложи все часы.' });
  } else if (am < bm){
    steps.push({ q:`${am} мин − ${bm} мин — не хватает минут! Разменяем 1 час на 60 минут: ${am} + 60 = ?`, kind:'num', ans:am + 60, label:`<b>${am + 60} мин</b>, а часов стало ${ah - 1}`, hint:`${am} + 60 = ?` });
    steps.push({ q:`Вычитаем минуты: ${am + 60} − ${bm} = ?`, kind:'num', ans:am + 60 - bm, label:`<b>${am + 60 - bm} мин</b>`, hint:`${am + 60} − ${bm} = ?` });
    steps.push({ q:`Вычитаем часы (одного уже нет): ${ah - 1} − ${bh} = ?`, kind:'num', ans:ah - 1 - bh, label:`<b>${ah - 1 - bh} ч</b>`, hint:`Был ${ah} ч, один разменяли — осталось ${ah - 1}. Теперь ${ah - 1} − ${bh}.` });
  } else {
    steps.push({ q:`Вычитаем минуты: ${am} − ${bm} = ?`, kind:'num', ans:am - bm, label:`<b>${am - bm} мин</b>`, hint:`${am} − ${bm} = ?` });
    if (ah) steps.push({ q:`Вычитаем часы: ${ah} − ${bh} = ?`, kind:'num', ans:ah - bh, label:`<b>${ah - bh} ч</b>`, hint:`${ah} − ${bh} = ?` });
  }
  const tricky = add ? am + bm >= 60 : am < bm;
  return { meta:{ a, b, op, res }, title:story ? 'Задача' : `${durTxt(a)} ${op} ${durTxt(b)}`, text:story, say:story,
    visual:(k, done) => `${column(a, b, op, { hide:!done, noNote:!done && k === 0 })}${add && (k >= 1 || done) ? track(am, bm) : ''}`,
    steps, final:{ q:`${durTxt(a)} ${op} ${durTxt(b)} = ?`, kind:'dur', ans:res, padLabel:'Часы и минуты' },
    finalHint:(v) => {
      if (add && tricky && v === res - 60) return 'Минуты посчитаны верно, а час потерялся: когда минут набралось больше 60, нужно добавить <b>1 ч</b>.';
      if (!add && tricky && v === (ah - bh) * 60 + (bm - am)) return `Нельзя вычитать «наоборот» (${bm} − ${am}). Минут не хватает — разменяй 1 час на 60 минут.`;
      if (!add && tricky && v === res + 60) return 'Минуты верно! А часов меньше: один час мы разменяли на минуты.';
      return tricky ? (add ? 'Сложи минуты. Если получится 60 или больше — 60 мин превращаются в 1 ч.' : 'Минут не хватает — разменяй 1 час на 60 минут.') : 'Минуты с минутами, часы с часами.';
    },
    win:`${durTxt(a)} ${op} ${durTxt(b)} = ${dur(res)}`,
    check:add ? `${durTxt(res)} − ${durTxt(b)} = ${durTxt(a)}` : `${durTxt(res)} + ${durTxt(b)} = ${durTxt(a)}`,
    alt:`<p>Всё переводим в минуты: ${durTxt(a)} = ${a} мин, ${durTxt(b)} = ${b} мин.</p><p>${a} ${op} ${b} = ${res} мин = ${durTxt(res)}</p>` };
}
const calcLab = TK.lab('calc', calcGen);

const END = [

let lastType = null;
function taskGen(){
  const types = ['end', 'start', 'dur'].filter(x => x !== lastType);
  const type = pick(types); lastType = type;
  const dh = pick([0, 0, 1, 1, 2]), dm = dh ? 5 * rand(1, 11) : 5 * rand(3, 11), D = dh * 60 + dm;
  const cross = Math.random() < .7;
  let S;

    const c = Mi(S) + dm >= 60;
    if (c === cross || i > 40) break;
  }
  const E = S + D;
  const tl = (k, done, unk, steps) => timeline({ a:S, b:E,
    flags:[{ t:S, label:unk === 'S' && !done ? '?' : '', cls:'s' }, { t:E, label:unk === 'E' && !done ? '?' : '', cls:'e' }],
    jumps:steps.slice(0, k).map(s => s.jump).filter(Boolean),

    `<div class="tk-legend"><span class="s">● начало ${unk === 'S' && !done ? '?' : clkTxt(S)}</span><span class="e">● конец ${unk === 'E' && !done ? '?' : clkTxt(E)}</span><span>⟷ длилось ${unk === 'D' && !done ? '?' : durTxt(D)}</span></div>`;
  if (type === 'end'){

      win:`${ans} ${clk(E)}`, check:`${clkTxt(E)} − ${durTxt(D)} = ${clkTxt(S)}`, alt:`<p>Сложить в столбик:</p>${column(S, D, '+')}` };

      win:`${ans} ${clk(S)}`, check:`${clkTxt(S)} + ${durTxt(D)} = ${clkTxt(E)}`, alt:`<p>Вычесть в столбик:</p>${column(E, D, '−')}` };
  }
  const [text, ans] = pick(DUR)(clkTxt(S), clkTxt(E)), steps = durSteps(S, E);
  return { meta:{ type, S, D, E }, title:'Сколько длилось?', text, say:text, steps, visual:(k, done) => tl(k, done, 'D', steps),
    final:{ q:ans + ' …?', kind:'dur', ans:D, padLabel:'Часы и минуты' },
    finalHint:() => Mi(E) < Mi(S) ? 'Минуты конца меньше минут начала — прыгай по ленте: сначала до круглого часа, потом целые часы, потом остаток.' : 'Из конца вычти начало: часы из часов, минуты из минут.',
    win:`${ans} ${dur(D)}`, check:`${clkTxt(S)} + ${durTxt(D)} = ${clkTxt(E)}`, alt:`<p>Вычесть в столбик: конец − начало.</p>${column(E, S, '−')}` };
}

const readLab = TK.lab('read', readGen, { group:'clock', onDone:(clean) => {

function wallSubmit(h, m){
  if (m >= 60 || h > 23){ CK.wall.res = { ok:false, now:new Date().getHours() * 60 + new Date().getMinutes(), msg:m >= 60 ? 'Минут бывает от 0 до 59.' : 'На циферблате часы от 1 до 12.' }; render(); return; }
  const now = new Date(), nt = now.getHours() * 60 + now.getMinutes(), v = h * 60 + m;
  const d = Math.min(mod(v - nt, 720), mod(nt - v, 720));
  let msg;
  if (d <= 3) msg = '';
  else if (Mi(v) === Mi(nt) || Math.abs(Mi(v) - Mi(nt)) <= 3) msg = `Минуты верно! А часы: сейчас <b>${h12(nt)}</b>. Короткая стрелка прошла число ${h12(nt)}${Mi(nt) >= 30 ? `, а до ${h12(nt) % 12 + 1} ещё не дошла` : ''}.`;
  else if (h % 12 === h12(nt) % 12) msg = `Часы верно! А минут сейчас <b>${Mi(nt)}</b>. Найди длинную стрелку: каждое число — 5 минут.`;
  else msg = `Сейчас ${clk(nt, true)}. Сравни картинку слева со своими часами — найди, где короткая и где длинная стрелка.`;
  CK.wall.res = { ok:d <= 3, now:nt, msg };
  render();
}

function setCheck(){

const EX = [240, 255, 270, 285, 250, 290, 265, 275];
function newQuiz(){
  const ms = [0, 15, 30, 45, 5, 10, 20, 25, 35, 40, 50, 55];
  const qs = Array.from({ length:8 }, (_, i) => {
    const t = (rand(1, 12) % 12) * 60 + (i < 4 ? pick([15, 30, 45, 30]) : pick(ms));
    const cand = [t + 60, t - 60, Mi(t) && Mi(t) !== 30 ? (t - Mi(t)) + (60 - Mi(t)) : t + 30, t + 120];
    const opts = [t];
    for (const c of shuffle(cand)) if (opts.length < 3 && !opts.some(o => mod(o - c, 720) === 0) && phrase(mod(c, 720))) opts.push(mod(c, 720));
    return { t, type:i % 2 ? 'p2c' : 'c2p', opts:shuffle(opts) };
  });
  CK.words.quiz = { qs:shuffle(qs), i:0, picked:null, score:0 };
}

      ${P != null ? `<div class="${P === q.t ? 'u-lesson' : 'sh-fb'}"><p>${P === q.t ? 'Верно!' : 'Не совсем.'} ${clk(q.t, true)} — «${phrase(q.t)}».</p><div class="tk-two"><div class="tk-mini sm">${wordsFace(q.t)}</div><p class="tk-explain">${explain(q.t)}</p></div></div>
        <div class="row"><button class="btn mint" data-act="cwq" data-v="next">${Q.i + 1 < Q.qs.length ? 'Дальше →' : 'Итог →'}</button></div>` : ''}`;
  }

/* ---------- tab: elapsed ---------- */
function elapsedGen(){
  const type = pick(['dur', 'dur', 'after', 'before']);
  const S = rand(1, 8) * 60 + 5 * rand(0, 11), D = pick([rand(2, 11) * 5, rand(2, 11) * 5, 60 + 5 * rand(1, 11), 120 + 5 * rand(0, 11)]), E = S + D;
  const spin = (from, to, id) => `<button class="btn ghost" data-act="cspin" data-from="${from}" data-to="${to}" data-id="${id}">▶ Прокрутить стрелки</button><span class="tk-count" id="${id}-count"></span>`;
  if (type === 'dur'){
    const steps = durSteps(S, E, true);
    return { meta:{ type, S, D, E }, title:'Сколько прошло?', text:'Гоша начал строить башню из кубиков, когда часы показывали время слева. Закончил — когда показывали время справа. Сколько он строил?',
      visual:(k, done) => `<div class="tk-pair"><div><small>Начало</small>${face(S, { id:'el-a' })}</div><div><small>Конец</small>${face(E)}</div></div>
        ${k >= 1 || done || TK.LABS.elapsed.lvl() === 'watch' ? `<div class="row">${spin(S, E, 'el-a')}</div>` : ''}
        ${k >= 1 || done ? TK.timeline({ a:S, b:E, flags:[{ t:S, cls:'s' }, { t:E, cls:'e' }], jumps:steps.slice(0, k).map(s => s.jump).filter(Boolean) }) : ''}`,
      steps, final:{ q:'Сколько он строил?', kind:'dur', ans:D, padLabel:'Часы и минуты' },
      finalHint:() => 'Прокрути мысленно длинную стрелку от начала до конца: каждый полный круг — 1 час, потом досчитай минуты.',
      win:`${clk(S, true)} → ${clk(E, true)}: прошло ${dur(D)}`, check:`${clkTxt(S, true)} + ${durTxt(D)} = ${clkTxt(E, true)}` };
  }
  if (type === 'after'){
    const steps = endSteps(S, D, true);
    return { meta:{ type, S, D, E }, title:'Который будет час?', text:`Сейчас на часах время, как на картинке. Мультик начнётся через ${durTxt(D)}. Во сколько он начнётся?`,
      visual:(k, done) => `<div class="tk-pair"><div><small>Сейчас</small>${face(S, { id:'el-a' })}</div>${done ? `<div><small>Через ${durTxt(D)}</small>${face(E, { sweep:D <= 60 ? [S, E] : null })}</div>` : ''}</div>
        ${done ? `<div class="row">${spin(S, E, 'el-a')}</div>` : ''}`,
      steps, final:{ q:'Во сколько начнётся мультик?', kind:'clock', ans:E, twelve:true },
      finalHint:(v) => mod(v - (S - D), 720) === 0 ? 'Мультик будет <b>потом</b> — время идёт вперёд, прибавляй.' : 'Сначала прибавь целые часы, потом минуты. Если минут больше 60 — перейди через круглый час.',
      win:`Мультик начнётся в ${clk(E, true)}`, check:`${clkTxt(E, true)} − ${durTxt(D)} = ${clkTxt(S, true)}` };
  }
  const steps = startSteps(E, D, true);
  return { meta:{ type, S, D, E }, title:'Во сколько началось?', text:`Пирог испёкся — на часах время, как на картинке. Он пёкся ${durTxt(D)}. Во сколько его поставили в духовку?`,
    visual:(k, done) => `<div class="tk-pair">${done ? `<div><small>Поставили</small>${face(S, { id:'el-a' })}</div>` : ''}<div><small>Испёкся</small>${face(E)}</div></div>
      ${done ? `<div class="row">${spin(S, E, 'el-a')}</div>` : ''}`,
    steps, final:{ q:'Во сколько поставили пирог?', kind:'clock', ans:S, twelve:true },
    finalHint:(v) => mod(v - E - D, 720) === 0 ? 'Пирог поставили <b>раньше</b> — шагай назад, отнимай.' : 'Отними сначала целые часы, потом минуты. Не хватает минут — шагни назад через круглый час.',
    win:`Пирог поставили в ${clk(S, true)}`, check:`${clkTxt(S, true)} + ${durTxt(D)} = ${clkTxt(E, true)}` };
}

  else if (v === 'next'){ Q.i++; Q.picked = null; }
  else if (Q.picked == null){
    const q = Q.qs[Q.i]; Q.picked = +v;
    if (+v === q.t){ if (!q.re) Q.score++; }
    else if (!q.re && Q.qs.length < 12) Q.qs.push({ ...q, opts:shuffle(q.opts), type:q.type === 'c2p' ? 'p2c' : 'c2p', re:true });

  else if (R.picked == null) R.picked = +v;

ACTIONS.cblitz = (t) => {

  else {

    else { B.miss++; B.end -= 3000; B.flash = +v; render(); setTimeout(() => { if (CK.blitz === B && B.phase === 'run'){ B.flash = null; B.q = blitzQ(); render(); } }, 900); return; }

function ordGen(){
  const ch = wpick(CHAINS.filter(c => c.units.length >= 4)), U = ch.units;
  if (rand(0, 1) === 0){
    const cnt = Math.min(U.length, rand(4, 5)), st = rand(0, U.length - cnt), us = U.slice(st, st + cnt);
    return { type:'units', ch, cards:us.map(u => ({ id:u, html:`<b>${u}</b><small>${measUnit(ch.kind, u).f[0]}</small>`, base:baseOf(u, 1), u, n:1 })) };
  }
  for (let t = 0; t < 300; t++){
    const cnt = rand(3, 4), us = shuffle(U).slice(0, cnt), cs = us.map(u => ({ u, n:rand(1, 2000) }));
    cs.forEach(c => { c.base = baseOf(c.u, c.n); c.id = c.n + c.u; });
    const bs = cs.map(c => c.base), mx = Math.max(...bs), mn = Math.min(...bs), sm = us.reduce((a, u) => baseOf(u, 1) < baseOf(a, 1) ? u : a);
    if (new Set(bs).size !== cnt || mx / mn > 500 || mx / baseOf(sm, 1) > 1e7) continue;
    const byNum = cs.slice().sort((a, b) => a.n - b.n).map(c => c.id).join(), byVal = cs.slice().sort((a, b) => a.base - b.base).map(c => c.id).join();
    if (byNum === byVal) continue;
    cs.forEach(c => { c.html = `<b>${f(c.n)} ${uS(c.u, c.n)}</b>`; });
    return { type:'values', ch, cards:cs };
  }
  return { type:'values', ch, cards:[{ id:'1км', u:'км', n:1, base:baseOf('км', 1), html:'<b>1 км</b>' }] };
}
const ordSorted = (q) => q.cards.slice().sort((a, b) => a.base - b.base);

  const sorted = ordSorted(q), order = sorted.map(c => q.type === 'units' ? c.u : `${f(c.n)} ${uS(c.u, c.n)}`).join(' &lt; ');
  if (q.type === 'units'){ const big = sorted[sorted.length - 1].u, sm = sorted[0].u; return `<p class="u-bigsign">${order}</p><p>${chainTxt(q.ch, big, sm)}</p>`; }
  const sm = sorted.reduce((a, c) => baseOf(c.u, 1) < baseOf(a, 1) ? c.u : a, sorted[0].u);
  return `<p>Переведём всё в ${uS(sm, 5)}:</p><p>${sorted.map(c => { const v = c.base / baseOf(sm, 1); return `${f(c.n)} ${uS(c.u, c.n)} = <b>${f(v)} ${uS(sm, v)}</b>`; }).join('<br>')}</p><p class="u-bigsign">${order}</p>`;
}

    <div class="mp-row-lab"><span>меньше</span><i></i><span>больше</span></div>
    <div class="mp-row">${slots}</div>
    ${S.checked ? `<div class="${right ? 'u-lesson' : 'sh-fb'}"><p class="sh-lead">${right ? 'Верно!' : 'Не совсем. Правильный порядок:'}</p>${ordExplain(q)}</div>
      <div class="row"><button class="btn mint" data-act="mpord" data-v="next">${S.i + 1 < S.qs.length ? 'Дальше →' : 'Итог →'}</button></div>`
    : `<div class="mp-tray">${left.map(id => `<button class="mp-card" data-act="mpord" data-v="a${id}">${byId(id).html}</button>`).join('')}</div>
      <div class="row">${!left.length ? '<button class="btn" data-act="mpord" data-v="check">Проверить ✓</button>' : '<p class="tip-ink">Нажимай на карточки по порядку. Нажми на карточку в ряду — она вернётся назад.</p>'}</div>`}
  </section>`;
}
ACTIONS.mpord = (t) => {
  const S = P.ord, v = t.dataset.v;
  if (v === 'again') P.ord = null;
  else if (v === 'next'){ S.i++; S.placed = []; S.checked = false; }
  else if (v === 'check'){
    const q = S.qs[S.i]; S.checked = true;
    if (S.placed.join() === ordSorted(q).map(c => c.id).join()){ if (!q.re) S.score++; } else if (!q.re) S.qs.push({ ...q, re:true });
  } else if (!S.checked){
    if (v[0] === 'a') S.placed.push(v.slice(1));
    else if (v[0] === 'r') S.placed = S.placed.filter(id => id !== v.slice(1));
  }
  render();
};

/* ---------- вкладки ---------- */
MEAS_TABS.push({ key:'conv', label:'🔁 Переведи', order:50, html:convHTML, bind:() => convLab.bind() });
MEAS_TABS.push({ key:'cmp', label:'⚖️ Что больше?', order:60, html:cmpHTML });
MEAS_TABS.push({ key:'pick', label:'🎯 Подбери мерку', order:70, html:pkHTML });
MEAS_TABS.push({ key:'nonsense', label:'🤪 Нелепицы', order:80, html:nonHTML });
MEAS_TABS.push({ key:'order', label:'🔢 По порядку', order:90, html:ordHTML });

globalThis.__measTest = { convGen, simpleGen, compGen, cmpGen, cmpRound, cmpExplain, PICK, itemOpts, nonGen, ordGen, ordSorted, ordExplain, chainTxt, baseOf, exR, CHAINS, ladderHTML, P };
})();
