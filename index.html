<title>Миссии Сан-Козлоса</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f5f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap">
<style>
/* Base: tokens, layout, shared components.
   Layout: one screen, max ~1040px wide, calm light page with white cards; built for an 11" tablet, works on phones.
   Tone: a clean study tool, not a toy — one accent colour, flat buttons, small radii; colour is reserved for the diagrams. */
:root{
  --sky:#f4f5f7; --sky-2:#eaecf0; --sky-3:#dde1e8; --dusk:#f4f5f7; --skyline:#e7eaf0;
  --accent:#2b4acb; --accent-deep:#1f379c; --accent-soft:#e9edfb;
  --sun:#f0a35e; --sun-deep:#b4581a; --pink:#df5f7e; --pink-2:#f8d6de;
  --mint:#5dbfa7; --mint-deep:#1d7a66; --lemon:#fde8a0; --violet:#8f9be6;
  --paper:#ffffff; --paper-2:#f3f5f8; --paper-3:#dde2ea; --slot-bg:#ffffff; --line:#e3e7ee;
  --ink:#1b2230; --ink-soft:#5b6476;
  --on-sky:#1b2230; --on-sky-soft:#5b6476;
  --grass:#a8dc7a; --grass-line:#8cc562; --fence:#8a4f22; --post:#5b3214;
  --display:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
body{background:var(--sky); color:var(--on-sky); font-family:var(--body); font-size:18px; line-height:1.45; font-variant-numeric:tabular-nums}
.skyline{position:fixed; left:0; right:0; bottom:0; height:110px; pointer-events:none; z-index:0; opacity:.7}
.skyline svg{width:100%; height:100%; display:block}
.app{position:relative; z-index:1; max-width:1040px; margin:0 auto; padding-block:20px 130px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:18px}
h1,h2,h3{font-family:var(--display); font-weight:700; line-height:1.15; letter-spacing:-.01em; text-wrap:balance; margin:0}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent); outline-offset:2px}

/* buttons */
.btn{border:0; border-radius:10px; padding:12px 20px; background:var(--accent); color:#fff;
  font-family:var(--display); font-weight:600; font-size:18px; transition:background .12s, transform .08s; min-height:52px}
.btn:hover{background:var(--accent-deep)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45; pointer-events:none}
.btn.mint{background:var(--mint-deep)}
.btn.ghost{background:var(--paper); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--paper-3)}
.btn.ghost:hover{background:var(--paper-2)}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}

/* top bar + stepper */
.topbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px}
.back{border:1.5px solid var(--paper-3); background:var(--paper); border-radius:10px; padding:8px 14px; font-weight:600; min-height:44px; color:var(--ink)}
.topbar-title{font-family:var(--display); font-weight:700; font-size:19px; color:var(--on-sky)}
.fs-btn{margin-left:auto; display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--paper-3); background:var(--paper); color:var(--ink); border-radius:10px; padding:8px 14px; font-weight:600; font-size:16px; min-height:44px}
.fs-btn span[aria-hidden]{font-size:18px; line-height:1}
.stepper{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:4px; counter-reset:st}
.stepper li{counter-increment:st; display:flex}
.stepper li > *{display:inline-flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border-radius:999px; font-weight:600; font-size:15px; color:var(--ink-soft); border:0; background:transparent; min-height:40px}
.stepper li > *::before{content:counter(st); width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:13px; background:var(--sky-2); color:var(--ink-soft)}
.stepper li.past > *::before{content:'✓'; background:var(--mint-deep); color:#fff}
.stepper li.now > *{background:var(--paper); color:var(--ink); box-shadow:var(--shadow)}
.stepper li.now > *::before{background:var(--accent); color:#fff}
.stepper button:hover{background:var(--paper); color:var(--ink)}

/* card */
.card{background:var(--paper); color:var(--ink); border-radius:16px; padding:22px; box-shadow:var(--shadow); border:1px solid var(--line); display:flex; flex-direction:column; gap:16px; min-width:0}
.card h2{font-size:24px}
.tip{color:var(--on-sky-soft); font-weight:500; max-width:66ch}
.q{font-size:24px; color:var(--on-sky)}
.eyebrow{text-transform:uppercase; letter-spacing:.08em; font-weight:700; font-size:12px; color:var(--ink-soft)}

/* home */
.hero{display:flex; gap:18px; align-items:center; padding-top:8px; flex-wrap:wrap}
.hero-goat{font-size:44px; line-height:1; width:76px; height:76px; display:grid; place-items:center; border-radius:18px; background:var(--paper); box-shadow:var(--shadow); border:1px solid var(--line); flex:none}
.hero-text{flex:1 1 360px; min-width:0}
.hero .fs-btn{align-self:flex-start}
.hero h1{font-size:clamp(28px,4.4vw,40px); color:var(--on-sky); margin:2px 0 8px}
.lead{font-size:18px; max-width:60ch; color:var(--on-sky-soft); font-weight:500}
.districts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.district{border:1px solid var(--line); text-align:left; background:var(--paper); color:var(--ink); border-radius:16px; padding:20px; display:grid; grid-template-columns:auto 1fr; gap:4px 16px; align-items:start; box-shadow:var(--shadow); transition:border-color .12s, transform .1s}
.district:hover{border-color:var(--paper-3)}
.district:active{transform:translateY(1px)}
.district .ico{font-size:28px; grid-row:span 3; line-height:1; width:52px; height:52px; display:grid; place-items:center; border-radius:12px; background:var(--paper-2)}
.district h2{font-size:21px}
.district p{color:var(--ink-soft); font-weight:500; font-size:16px}
.district .meta{font-size:13px; font-weight:700; color:var(--mint-deep); text-transform:uppercase; letter-spacing:.06em; margin-top:4px}
.district.main{grid-column:1/-1; background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.district.main .ico{background:var(--paper)}
.district.main p{color:var(--ink)}
.parents{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:14px 20px; color:var(--on-sky)}
.parents summary{font-weight:700; cursor:pointer; font-size:17px}
.parents ul{margin:12px 0 0; padding-left:22px; display:grid; gap:8px; color:var(--on-sky-soft); font-weight:400; max-width:72ch}
.parents b{color:var(--on-sky); font-weight:600}

/* rule + expression */
.rule{font-size:19px; font-weight:500}
.rule b{font-weight:700}
.expr{font-family:var(--display); font-weight:700; font-size:clamp(36px,6vw,56px); text-align:center; color:var(--ink); letter-spacing:.01em}
.expr .qm{color:var(--accent)}
.trap{background:var(--pink-2); border-radius:12px; padding:12px 16px; font-weight:500}
.steps{display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none}
.steps li{background:var(--paper-2); border-radius:10px; padding:10px 14px; font-weight:600; font-size:18px; animation:pop .4s}
.calc-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,340px); gap:20px; align-items:start}
.calc-grid > *{min-width:0}

/* keypad */
.pad{background:var(--paper-2); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px}
.pad-label{font-weight:700; color:var(--ink-soft); font-size:14px; text-transform:uppercase; letter-spacing:.06em}
.pad-display{height:60px; border-radius:10px; background:var(--slot-bg); border:2px solid var(--ink); font-family:var(--display); font-weight:700; font-size:32px; display:flex; align-items:center; justify-content:center; color:var(--ink)}
.pad-keys{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.key{border:1px solid var(--line); height:60px; border-radius:10px; background:var(--paper); color:var(--ink); font-family:var(--display); font-weight:600; font-size:24px}
.key:active{background:var(--sky-2)}
.key-soft{background:var(--sky-2)}
.key-go{background:var(--accent); color:#fff; font-size:17px; border-color:var(--accent)}
.key-go:active{background:var(--accent-deep)}

/* success */
.win{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.win-goat{font-size:44px; line-height:1; width:72px; height:72px; display:grid; place-items:center; border-radius:16px; background:color-mix(in srgb,var(--mint) 20%,var(--paper)); animation:jump .9s ease-in-out 1}
.win h2{font-size:26px}
.check-line{font-family:var(--display); font-weight:600; font-size:20px; color:var(--mint-deep)}
.dots-groups{display:flex; flex-wrap:wrap; gap:10px}
.dot-group{display:grid; grid-template-columns:repeat(4,16px); gap:5px; padding:10px; border:2px solid var(--mint-deep); border-radius:10px; background:color-mix(in srgb,var(--mint) 20%,var(--paper))}
.dot-group i{width:16px; height:16px; border-radius:50%; background:var(--mint-deep); display:block}

/* album */
.agrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px}
.acard img{width:100%; border-radius:10px; border:1px solid var(--line); background:#fff}
.acard .expr-small{font-family:var(--display); font-weight:700; font-size:20px}
.acard .meta{font-size:14px; color:var(--ink-soft); font-weight:500}
.empty{text-align:center; align-items:center; padding:40px 24px}
.empty .big{font-size:52px}


/* animation + responsive (shared) */
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
@keyframes jump{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(3deg)}}
@keyframes wiggle{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.92); opacity:.3}100%{transform:scale(1); opacity:1}}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

@media (max-width:760px){
  .districts,.schemas,.calc-grid,.own-grid{grid-template-columns:minmax(0,1fr)}
  .story-text{font-size:20px}
  .frame{grid-template-columns:repeat(5,40px); grid-template-rows:repeat(2,40px)}
  .dot{width:30px; height:30px}
  .seg{min-width:84px}
  .fs-btn .fs-text{display:none}
}

/* mission list */
.mgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px}
.mtile{border:1px solid var(--line); text-align:left; background:var(--paper); color:var(--ink); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); min-height:140px}
.mtile:hover{border-color:var(--paper-3)}
.mtile .ico{font-size:26px; line-height:1; width:46px; height:46px; display:grid; place-items:center; border-radius:10px; background:var(--paper-2)}
.mtile .num{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
.mtile h3{font-size:18px}
.mtile .ok{margin-top:auto; font-weight:600; color:var(--mint-deep); font-size:14px}
.mtile.done{background:var(--paper-2)}

/* story */
.story-card{flex-direction:row; align-items:flex-start; gap:18px; flex-wrap:wrap}
.story-icon{font-size:40px; line-height:1; width:68px; height:68px; display:grid; place-items:center; border-radius:14px; background:var(--paper-2); flex:none}
.story-body{flex:1 1 300px; display:flex; flex-direction:column; gap:18px; min-width:0}
.story-text{font-size:23px; line-height:1.5; font-weight:500}
.story-mini{padding:14px 18px; flex-direction:row; gap:14px; align-items:center; background:var(--paper-2); box-shadow:none}
.story-mini > div{display:flex; flex-direction:column; gap:2px; min-width:0}
.story-mini .story-text{font-size:18px}
.story-mini .story-icon{font-size:24px; width:44px; height:44px; border-radius:10px; background:var(--paper)}
.n{display:inline-block; background:var(--lemon); border-radius:6px; padding:0 6px; font-weight:700}

.feedback{background:var(--paper-2); color:var(--ink); border-radius:12px; padding:14px 18px; font-weight:500; font-size:18px; display:flex; flex-direction:column; gap:12px}
.feedback.ok{background:color-mix(in srgb,var(--mint) 14%,var(--paper))}
.feedback b{font-weight:700}

/* the picture: objects or bars (see sceneDia) */
.dia{display:flex; flex-direction:column; gap:8px; padding:16px; background:var(--paper-2); border-radius:14px; overflow-x:auto; min-height:110px; justify-content:center}
.bar-row{display:flex; gap:4px; min-height:84px}
.seg{--c:var(--paper-3); flex-basis:0; min-width:96px; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:8px; background:var(--c); color:var(--ink); transition:flex-grow .9s cubic-bezier(.2,.8,.2,1)}
.seg-whole{--c:var(--violet)}
.seg-a,.seg-small,.seg-box{--c:var(--mint)}
.seg-b,.seg-big{--c:var(--sun)}
.seg-gone{--c:var(--pink); background:repeating-linear-gradient(45deg,var(--pink) 0 10px,var(--pink-2) 10px 20px)}
.seg-diff{--c:var(--ink-soft); background:transparent; border:2px dashed var(--ink-soft)}
.seg-box{min-width:44px; flex-grow:1}
.seg-box.first{min-width:96px}
.seg-more{min-width:60px}
.seg-count{--c:var(--paper); flex:0 0 auto; min-width:0; border:1.5px solid var(--paper-3); flex-direction:row; gap:10px; padding:6px 12px}
.count-row{display:flex; justify-content:center}
/* objects mode: light tint so the things inside stay readable */
.dia.obj .seg{background:color-mix(in srgb,var(--c) 16%,var(--paper)); box-shadow:inset 0 0 0 2px var(--c)}
.dia.obj .seg-gone{background:color-mix(in srgb,var(--pink) 10%,var(--paper))}
.dia.obj .seg-diff{background:transparent; box-shadow:none}
.dia.obj .seg-count{background:var(--paper); box-shadow:none}
.dia .seg.spacer{visibility:hidden; min-width:0; padding:0}
.dia .seg.ghost{background:transparent; box-shadow:none; border:2px dashed var(--ink-soft)}
.seg.fresh{animation:grow .7s cubic-bezier(.2,.8,.2,1); transform-origin:left center}
.dia.morph .seg{animation:morph .8s ease-out}
.slot-label{font-size:13px; font-weight:600; line-height:1.15; text-align:center; background:var(--paper); border-radius:6px; padding:2px 8px}
.slot-label:empty{display:none}
.slot-val{min-width:60px; height:44px; padding:0 10px; display:flex; align-items:center; justify-content:center; border-radius:8px; background:var(--paper); border:2px solid var(--ink); font-family:var(--display); font-weight:700; font-size:24px}
.slot-val:empty{visibility:hidden}
.slot-val.q,.slot-val.ans{background:var(--lemon)}
.slot-val.ans{animation:pop .6s}
.dia.obj .slot-val{min-width:44px; height:32px; font-size:18px; border-width:1.5px}
.box-val{font-family:var(--display); font-weight:700; font-size:18px; color:var(--ink)}
.dia.obj .seg-box .box-val{font-size:14px; color:var(--ink-soft)}
/* the things themselves: one by one, or packs of 10 */
.objs{display:flex; flex-wrap:wrap; gap:3px; justify-content:center; align-items:center; max-width:100%}
.objs i{font-style:normal; line-height:1; position:relative}
.o1{font-size:19px; width:22px; height:24px; display:inline-flex; align-items:center; justify-content:center}
.o1:empty{width:7px; height:22px; border-radius:2px; background:var(--c)}
.o10{display:inline-flex; align-items:center; gap:3px; padding:3px 6px; border-radius:6px; background:var(--paper); box-shadow:inset 0 0 0 1.5px var(--c); font-size:16px}
.o10 b{font-size:12px; font-weight:700; color:var(--ink-soft)}
.seg-gone .objs i{opacity:.5}
.seg-gone .objs i::after{content:''; position:absolute; left:-2px; right:-2px; top:50%; height:2px; background:var(--pink); transform:rotate(-30deg)}
.seg-diff .objs i{opacity:.75}
/* the whole as a bracket over its parts (objects mode) */
.brace{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding:0 0 14px; border:0; background:none; color:var(--ink); width:100%; font:inherit}
.brace::after{content:''; position:absolute; left:2px; right:2px; bottom:0; height:10px; border:2px solid var(--violet); border-bottom:0; border-radius:8px 8px 0 0}
.brace.ghost::after{border-style:dashed; border-color:var(--ink-soft)}
.brace .slot-val{height:34px; font-size:20px}
.brace.fresh{animation:pop .5s}

/* step 1: the story sentence by sentence */
.replay-card{gap:14px}
.beat-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px}
.beat{font-size:22px; font-weight:600; line-height:1.4; padding:12px 16px; border-radius:12px; background:color-mix(in srgb,var(--lemon) 45%,var(--paper))}
.beat.enter{animation:pop .4s}
.prompt{font-family:var(--display); font-weight:600; font-size:20px}
.answers{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.answers .btn{min-height:60px; font-size:19px}
.piece-cap{font-size:17px; color:var(--ink-soft)}
.piece-cap b{color:var(--ink); font-weight:600}
.dia-cap{font-size:15px; font-weight:500; color:var(--ink-soft)}
.mode-ctl button{min-height:40px; padding:6px 14px; font-size:15px}
.schema-name{display:flex; flex-direction:column; gap:4px; padding:14px 16px; border-radius:12px; background:var(--accent-soft)}
.schema-name > b{font-size:22px; font-weight:700; color:var(--accent-deep)}
.schema-name p{color:var(--ink); font-size:17px}
/* question beat: every place is a button */
.seg.tap,.brace.tap{cursor:pointer; font:inherit; color:var(--ink)}
.seg.tap{border:0}
.dia .seg.tap.ghost,.brace.tap.ghost{animation:pulse-soft 1.6s ease-in-out infinite}
.dia .seg.tap.ghost{border:2px dashed var(--accent)}
.brace.tap.ghost::after{border-color:var(--accent)}
.brace.tap{border-radius:10px}
.seg.tap[disabled],.brace.tap[disabled]{opacity:.5; cursor:default; animation:none}
@keyframes grow{from{transform:scaleX(.15); opacity:.2}}
@keyframes morph{0%{filter:saturate(.2); transform:scaleY(.7); opacity:.5}100%{filter:none; transform:none; opacity:1}}
@keyframes pulse-soft{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}}
/* three-option questions (step 1) */
.answers.three{grid-template-columns:repeat(3,minmax(0,1fr))}

/* schema trainer «Какая схема?» */
.sch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sch-card{border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;font:inherit;min-height:186px;transition:border-color .12s}
.sch-card:hover{border-color:var(--paper-3)}
.sch-card h4{margin:0;font-size:17px}
.sch-card small{color:var(--ink-soft);font-weight:500;font-size:14px;line-height:1.35}
.sch-card.wrong{border-color:var(--pink);animation:wiggle .4s}
.sch-card.hint{border-color:var(--mint-deep);animation:pulse-soft 1.6s ease-in-out infinite}
.ms{display:flex;flex-direction:column;gap:6px;background:var(--paper-2);border-radius:10px;padding:10px}
.ms-row{display:flex;gap:4px}
.ms-row i{height:16px;border-radius:4px;display:block;min-width:8px}
.ms .v{background:var(--violet)}
.ms .m{background:var(--mint)}
.ms .s{background:var(--sun)}
.ms .g{background:repeating-linear-gradient(45deg,var(--pink) 0 6px,var(--pink-2) 6px 12px)}
.ms .d{background:transparent;box-shadow:inset 0 0 0 2px var(--ink-soft)}

@media (max-width:760px){
  .answers{grid-template-columns:minmax(0,1fr)} .beat{font-size:19px}
  .answers.three{grid-template-columns:minmax(0,1fr)}
  .sch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* drawing */
.own-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:20px}
.own-grid > *{min-width:0}
textarea{width:100%; min-height:200px; border:1.5px solid var(--paper-3); border-radius:12px; padding:14px; font:inherit; font-size:19px; background:var(--slot-bg); color:var(--ink); resize:vertical}
.canvas-wrap{display:flex; flex-direction:column; gap:10px}
canvas#draw{width:100%; aspect-ratio:8/5; max-width:100%; background:#fff; border-radius:12px; border:1.5px solid var(--paper-3); touch-action:none; display:block}
.tools{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.swatch{width:40px; height:40px; border-radius:50%; border:3px solid var(--paper); box-shadow:0 0 0 1.5px var(--paper-3)}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.tool{border:0; background:var(--paper-2); border-radius:8px; padding:8px 14px; font-weight:600; min-height:42px; color:var(--ink)}
.tool.on{background:var(--ink); color:var(--paper)}

/* tens: "Без пальцев" — bus with 10 seats. Everything scoped under .tens-head / .tens-card */
.tens-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px}
.tens-ctl{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.seg-ctl{display:inline-flex; background:var(--sky-2); border-radius:10px; padding:4px; gap:4px}
.seg-ctl button{border:0; background:transparent; color:var(--ink-soft); padding:8px 16px; border-radius:8px; font-weight:600; min-height:44px}
.seg-ctl button.on{background:var(--paper); color:var(--ink); box-shadow:0 1px 3px rgba(16,24,40,.14)}
.show-btn{border:1.5px solid var(--accent); background:transparent; color:var(--accent); border-radius:14px; padding:10px 16px; font-weight:700; min-height:48px}

.tens-card{--seat:54px; --o:var(--sun); --n:var(--mint); --x:var(--pink); gap:14px}
.tens-q{font-family:var(--display); font-weight:700; font-size:clamp(36px,6vw,56px); text-align:center; line-height:1}
.tens-card .qa{color:var(--sun-deep)}
.tens-card .qb{color:var(--mint-deep)}
.tens-card.sub .qb{color:#d23a6c}
.tens-card .qr{background:var(--lemon); border-radius:10px; padding:0 8px}
.tens-card .qm{color:var(--ink-soft)}
.tens-card .ans{color:var(--mint-deep)}

/* scene */
.tscene{position:relative; background:linear-gradient(180deg,#cfe9ff 0,#e9f5ff 70%); border-radius:20px; padding:12px 16px 0; display:flex; flex-direction:column; gap:10px; overflow:hidden; min-width:0}
.tscene.demo .street, .tscene.demo .depot{pointer-events:none}
.watch{position:absolute; top:10px; right:12px; background:var(--ink); color:var(--lemon); font-weight:700; border-radius:999px; padding:6px 14px; font-size:17px; z-index:3; animation:pulse 1.6s ease-in-out infinite}
.depot{display:flex; flex-wrap:wrap; gap:8px; min-height:62px; align-items:center; padding:6px 8px 12px; border-radius:12px; border:3px dashed color-mix(in srgb,var(--ink-soft) 35%,transparent)}
.mini{position:relative; width:84px; height:44px; border-radius:8px 12px 6px 6px; background:var(--lemon); border:3px solid var(--sun-deep); display:flex; align-items:center; justify-content:center}
.mini b{font-family:var(--display); font-weight:700; font-size:24px; color:var(--ink)}
.mini i{position:absolute; bottom:-9px; width:15px; height:15px; border-radius:50%; background:var(--ink); left:8px}
.mini i + i{left:auto; right:8px}
.street{display:flex; flex-wrap:wrap; gap:18px 26px; align-items:flex-end; justify-content:space-between}
.road{height:22px; margin:0 -16px; background:#4a4166; background-image:linear-gradient(90deg,var(--lemon) 0 40px,transparent 40px 80px); background-size:80px 4px; background-repeat:repeat-x; background-position:0 9px}

/* bus */
.bus{position:relative; display:flex; flex-direction:column; align-items:flex-start; padding-bottom:4px}
.bus-sign{align-self:center; margin-bottom:-4px; min-width:64px; text-align:center; background:#231a3c; color:#ffb347; font-family:var(--display); font-weight:700; font-size:28px; line-height:1; padding:6px 12px; border-radius:10px 10px 0 0; border:3px solid var(--sun-deep); border-bottom:0; transition:background .3s,color .3s}
.bus.full .bus-sign{background:var(--lemon); color:var(--ink); animation:pulse .8s ease-in-out 2}
.bus-body{display:flex; gap:8px; background:var(--lemon); border:4px solid var(--sun-deep); border-radius:16px 34px 12px 12px; padding:10px}
.bus.full .bus-body{box-shadow:0 0 0 5px color-mix(in srgb,var(--lemon) 60%,transparent)}
.seats{display:grid; grid-template-columns:repeat(5,var(--seat)); grid-auto-rows:var(--seat); gap:6px}
.seat{border-radius:12px; background:#dff0ff; box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--sun-deep) 35%,transparent); display:flex; align-items:center; justify-content:center}
.cab{width:calc(var(--seat) * .9); border-radius:10px 26px 10px 10px; background:#bfe2ff; display:flex; align-items:center; justify-content:center; font-size:calc(var(--seat) * .6)}
.wheels{display:flex; justify-content:space-between; width:100%; padding:0 30px; margin-top:-12px}
.wheels i{width:30px; height:30px; border-radius:50%; background:var(--ink); border:6px solid #8d82ad}
.bus.in{animation:t-drive-in .8s cubic-bezier(.2,.8,.3,1)}
.bus.leave{animation:t-drive-out .8s ease-in forwards}
@keyframes t-drive-in{from{transform:translateX(110vw)}}
@keyframes t-drive-out{to{transform:translateX(110vw)}}

/* passengers */
.pax{position:relative; border:0; padding:0; width:calc(var(--seat) - 6px); height:calc(var(--seat) - 6px); border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--o); box-shadow:0 2px 0 rgba(0,0,0,.18)}
.pax .face{font-size:calc(var(--seat) * .55); line-height:1}
.pax.k-n{background:var(--n)}
.pax.k-x{background:var(--x)}
.pax.pop .face{animation:pop .4s}
.pax.tap::before{content:""; position:absolute; inset:-5px; border-radius:50%; border:3px solid var(--ink); opacity:.55; animation:t-ring 1.4s ease-in-out infinite}
.pax.next::before{opacity:1; border-color:var(--sun-deep)}
.pax.next::after{content:"👆"; position:absolute; top:70%; left:50%; font-size:34px; margin-left:-14px; pointer-events:none; animation:t-poke 1s ease-in-out infinite; z-index:2}
@keyframes t-ring{50%{transform:scale(1.12); opacity:.25}}
@keyframes t-poke{50%{transform:translateY(-10px)}}

/* stop (add) and exit (sub) */
.stop,.walk{display:flex; gap:12px; align-items:flex-end; padding-bottom:4px}
.side-sign{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:30px}
.side-sign b{font-family:var(--display); font-weight:700; font-size:28px; min-width:52px; text-align:center; border-radius:12px; padding:4px 8px; color:#fff}
.side-sign.plus b{background:var(--mint-deep)}
.side-sign.minus b{background:#d23a6c}
.queue{display:grid; grid-template-columns:repeat(5,var(--seat)); grid-auto-rows:var(--seat); gap:6px; min-height:var(--seat); min-width:calc(var(--seat) * 5 + 24px); align-content:end}
.queue .pax{justify-self:center; align-self:center}
.spot{border-radius:50%; border:3px dashed #d23a6c; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb,var(--pink-2) 40%,transparent)}

/* hand in the demo */
.ghost-hand{position:absolute; z-index:4; font-size:46px; line-height:1; pointer-events:none; transition:left .6s cubic-bezier(.4,0,.2,1), top .6s cubic-bezier(.4,0,.2,1), transform .15s; filter:drop-shadow(0 4px 2px rgba(0,0,0,.3))}
.ghost-hand.press{transform:scale(.8) translateY(6px)}

/* answer */
.t-split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,320px); gap:18px; align-items:start}
.t-left{display:flex; flex-direction:column; gap:12px; min-width:0}
.t-split.wrong .pad{animation:wiggle .4s}
.tens-card .key{height:54px}
.t-hint{background:var(--pink-2); border-radius:14px; padding:12px 16px; font-weight:800; font-size:20px}
.tscene.hint .bus-sign, .tscene.hint .mini{animation:pulse 1s ease-in-out 3}
.t-asking .tens-q .qm{display:inline-block; animation:pulse 1.4s infinite}

/* chain after solving */
.chain{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 12px}
.cstep{display:flex; flex-direction:column; align-items:center; gap:8px; background:var(--paper-2); border-radius:16px; padding:10px 14px; opacity:0; animation:t-in .5s forwards}
.ceq{font-family:var(--display); font-weight:700; font-size:30px; color:var(--ink-soft); opacity:0; animation:t-in .4s forwards}
.ctext{font-family:var(--display); font-weight:700; font-size:26px; white-space:nowrap}
.ctext .ans{font-size:40px}
@keyframes t-in{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.mpic{display:flex; align-items:flex-end; gap:6px}
.mp-tens{display:flex; gap:3px}
.mp-tens i{width:9px; height:34px; border-radius:3px; background:var(--lemon); border:2px solid var(--sun-deep)}
.mp-bus{display:grid; grid-template-columns:repeat(5,13px); gap:3px; padding:4px; background:var(--lemon); border:2px solid var(--sun-deep); border-radius:6px}
.mp-bus i,.mp-extra i{width:13px; height:13px; border-radius:50%; background:#fff; display:block}
.mp-extra{display:grid; grid-template-columns:repeat(5,13px); gap:3px}
.mpic .k-o{background:var(--o)}
.mpic .k-n{background:var(--n)}
.mpic .k-x{background:var(--x); opacity:.45; box-shadow:inset 0 0 0 2px #d23a6c}
.mpic .k-e{background:transparent; box-shadow:inset 0 0 0 2px #d23a6c}
.t-next{display:flex; align-items:center; justify-content:center; gap:16px}
.btn.big{font-size:24px; min-height:66px; padding:14px 34px}
.btn.go{animation:pulse 1.6s ease-in-out infinite}

@media (max-width:900px){ .tens-card{--seat:44px} }
@media (max-width:760px){
  .tens-card{--seat:34px; padding:16px}
  .t-split{grid-template-columns:minmax(0,1fr)}
  .tscene{padding:10px 10px 0}
  .street{gap:14px}
  .wheels i{width:22px; height:22px; border-width:4px}
  .pax.next::after{font-size:26px}
}
.p-ico{width:40px; height:40px; border-radius:8px; background:#2f6fdb; color:#fff; font-family:var(--display); font-weight:700; font-size:26px; display:flex; align-items:center; justify-content:center; opacity:.8}

/* pen */
.pen-tasks{display:flex; flex-wrap:wrap; gap:8px}
.pen-tasks button{border:2px solid var(--sky-3); background:transparent; color:var(--on-sky); border-radius:999px; padding:8px 16px; font-weight:700; min-height:44px}
.pen-tasks button.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.pen-tasks button.ok::after{content:" ✓"}
.pen-svg{width:100%; max-width:100%; height:auto; display:block; border-radius:16px; background:var(--paper-2)}
.pen-svg .lbl{font-family:var(--display); font-weight:700; font-size:17px; fill:var(--ink)}
.pen-svg .lbl.done{fill:var(--mint-deep)}
.dims{display:flex; flex-wrap:wrap; gap:18px; align-items:center}
.dim{display:flex; align-items:center; gap:10px; font-weight:700}
.dim button{width:52px; height:52px; border-radius:14px; border:0; background:var(--paper-2); color:var(--ink); font-family:var(--display); font-weight:700; font-size:26px; box-shadow:0 2px 0 var(--paper-3)}
.dim button[disabled]{opacity:.35}
.dim output{font-family:var(--display); font-weight:700; font-size:28px; min-width:34px; text-align:center}
.counter{font-weight:700; font-size:20px}
.counter b{font-family:var(--display); font-weight:700; font-size:30px; color:var(--sun-deep)}
.found{display:flex; flex-wrap:wrap; gap:10px}
.found span{background:var(--paper-2); border-radius:12px; padding:8px 12px; font-weight:800}
.ops{display:flex; gap:12px; flex-wrap:wrap}
.ops button{width:76px; height:76px; border:0; border-radius:18px; background:var(--paper-2); color:var(--ink); font-family:var(--display); font-weight:700; font-size:38px; box-shadow:0 2px 0 var(--paper-3)}


.pen-svg .lbl.eq{fill:#c2410c}
.pen-svg .lbl.eq.done{fill:var(--mint-deep)}
.tri-type{font-weight:800; font-size:18px; margin:0}
.tri-type b{color:#c2410c}
.picks{display:flex; gap:12px; flex-wrap:wrap}
.picks button{border:0; border-radius:16px; background:var(--paper-2); color:var(--ink); font-family:var(--display); font-weight:700; font-size:20px; padding:12px 18px; min-height:64px; box-shadow:0 2px 0 var(--paper-3); display:flex; flex-direction:column; align-items:flex-start; gap:2px}
.picks button small{font-family:inherit; font-size:14px; font-weight:700; opacity:.75}

/* shop: styles for the sweets-shop module (all classes prefixed sh-) */
.sh-goat{font-size:64px; line-height:1; flex:none}
.sh-goat.jump{animation:jump .9s ease-in-out 2}
.sh-muted{color:var(--ink-soft); font-weight:700}
.sh-intro,.sh-story{flex-direction:row; align-items:center; gap:18px; flex-wrap:wrap}
.sh-intro > div:last-child,.sh-story > div:nth-child(2){flex:1 1 320px}
.sh-story .eyebrow{color:var(--sun-deep)}
.sh-note-msg{background:var(--lemon); border-radius:12px; padding:8px 12px; font-weight:700; margin-top:8px}

/* task list */
.sh-list{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.sh-task{border:0; background:var(--paper); color:var(--ink); border-radius:20px; padding:14px 18px; display:flex; align-items:center; gap:14px; text-align:left; box-shadow:0 0 0 1px var(--line); min-height:76px}
.sh-task:active{transform:translateY(4px)}
.sh-task.next{background:var(--lemon)}
.sh-task.done .sh-num{background:var(--mint); color:var(--ink)}
.sh-num{width:44px; height:44px; border-radius:50%; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:20px; flex:none}
.sh-task-body{display:flex; flex-direction:column}
.sh-task-body b{font-family:var(--display); font-weight:700; font-size:19px}
.sh-task-body small{font-weight:800; color:var(--ink-soft); font-size:15px}

/* layout of a stage */
.sh-pick{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:20px; align-items:start}
.sh-pick > *{min-width:0}
.sh-side{display:flex; flex-direction:column; gap:14px}

/* shelf */
.sh-items{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px}
.sh-item{background:var(--paper-2); border-radius:18px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:4px; border:3px solid transparent}
.sh-item.has{border-color:var(--mint-deep); background:color-mix(in srgb,var(--mint) 22%,var(--paper))}
.sh-emo{font-size:46px; line-height:1.1}
.sh-name{font-weight:800; font-size:15px; text-align:center; line-height:1.15; min-height:34px; display:flex; align-items:center}
.sh-price{font-family:var(--display); font-weight:700; font-size:19px; background:var(--lemon); border-radius:10px; padding:2px 10px}
.sh-qty{display:flex; align-items:center; gap:10px; margin-top:4px}
.sh-qty b{font-family:var(--display); font-weight:700; font-size:22px; min-width:22px; text-align:center}
.sh-q{width:48px; height:48px; border:0; border-radius:14px; background:var(--paper); font-family:var(--display); font-weight:700; font-size:26px; box-shadow:0 2px 0 var(--paper-3); color:var(--ink)}
.sh-q:active{transform:translateY(3px); box-shadow:0 1px 0 var(--paper-3)}
.sh-q[disabled]{opacity:.35}

/* basket: identical blocks */
.sh-line{background:var(--paper-2); border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; gap:6px}
.sh-tiles{display:flex; flex-wrap:wrap; gap:6px}
.sh-tile{width:58px; height:62px; border-radius:10px; background:var(--slot-bg); border:3px solid var(--sun); display:flex; flex-direction:column; align-items:center; justify-content:center; animation:pop .3s}
.sh-tile i{font-style:normal; font-size:26px; line-height:1}
.sh-tile small{font-weight:700; font-size:14px}
.sh-line-m{font-weight:800}
.sh-line-m .ok,.sh-sum b{color:var(--mint-deep)}
.sh-sum{font-family:var(--display); font-weight:700; font-size:22px; text-align:right}

/* feedback + bars */
.sh-fb{background:var(--pink-2); border-radius:16px; padding:12px 16px; display:flex; flex-direction:column; gap:10px; font-weight:800; animation:wiggle .5s}
.sh-lead{font-weight:700; color:var(--sun-deep)}
.sh-bars{display:flex; flex-direction:column; gap:6px}
.sh-bar{display:flex; align-items:center; gap:8px}
.sh-bar-l{flex:0 0 84px; font-size:14px; font-weight:800}
.sh-bar-t{flex:1; display:flex; gap:2px; min-width:0}
.sh-seg{font-style:normal; font-weight:700; font-size:14px; min-height:34px; display:grid; place-items:center; border-radius:6px; color:var(--ink); overflow:hidden; min-width:3px}
.sh-seg.a{background:var(--lemon)}
.sh-seg.b{background:var(--mint)}
.sh-seg.c{background:var(--violet)}
.sh-seg.q{background:repeating-linear-gradient(45deg,var(--paper) 0 6px,var(--paper-3) 6px 12px); border:2px dashed var(--ink-soft)}

/* equation boxes */
.sh-trio{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.sh-tbox{background:var(--paper-2); border-radius:14px; padding:8px 14px; display:flex; flex-direction:column; min-width:96px; text-align:center}
.sh-tbox small{font-weight:800; font-size:14px; color:var(--ink-soft)}
.sh-tbox b{font-family:var(--display); font-weight:700; font-size:24px}
.sh-tbox.q{background:var(--lemon)}
.sh-op{font-family:var(--display); font-weight:700; font-size:28px}
.sh-stepq{color:var(--ink); font-size:21px}
.sh-win{display:flex; gap:14px; align-items:center}
.sh-ask .steps li{animation:none}
.sh-finish{align-items:center; text-align:center}

/* wallet + money */
.sh-money{display:inline-grid; place-items:center; font-family:var(--display); font-weight:700; color:var(--ink); flex:none}
.sh-note{width:78px; height:44px; border-radius:6px; border:3px solid var(--ink); font-size:20px}
.sh-note.m10{background:#d8c4a0} .sh-note.m50{background:#9fd0ff} .sh-note.m100{background:#ffc78a}
.sh-coin{width:44px; height:44px; border-radius:50%; border:3px solid var(--ink); font-size:18px}
.sh-coin.m1{background:#d3a977; width:34px; height:34px; font-size:14px}
.sh-coin.m2{background:#e0b684; width:38px; height:38px; font-size:15px}
.sh-coin.m5{background:#f1d56a} .sh-coin.m10{background:#f7e08a; width:50px; height:50px}
.sh-wallet,.sh-counter{background:var(--paper-2); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:10px}
.sh-wallet h3,.sh-counter h3{font-size:18px}
.sh-stacks,.sh-laid{display:flex; flex-wrap:wrap; gap:10px; align-items:center; min-height:56px}
.sh-stack,.sh-back{border:0; background:var(--paper); border-radius:14px; padding:8px 10px; min-width:64px; min-height:60px; display:flex; align-items:center; gap:6px; color:var(--ink); box-shadow:0 2px 0 var(--paper-3)}
.sh-stack:active,.sh-back:active{transform:translateY(3px); box-shadow:0 1px 0 var(--paper-3)}
.sh-stack[disabled]{opacity:.3}
.sh-stack em{font-style:normal; font-weight:700}
.sh-counter{background:color-mix(in srgb,var(--mint) 25%,var(--paper))}
.sh-paysum{font-weight:800; font-size:19px}
.sh-paysum b{font-family:var(--display); font-weight:700}
.sh-bankcard{background:linear-gradient(135deg,var(--violet),var(--pink)); color:#fff; border-radius:16px; padding:12px 18px; display:flex; flex-direction:column; min-width:180px; box-shadow:0 0 0 1px var(--line)}
.sh-bankcard span{font-weight:800; font-size:14px}
.sh-bankcard b{font-family:var(--display); font-weight:700; font-size:30px}
.sh-pocket{display:flex; gap:8px; align-items:center; font-weight:800}
.sh-paidnote{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-weight:700; color:var(--on-sky)}
.sh-paidnote b{font-family:var(--display); font-weight:700}

@media (max-width:760px){
  .sh-list,.sh-pick{grid-template-columns:minmax(0,1fr)}
  .sh-bar-l{flex-basis:64px}
}

/* units «Мастерская мер» */
.u-tabs{position:sticky; top:0; z-index:2; padding:8px 0; background:color-mix(in srgb,var(--sky) 85%,transparent); backdrop-filter:blur(6px)}
.tip-ink{color:var(--ink-soft); font-weight:700; font-size:16px}
.muted{color:var(--ink-soft)}
.picks.u-mp button{flex-direction:row; align-items:center; gap:8px; font-size:18px}
.picks button.on{background:var(--lemon); box-shadow:0 2px 0 var(--sun-deep)}
.u-col{display:flex; flex-direction:column; gap:14px; min-width:0}
.u-ok{color:var(--mint-deep)}
.u-lesson{background:color-mix(in srgb,var(--mint) 22%,var(--paper)); border-radius:16px; padding:14px 18px; font-weight:700; font-size:18px; line-height:1.5; animation:pop .4s}
.u-lesson b{font-weight:700}

/* why: bench + мерки */
.u-bench-wrap{background:var(--paper-2); border-radius:18px; padding:20px 18px 16px; display:flex; flex-direction:column; gap:10px}
.u-bench{height:30px; border-radius:8px; background:linear-gradient(180deg,#c9864a,#a0612c); border-bottom:5px solid var(--post); position:relative; margin-bottom:22px}
.u-bench::before,.u-bench::after{content:""; position:absolute; top:100%; width:12px; height:22px; background:var(--post); border-radius:0 0 4px 4px}
.u-bench::before{left:8%} .u-bench::after{right:8%}
.u-merki{display:flex; gap:3px}
.u-merki i{flex:1 1 0; min-width:0; height:52px; border-radius:10px; background:var(--slot-bg); border:3px solid var(--sun); display:flex; flex-direction:column; align-items:center; justify-content:center; font-style:normal; animation:pop .35s both}
.u-merki i b{font-size:22px; line-height:1}
.u-merki i small{font-weight:700; font-size:13px}
.u-ruler{position:relative; height:52px; border-radius:8px; border:3px solid var(--ink); background:
  repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px calc(100% / 12)) bottom/100% 22px no-repeat,
  repeating-linear-gradient(90deg,var(--ink-soft) 0 1px,transparent 1px calc(100% / 120)) bottom/100% 10px no-repeat,
  var(--lemon); animation:pop .4s}
.u-ruler span{position:absolute; top:2px; transform:translateX(-50%); font-weight:700; font-size:13px}
.u-ruler span:first-child{transform:none; left:4px!important} .u-ruler span:last-child{transform:translateX(-100%); left:calc(100% - 4px)!important}
.u-res{font-weight:700; font-size:22px; text-align:center}
.u-tried{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px}
.u-tried li{background:var(--paper-2); border-radius:12px; padding:6px 12px; font-weight:800}
.u-formula{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
.u-chip{font-family:var(--display); font-weight:700; font-size:24px; border-radius:14px; padding:6px 16px}
.u-chip.num{background:var(--lemon)} .u-chip.unit{background:var(--mint)} .u-chip.val{background:var(--violet); color:var(--paper)}
.u-kinds{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px}
.u-kind{background:var(--paper-2); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:4px}
.u-kind .ico{font-size:34px; line-height:1}
.u-kind h3{font-size:20px}
.u-kind p{font-weight:700; color:var(--ink-soft); font-size:15px; line-height:1.3}
.u-kind b{font-family:var(--display); font-weight:700; font-size:17px; margin-top:auto}
.u-kind small{font-weight:800; font-size:14px}

/* length magnifier */
.u-ladder{display:flex; flex-direction:column; background:var(--paper-2); border-radius:18px; padding:16px}
.u-lhead{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; margin-bottom:6px}
.u-lhead b{font-family:var(--display); font-weight:700; font-size:19px}
.u-lhead small{font-weight:700; color:var(--ink-soft); font-size:15px}
.u-cells{display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:2px; animation:pop .35s}
.u-cell{border:0; height:54px; display:grid; place-items:center; font-weight:700; font-size:14px; font-style:normal; color:var(--ink); padding:0; min-width:0}
.r0 .u-cell{background:var(--sun)} .r0 .u-cell:nth-child(even){background:#ffb27d}
.r1 .u-cell{background:var(--mint)} .r1 .u-cell:nth-child(even){background:#8fe3cf}
.r2 .u-cell{background:var(--violet); color:var(--paper)} .r2 .u-cell:nth-child(even){background:#bcb1f6; color:var(--ink)}
.u-cells .u-cell:first-child{border-radius:10px 0 0 10px} .u-cells .u-cell:last-child{border-radius:0 10px 10px 0}
button.u-cell.on{outline:4px solid var(--ink); outline-offset:-4px}
.u-funnel{display:block; width:100%; height:36px; margin:2px 0}
.u-funnel polygon{fill:color-mix(in srgb,var(--lemon) 70%,transparent)}
.u-eqs{display:flex; flex-wrap:wrap; gap:8px}
.u-eqs span{background:var(--lemon); border-radius:12px; padding:6px 14px; font-family:var(--display); font-weight:700; font-size:18px}
.u-blocks{display:flex; flex-wrap:wrap; gap:6px; align-items:flex-end}
.u-blocks i{font-style:normal; border-radius:8px; animation:pop .3s}
.u-blocks .big{background:var(--sun); border:3px solid var(--sun-deep); padding:6px 10px; display:flex; flex-direction:column; align-items:center; min-width:88px}
.u-blocks .big b{font-family:var(--display); font-weight:700; font-size:18px}
.u-blocks .big small{font-weight:800; font-size:13px}
.u-blocks .big.mcm{min-width:150px; background:var(--violet); border-color:var(--ink-soft)}
.u-blocks .small{width:22px; height:22px; background:var(--mint); border:3px solid var(--mint-deep)}

/* area */
.u-vs{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.u-vs-side{background:var(--paper-2); border-radius:18px; padding:16px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; font-weight:700}
.u-big{font-family:var(--display); font-weight:700; font-size:26px}
.u-sticks{display:flex; gap:3px; height:88px; align-items:center}
.u-sticks i{width:40px; height:12px; border-radius:6px; background:var(--sun); border:2px solid var(--sun-deep)}
.u-grid{--c:40px; display:grid; grid-template-columns:repeat(var(--w),var(--c)); grid-auto-rows:var(--c); gap:3px; justify-content:start}
.u-grid i{border:2px dashed var(--ink-soft); border-radius:5px; background:color-mix(in srgb,var(--slot-bg) 60%,transparent)}
.u-grid i.on{border:2px solid var(--mint-deep); background:var(--mint); border-radius:5px; animation:pop .25s both}
.u-grid.build,.u-grid.practice{padding:12px; background:var(--paper-2); border-radius:16px; justify-content:center; outline:4px solid var(--sun); outline-offset:-4px}
.u-grid.dm{--c:24px; gap:2px}
.u-dm{display:flex; flex-direction:column; gap:4px; align-items:flex-start; background:var(--paper-2); border-radius:16px; padding:14px; width:max-content; max-width:100%}
.u-dm-top{display:grid; grid-template-columns:repeat(10,24px); gap:2px; font-weight:700; font-size:12px; text-align:center; border-bottom:4px solid var(--sun); color:var(--sun-deep)}
.u-dm-cap{font-weight:700; font-size:14px; color:var(--sun-deep)}
.u-two{display:flex; flex-direction:column; gap:8px; font-weight:700; font-size:18px}
.u-two b{font-family:var(--display); font-weight:700; font-size:21px}
.u-tag{display:inline-block; border-radius:10px; padding:2px 10px; font-weight:700; font-size:15px; margin-right:6px}
.u-tag.len{background:var(--sun)} .u-tag.area{background:var(--mint)}

/* compare */
.u-cmp-head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.u-count{font-weight:700; color:var(--ink-soft)}
.u-cmp{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap}
.u-val{font-family:var(--display); font-weight:700; font-size:clamp(28px,5vw,44px); background:var(--paper-2); border-radius:18px; padding:12px 22px; text-align:center}
.u-slot{width:78px; height:78px; border-radius:18px; border:3px dashed var(--ink-soft); display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:40px; background:var(--lemon)}
.u-slot.ok{background:var(--mint); border-style:solid; border-color:var(--mint-deep)}
.u-slot.bad{background:var(--pink-2); border-style:solid; border-color:var(--pink)}
.u-signs{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}
.u-signs button{width:84px; height:76px; border:0; border-radius:18px; background:var(--paper-2); color:var(--ink); font-family:var(--display); font-weight:700; font-size:38px; box-shadow:0 2px 0 var(--paper-3)}
.u-signs button.wide{width:auto; padding:0 20px; font-size:20px}
.u-signs button:active{transform:translateY(4px); box-shadow:0 1px 0 var(--paper-3)}
.u-bigsign{font-family:var(--display); font-weight:700; font-size:26px}
.u-bars{display:flex; flex-direction:column; gap:8px}
.u-bar{display:flex; align-items:center; gap:10px}
.u-bar .l{flex:0 0 100px; font-weight:700; font-size:15px}
.u-bar .t{flex:1; display:flex; align-items:center; gap:8px; min-width:0}
.u-bar .t i{height:30px; border-radius:6px; min-width:4px; flex:none}
.u-bar .t i.a{background:var(--sun)} .u-bar .t i.b{background:var(--violet)}
.u-bar .t b{font-weight:700; font-size:15px; white-space:nowrap}
.u-apics{display:flex; flex-wrap:wrap; gap:18px}
.u-apics > div{display:flex; flex-direction:column; gap:6px}
.u-apics small{font-weight:700; font-size:15px}
.u-apic{display:flex; flex-wrap:wrap; gap:6px}
.u-ablk{display:grid; grid-template-columns:repeat(10,6px); grid-auto-rows:6px; gap:1px; padding:3px; background:var(--paper); border:2px solid var(--ink-soft); border-radius:4px}
.u-ablk i{background:var(--paper-3)}
.u-ablk i.on{background:var(--mint-deep)}

@media (max-width:760px){
  .u-tabs{position:static; background:none; backdrop-filter:none; padding:0}
  .u-vs{grid-template-columns:minmax(0,1fr)}
  .u-grid{--c:32px}
  .u-grid.dm{--c:22px} .u-dm-top{grid-template-columns:repeat(10,22px)}
  .u-cell{height:46px; font-size:12px}
  .u-bar .l{flex-basis:64px}
  .u-cmp{gap:8px; flex-wrap:nowrap}
  .u-val{font-size:22px; padding:10px 12px; min-width:0}
  .u-slot{width:56px; height:56px; font-size:30px; flex:none}
}

/* «Задачи на время» + «Стрелочные часы» (timekit/time/clock).
   Colour code: hours = orange (short hand), minutes = blue (long hand) — in clocks, digits, pads and columns alike. */
:root{ --hr:#d4561c; --hr-soft:#fde4d6; --mn:#2b4acb; --mn-soft:#e3e9fc; --night:#2c3561; }
.tk-t{font-family:var(--display); font-weight:700; white-space:nowrap}
.tk-t .hr,.hr-c{color:var(--hr)} .tk-t .mn,.mn-c{color:var(--mn)}
b.hr-c,b.mn-c{font-weight:700}

/* clock face */
.tk-clock{display:block; width:100%; height:auto; user-select:none; -webkit-user-select:none; overflow:visible}
.tk-face{fill:#fff; stroke:var(--ink); stroke-width:4}
.tk-tick{stroke:var(--ink-soft); stroke-width:1.6}
.tk-tick5{stroke:var(--ink); stroke-width:3.4; stroke-linecap:round}
.tk-num{font-family:var(--display); font-weight:700; font-size:21px; fill:var(--ink); text-anchor:middle; dominant-baseline:central}
.tk-n24{font-family:var(--display); font-weight:600; font-size:12px; fill:var(--ink-soft); text-anchor:middle; dominant-baseline:central}
.tk-ml{font-family:var(--display); font-weight:700; font-size:13px; fill:var(--mn); text-anchor:middle; dominant-baseline:central}
.tk-ml.z{font-size:14px; fill:#fff; paint-order:stroke; stroke:var(--mn); stroke-width:7px; stroke-linejoin:round}
.tk-wedge{fill:color-mix(in srgb,var(--mn) 16%,transparent)}
.tk-sweep{fill:color-mix(in srgb,var(--mn) 22%,transparent)}
.tk-sweep.back{fill:color-mix(in srgb,var(--pink) 28%,transparent)}
.tk-hsec{fill:color-mix(in srgb,var(--hr) 16%,transparent)}
.tk-hh{stroke:var(--hr); stroke-width:10; stroke-linecap:round}
.tk-mh{stroke:var(--mn); stroke-width:5.5; stroke-linecap:round}
.tk-pin{fill:var(--ink)}
.tk-mark{fill:var(--mn); stroke:#fff; stroke-width:2}
.tk-ghost line{stroke:var(--ink-soft); stroke-dasharray:6 6; stroke-linecap:round; opacity:.8}
.tk-ghost .h{stroke-width:8} .tk-ghost .m{stroke-width:4}
.tk-clock.drag{touch-action:none; cursor:grab}
.tk-clock.drag .tk-hh,.tk-clock.drag .tk-mh{filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.tk-clock.grab-h .tk-hh,.tk-clock.grab-m .tk-mh{stroke-width:12}
.tk-clock.grab-m .tk-mh{stroke-width:8}
.tk-clock.only-m .tk-hh{display:none}
.tk-num-t{cursor:pointer}
.tk-num-t circle{fill:transparent}
.tk-num-t:hover circle{fill:var(--mn-soft)}

/* layout bits */
.tk-two{display:grid; grid-template-columns:minmax(0,260px) minmax(0,1fr); gap:20px; align-items:center}
.tk-play{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:22px; align-items:center}
.tk-big{max-width:340px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:4px}
.tk-big.c{max-width:300px}
.tk-mini{max-width:260px; width:100%; margin:0 auto}
.tk-mini.c{max-width:220px}
.tk-mini.sm{max-width:150px}
.tk-cap{text-align:center; font-weight:600; color:var(--ink-soft); font-size:15px}
.tk-bignum{font-family:var(--display); font-weight:700; font-size:clamp(36px,6vw,54px); line-height:1.05; color:var(--ink)}
.tk-bignum.sm{font-size:40px}
.tk-word{font-weight:700; font-size:22px}
.tk-explain{font-weight:500; font-size:18px; line-height:1.5}
.tk-rules{display:flex; flex-wrap:wrap; gap:8px}
.tk-rules span{background:var(--lemon); border-radius:12px; padding:6px 14px; font-weight:600; font-size:17px}
.tk-rules.wide span{font-family:var(--display); font-weight:700}
.tk-btns{display:flex; flex-wrap:wrap; gap:8px}
.tk-step-btn{border:1.5px solid var(--paper-3); background:var(--paper); border-radius:10px; padding:8px 12px; min-height:46px; font-weight:700; font-size:16px; color:var(--mn)}
.tk-step-btn.minus{color:var(--ink-soft)}
.tk-step-btn:hover{background:var(--paper-2)}
.tk-step-btn[disabled]{opacity:.4}
.tk-toggle{border:1.5px solid var(--paper-3); background:var(--paper); border-radius:999px; padding:7px 14px; min-height:42px; font-weight:600; font-size:15px; color:var(--ink)}
.tk-toggle.on{background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 40%,transparent); color:var(--accent-deep)}
.tk-tight{gap:10px; padding:14px 18px}

/* «ч : мин» pad */
.tk-slots{display:flex; align-items:center; justify-content:center; gap:6px}
.tk-slot{height:60px; min-width:76px; border-radius:10px; background:var(--slot-bg); border:2px solid var(--paper-3); font-family:var(--display); font-weight:700; font-size:32px; padding:0 8px}
.tk-slot.hr{color:var(--hr)} .tk-slot.mn{color:var(--mn)}
.tk-slot.on.hr{border-color:var(--hr); box-shadow:0 0 0 3px var(--hr-soft)}
.tk-slot.on.mn{border-color:var(--mn); box-shadow:0 0 0 3px var(--mn-soft)}
.tk-slot .ph{color:var(--paper-3); font-size:22px}
.tk-colon{font-family:var(--display); font-weight:700; font-size:34px}
.tk-u{font-weight:700; color:var(--ink-soft)}
.tk-next{height:44px; font-family:var(--body); font-size:16px; font-weight:600; width:100%}

/* lab */
.tk-lab-head{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between}
.tk-lvls,.tk-levels{display:flex; flex-wrap:wrap; gap:4px; background:var(--paper-2); border-radius:12px; padding:4px}
.tk-lvls button,.tk-levels button{border:0; background:transparent; border-radius:9px; padding:7px 12px; font-weight:600; font-size:15px; color:var(--ink-soft); min-height:40px}
.tk-lvls button.on,.tk-levels button.on{background:var(--paper); color:var(--ink); box-shadow:var(--shadow)}
.tk-levels small{display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--sky-2); font-size:12px; margin-right:2px}
.tk-levels button.on small{background:var(--accent); color:#fff}
.tk-story{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
.tk-story .rule{font-size:21px}
.tk-vis{background:var(--paper-2); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px; overflow:hidden}
.tk-steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.tk-steps li{display:flex; gap:10px; align-items:flex-start; background:var(--paper-2); border-radius:10px; padding:10px 12px; font-weight:500; font-size:18px; animation:pop .35s}
.tk-steps li.now{background:var(--accent-soft); box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent); font-weight:600}
.tk-steps li.ok .tk-sn{background:var(--mint-deep); color:#fff}
.tk-sn{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:14px; font-weight:700; background:var(--accent); color:#fff; margin-top:1px}
.tk-arrow{color:var(--ink-soft)}
.tk-final-q{font-weight:700; font-size:21px}
.tk-check{font-weight:600; color:var(--mint-deep)}
.tk-alt{background:var(--paper-2); border-radius:12px; padding:10px 14px}
.tk-alt summary{font-weight:700; cursor:pointer}
.tk-alt > *:not(summary){margin-top:8px}
.tk-lab .win .check-line .tk-t{font-size:1.1em}

/* timeline */
.tl{width:100%; height:auto; display:block}
.tl-axis{stroke:var(--ink); stroke-width:3}
.tl-hr{stroke:var(--ink); stroke-width:3}
.tl-min{stroke:var(--ink-soft); stroke-width:1.5}
.tl-hl{font-family:var(--display); font-weight:700; font-size:17px; fill:var(--ink); text-anchor:middle}
.tl-brace{fill:none; stroke:var(--ink-soft); stroke-width:2.5}
.tl-bl{font-weight:700; font-size:18px; fill:var(--ink-soft); text-anchor:middle}
.tl-jump{fill:none; stroke:var(--mn); stroke-width:3.5; stroke-linecap:round; stroke-dasharray:400; stroke-dashoffset:400; animation:tl-draw .6s forwards}
.tl-jump.back{stroke:var(--pink)}
.tl-jl{font-family:var(--display); font-weight:700; font-size:17px; fill:var(--mn); text-anchor:middle; animation:pop .4s}
.tl-jl.back{fill:var(--pink)}
.tl-dot{fill:#fff; stroke-width:4}
.tl-dot.s{stroke:var(--mint-deep); fill:var(--mint)} .tl-dot.e{stroke:var(--pink); fill:var(--pink-2)} .tl-dot.mid{stroke:var(--night); fill:var(--night)}
.tl-fl{font-family:var(--display); font-weight:700; font-size:24px; text-anchor:middle; fill:var(--pink)}
@keyframes tl-draw{to{stroke-dashoffset:0}}
.tk-legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-weight:600; font-size:16px}
.tk-legend .s{color:var(--mint-deep)} .tk-legend .e{color:var(--pink)}

/* column */
.tk-col{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
.tk-colgrid{display:grid; grid-template-columns:28px auto auto auto auto; column-gap:8px; align-items:baseline; font-family:var(--display); font-weight:700; font-size:28px; position:relative; background:#fff; border-radius:12px; padding:6px 16px 10px; border:1px solid var(--line)}
.tk-colgrid > span{text-align:right; min-height:1em}
.tk-colgrid > span.u{font-family:var(--body); font-weight:500; font-size:18px; color:var(--ink-soft); text-align:left}
.tk-colgrid .hr{color:var(--hr)} .tk-colgrid .mn{color:var(--mn)} .tk-colgrid .op{color:var(--ink-soft)} .tk-colgrid .qm{color:var(--accent)}
.tk-colgrid .tk-carry{font-size:17px; min-height:20px}
.tk-colgrid .x{text-decoration:line-through; text-decoration-thickness:3px; opacity:.55}
.tk-colline{grid-column:1/-1; height:3px; background:var(--ink); border-radius:2px; margin:2px 0}
.tk-colnote{font-weight:500; font-size:16px; color:var(--ink-soft); max-width:46ch}

/* minute bank */
.tk-bank{display:grid; grid-template-columns:minmax(0,320px) minmax(0,1fr); gap:22px; align-items:center}
.tk-bank-clock{max-width:320px; width:100%; margin:0 auto}
.tk-bank-side{display:flex; flex-direction:column; gap:12px}
.tk-hourcoins{display:flex; flex-wrap:wrap; gap:8px; align-items:center; min-height:72px}
.tk-coin{width:68px; height:68px; border-radius:50%; background:var(--hr-soft); border:3px solid var(--hr); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; animation:pop .35s}
.tk-coin b{font-family:var(--display); font-weight:700; font-size:18px; color:var(--hr)}
.tk-coin small{font-size:11px; font-weight:600; color:var(--ink-soft)}
.tk-coin.empty{width:auto; height:auto; border-radius:10px; border-style:dashed; background:none; padding:8px 12px; border-color:var(--paper-3)}
.tk-coin.part{background:conic-gradient(var(--mn-soft) calc(var(--p) * 360deg), #fff 0); border-color:var(--mn)}
.tk-coin.part b{color:var(--mn)}
.tk-eq{font-weight:500; font-size:19px}
.tk-quiz{display:flex; flex-direction:column; gap:12px; border-top:1px solid var(--line); padding-top:14px}
.tk-quiz-q{font-weight:600; font-size:20px}
.tk-quiz-q .u-count{margin-right:6px; font-size:15px}
.tk-picks button{font-family:var(--display); min-height:56px}
.tk-picks.col{flex-direction:column; align-items:stretch}
.tk-picks.col button{font-family:var(--body); font-weight:600; font-size:19px; align-items:flex-start}
.tk-picks button.right,.tk-clockpicks button.right{background:color-mix(in srgb,var(--mint) 35%,var(--paper)); box-shadow:inset 0 0 0 2px var(--mint-deep)}
.tk-picks button.wrong,.tk-clockpicks button.wrong{background:var(--pink-2); box-shadow:inset 0 0 0 2px var(--pink)}
.tk-picks button[disabled]{opacity:1; cursor:default}

/* minutes bar (conversions) */
.tk-mbar{display:flex; gap:4px; height:76px}
.tk-mbar .seg{border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:52px; line-height:1.1; border:2px dashed var(--mn);
  background:repeating-linear-gradient(90deg,transparent 0 calc(100% / 6 - 1.5px),color-mix(in srgb,var(--mn) 35%,transparent) calc(100% / 6 - 1.5px) calc(100% / 6)) , var(--mn-soft); animation:pop .35s}
.tk-mbar .mseg{background:repeating-linear-gradient(90deg,transparent 0 calc(100% / var(--n) - 1.5px),color-mix(in srgb,var(--mn) 35%,transparent) calc(100% / var(--n) - 1.5px) calc(100% / var(--n))), var(--mn-soft)}
.tk-mbar .seg b{font-family:var(--display); font-weight:700; font-size:18px; color:var(--mn); background:rgba(255,255,255,.85); border-radius:6px; padding:0 4px}
.tk-mbar .seg small{font-weight:600; font-size:12px; color:var(--ink-soft); background:rgba(255,255,255,.85); border-radius:4px; padding:0 3px}
.tk-mbar .hseg.on{border:2px solid var(--hr); background:var(--hr-soft)}
.tk-mbar .hseg.on b{color:var(--hr)}
.tk-mbar .mseg.on{border-style:solid}

/* day ribbon */
.tk-ribbon{display:grid; grid-template-columns:repeat(25,minmax(0,1fr)); gap:2px}
.tk-ribbon button{border:0; height:46px; padding:0; border-radius:6px; font-weight:700; font-size:13px; min-width:0}
.tk-ribbon .pn{background:var(--night); color:#e6e9ff} .tk-ribbon .pm{background:#f6c98e} .tk-ribbon .pd{background:#ffe48a} .tk-ribbon .pe{background:#f3a07c}
.tk-ribbon button.on{outline:4px solid var(--accent); outline-offset:1px; position:relative; z-index:1; transform:scale(1.08)}
.tk-ribbon-cap{display:grid; grid-template-columns:repeat(25,minmax(0,1fr)); font-weight:600; font-size:14px; color:var(--ink-soft); white-space:nowrap}
.tk-ribbon-cap span:nth-child(1){grid-column:1/6} .tk-ribbon-cap span:nth-child(2){grid-column:6/9} .tk-ribbon-cap span:nth-child(3){grid-column:9/19} .tk-ribbon-cap span:nth-child(4){grid-column:19/23} .tk-ribbon-cap span:nth-child(5){grid-column:23/26; text-align:right}
.tk-day{display:grid; grid-template-columns:minmax(0,260px) minmax(0,1fr); gap:22px; align-items:center}
.tk-laps{display:flex; gap:14px}
.tk-lap{display:flex; flex-direction:column; align-items:center; gap:2px; opacity:.5}
.tk-lap.on{opacity:1}
.tk-lap svg{width:84px; height:84px}
.tk-lap .ring{fill:#fff; stroke:var(--ink); stroke-width:3}
.tk-lap .fill{fill:color-mix(in srgb,var(--hr) 55%,transparent)}
.tk-lap text{font-family:var(--display); font-weight:700; font-size:16px; text-anchor:middle; fill:var(--ink)}
.tk-lap small{font-weight:600; font-size:13px; color:var(--ink-soft)}
.tk-pairs{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:4px}
.tk-pairs div{background:var(--paper-2); border-radius:10px; padding:6px 2px; display:flex; flex-direction:column; align-items:center; font-family:var(--display); font-weight:700}
.tk-pairs b{font-size:20px} .tk-pairs span{font-size:16px; color:var(--hr)} .tk-pairs em{font-style:normal; font-size:14px; color:var(--hr)}
.tk-pairs div.z{background:var(--lemon)}

/* add track */
.tk-track{display:flex; flex-direction:column; gap:6px}
.tk-trk{position:relative; height:34px; background:#fff; border:2px solid var(--ink-soft); border-radius:8px; display:flex; overflow:visible; margin-top:22px}
.tk-trk i{height:100%; animation:pop .4s}
.tk-trk i.a{background:var(--mn)} .tk-trk i.b{background:color-mix(in srgb,var(--mn) 45%,#fff)}
.tk-trk .l60{position:absolute; top:-24px; bottom:-4px; border-left:3px solid var(--hr)}
.tk-trk .l60 b{position:absolute; top:0; left:6px; white-space:nowrap; font-size:14px; color:var(--hr)}
.tk-3q{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.tk-3q > div{background:var(--paper-2); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:6px}
.tk-3q b{font-weight:700}
.tk-3q p{font-weight:500; font-size:16px}

/* clock module */
.tk-legend2{display:flex; flex-wrap:wrap; gap:8px 18px; font-size:17px; font-weight:500}
.tk-legend2 > span{display:inline-flex; align-items:center; gap:8px}
.tk-legend2 i{display:inline-block; border-radius:4px; width:26px; height:9px}
.tk-legend2 .hr-chip i{background:var(--hr); width:20px; height:11px}
.tk-legend2 .mn-chip i{background:var(--mn); width:36px; height:6px}
.tk-fives{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px}
.tk-fives span{background:var(--paper-2); border-radius:10px; padding:4px; display:flex; flex-direction:column; align-items:center; font-family:var(--display); font-weight:700; color:var(--mn); font-size:15px}
.tk-fives span b{color:var(--ink); font-size:18px}
.tk-fives span.on{background:var(--mn-soft); box-shadow:inset 0 0 0 2px var(--mn)}
.tk-row3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
.tk-row3 > div{display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center}
.tk-row3 .tk-clock{max-width:200px}
.tk-row3 b{font-size:22px} .tk-row3 small{font-weight:500; font-size:15px; color:var(--ink-soft)}
.tk-clockpicks{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.tk-clockpicks button{border:0; background:var(--paper-2); border-radius:16px; padding:10px; box-shadow:0 2px 0 var(--paper-3)}
.tk-clockpicks button[disabled]{cursor:default}
.tk-pair{display:flex; flex-wrap:wrap; gap:16px; justify-content:center}
.tk-pair > div{display:flex; flex-direction:column; align-items:center; gap:4px; width:min(240px,44%)}
.tk-pair small{font-weight:700; font-size:15px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em}
.tk-count{font-weight:700; font-size:18px; color:var(--mn)}
.tk-btns.ex .tk-toggle{font-family:var(--display); font-weight:700; font-size:17px}

/* rewards + games */
.tk-head-r{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.tk-stars{font-weight:700; font-size:17px; background:var(--lemon); border-radius:999px; padding:5px 12px; white-space:nowrap}
.tk-star-pop{display:inline-block; font-size:.75em; background:var(--lemon); border-radius:999px; padding:2px 10px; vertical-align:middle; animation:jump .9s ease-in-out 1}
.tk-huge{font-size:24px; min-height:72px; padding:14px 34px; border-radius:16px}
.tk-huge.stop{background:var(--pink)}
.tk-huge.stop:hover{background:#c94767}
.tk-feel-go{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; padding:12px 0}
.tk-pulse{animation:pulse 1.6s ease-in-out infinite}
.tk-cmpbars{display:flex; flex-direction:column; gap:8px}
.tk-cmpbars > div{display:grid; grid-template-columns:150px 1fr auto; gap:10px; align-items:center; font-weight:600; font-size:15px}
.tk-cmpbars i{display:block; height:22px; border-radius:6px; background:var(--mn-soft); box-shadow:inset 0 0 0 2px var(--mn)}
.tk-cmpbars i.you{background:var(--lemon); box-shadow:inset 0 0 0 2px var(--sun-deep); animation:pop .5s}
.tk-ladder{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.tk-ladder > div{background:var(--paper-2); border-radius:14px; padding:10px 14px; display:flex; flex-direction:column; gap:2px; flex:1 1 150px}
.tk-ladder b{font-family:var(--display); font-size:20px}
.tk-ladder span{font-weight:500; font-size:15px; color:var(--ink-soft)}
.tk-ladder > i{font-style:normal; font-family:var(--display); font-weight:700; color:var(--accent); font-size:18px}
.tk-how{display:flex; align-items:center; gap:16px}
.tk-how-e{font-size:56px; line-height:1; width:84px; height:84px; display:grid; place-items:center; background:var(--paper-2); border-radius:20px; flex:none}
.tk-how p{font-size:24px; font-weight:600}
.u-signs button.right{background:color-mix(in srgb,var(--mint) 35%,var(--paper)); box-shadow:inset 0 0 0 2px var(--mint-deep)}
.u-signs button.wrong{background:var(--pink-2); box-shadow:inset 0 0 0 2px var(--pink)}
.u-signs button[disabled]{cursor:default}
.tk-pies{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px}
.tk-pies > div{display:flex; flex-direction:column; align-items:center; text-align:center; gap:2px}
.tk-pies .tk-clock{max-width:120px}
.tk-pies b{font-family:var(--display); font-size:18px} .tk-pies span{font-weight:700; color:var(--mn)} .tk-pies small{font-size:13px; color:var(--ink-soft); font-weight:500}
.tk-clock.pie .tk-sweep{fill:color-mix(in srgb,var(--sun) 70%,transparent)}
.tk-act{font-weight:600; font-size:18px; background:var(--paper-2); border-radius:12px; padding:8px 12px; align-self:flex-start}
.tk-tlhelp{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:center; background:var(--paper-2); border-radius:14px; padding:12px}
.tk-tlhelp p{font-weight:500; font-size:17px}
.tk-riddle{font-size:21px; font-weight:500}
.tk-toggle.hot{background:var(--lemon); border-color:var(--sun)}
.tk-timer{font-family:var(--display); font-weight:700; font-size:32px; min-width:64px; text-align:center; color:var(--accent); margin-left:auto}
.tk-timer.low{color:var(--pink); animation:pulse 1s infinite}
.tk-blitz-row{display:grid; grid-template-columns:minmax(0,280px) minmax(0,1fr); gap:20px; align-items:center}
.tk-blitz-opts{display:flex; flex-direction:column; gap:10px}
.tk-blitz-opts button{border:0; border-radius:16px; background:var(--paper-2); box-shadow:0 2px 0 var(--paper-3); min-height:72px; font-size:34px}
.tk-blitz-opts button.right{background:color-mix(in srgb,var(--mint) 35%,var(--paper)); box-shadow:inset 0 0 0 3px var(--mint-deep)}
.tk-blitz-opts button.wrong{background:var(--pink-2); box-shadow:inset 0 0 0 3px var(--pink)}

@media (max-width:760px){
  .tk-pies{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tk-tlhelp,.tk-blitz-row{grid-template-columns:minmax(0,1fr)}
  .tk-cmpbars > div{grid-template-columns:96px 1fr auto; font-size:13px}
  .tk-how-e{width:64px; height:64px; font-size:40px} .tk-how p{font-size:20px}
  .tk-blitz-opts{flex-direction:row} .tk-blitz-opts button{flex:1; font-size:24px; min-height:60px}
  .tk-two,.tk-play,.tk-bank,.tk-day{grid-template-columns:minmax(0,1fr)}
  .tk-3q{grid-template-columns:minmax(0,1fr)}
  .tk-row3{gap:6px} .tk-row3 b{font-size:17px} .tk-row3 small{font-size:12px}
  .tk-ribbon{grid-template-columns:repeat(13,minmax(0,1fr)); row-gap:4px}
  .tk-ribbon button{height:40px}
  .tk-ribbon-cap{display:none}
  .tk-pairs{grid-template-columns:repeat(6,minmax(0,1fr))}
  .tk-fives{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tk-clockpicks{gap:6px} .tk-clockpicks button{padding:4px}
  .tk-colgrid{font-size:24px}
  .tk-story .rule{font-size:19px}
  .tk-mbar{height:64px} .tk-mbar .seg{min-width:40px} .tk-mbar .seg b{font-size:15px}
}

/* measures-learn styles (prefix ml-) */
.ml-sec{min-width:0}
.ml-big{font-size:36px; line-height:1}
.ml-rule{font-weight:700; font-size:18px; line-height:1.5; background:color-mix(in srgb,var(--mint) 22%,var(--paper)); border-radius:14px; padding:10px 16px}
.ml-ask{font-weight:700; font-size:18px}
.ml-ask small{color:var(--ink-soft); margin-left:6px}
.ml-pick-hint{font-weight:700; text-align:center; padding:10px}

/* tab 1 */
.ml-kinds{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px}
.ml-kind{background:var(--paper-2); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:4px; min-width:0}
.ml-kind .ml-ico{font-size:36px; line-height:1}
.ml-kind h3{font-size:20px}
.ml-kind p{font-weight:700; color:var(--ink-soft); font-size:15px; line-height:1.3}
.ml-kind b{font-family:var(--display); font-size:17px; margin-top:auto; padding-top:6px}
.ml-vs{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.ml-vs-box{border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:4px; align-items:flex-start; min-width:0}
.ml-vs-box b{font-family:var(--display); font-size:18px; overflow-wrap:anywhere}
.ml-vs-box small{font-weight:700; font-size:14px}
.ml-vs-box.bad{background:var(--pink-2)}
.ml-vs-box.good{background:color-mix(in srgb,var(--mint) 30%,var(--paper))}
.ml-objs,.ml-units,.ml-kindbar,.ml-pre{display:flex; flex-wrap:wrap; gap:8px}
.ml-objs button,.ml-units button,.ml-kindbar button,.ml-pre button{border:0; border-radius:14px; background:var(--paper-2); color:var(--ink); font-family:var(--display); font-weight:700; font-size:17px; padding:8px 14px; min-height:48px; box-shadow:0 2px 0 var(--paper-3)}
.ml-objs button.on,.ml-units button.on,.ml-kindbar button.on{background:var(--lemon); box-shadow:0 2px 0 var(--sun-deep)}
.ml-units button{display:flex; flex-direction:column; align-items:center; min-width:78px; font-size:22px}
.ml-units button small{font-size:12px; opacity:.75}
.ml-units.sm button{min-width:56px; font-size:19px; padding:6px 12px}
.ml-res{border-radius:18px; padding:16px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; font-weight:700; font-size:17px; animation:pop .35s}
.ml-res.ok{background:color-mix(in srgb,var(--mint) 30%,var(--paper))}
.ml-res.tiny,.ml-res.huge{background:var(--pink-2)}
.ml-num{font-family:var(--display); font-size:26px; overflow-wrap:anywhere}
.ml-kindbar{margin:0 0 4px}

/* ladders */
.ml-ladder{display:flex; flex-direction:column; gap:0}
.ml-step{width:var(--w); min-width:0; display:grid; grid-template-columns:auto auto 1fr; align-items:center; gap:4px 10px; padding:10px 14px; border-radius:16px; background:color-mix(in srgb,var(--sun) var(--t),var(--lemon)); border:3px solid transparent}
.ml-step.pick{border-color:var(--ink)}
.ml-step.mid{border-color:color-mix(in srgb,var(--ink) 35%,transparent); border-style:dashed}
.ml-e{font-size:30px; line-height:1}
.ml-unit{display:flex; flex-direction:column; line-height:1.15}
.ml-unit b{font-family:var(--display); font-size:24px}
.ml-unit span{font-size:13px; font-weight:700}
.ml-ex{font-weight:700; font-size:14px; line-height:1.25; min-width:0}
.ml-gap{display:flex; align-items:center; justify-content:space-between; gap:6px; padding:3px 6px; font-weight:800; font-size:14px; flex-wrap:wrap}
.ml-dn{background:var(--sun); color:var(--ink); border-radius:10px; padding:3px 10px; font-family:var(--display)}
.ml-upx{background:var(--violet); border-radius:10px; padding:3px 10px; font-family:var(--display)}
.ml-cap{color:var(--ink-soft); flex:1 1 auto; text-align:center; min-width:0}
.ml-gap.mid .ml-cap{color:var(--ink)}
.ml-pickrow{display:flex; flex-direction:column; gap:4px}
.ml-pickrow>span{font-weight:700; color:var(--ink-soft); font-size:15px}
.ml-chain{background:var(--paper-2); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:10px; align-items:flex-start; animation:pop .3s}
.ml-eq{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-family:var(--display); font-weight:700; font-size:22px}
.ml-one{background:var(--mint); border-radius:12px; padding:4px 12px}
.ml-f{font-style:normal; background:var(--lemon); border-radius:12px; padding:4px 12px}
.ml-op{color:var(--ink-soft)}
.ml-total{background:var(--violet); color:var(--paper); border-radius:12px; padding:4px 14px; overflow-wrap:anywhere}
.ml-back,.ml-same{font-weight:700; color:var(--ink-soft); font-size:16px}

/* prefixes */
.ml-prefs{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px}
.ml-pref{border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:4px; min-width:0; background:var(--paper-2)}
.ml-pp{font-family:var(--display); font-weight:700; font-size:28px}
.ml-mk{font-family:var(--display); font-size:22px; align-self:flex-start; border-radius:12px; padding:2px 12px; background:var(--lemon)}
.ml-pt{font-weight:800; font-size:18px}
.ml-pref small{font-weight:700; font-size:14px; color:var(--ink-soft); line-height:1.3}
.ml-pref.p-km .ml-mk{background:var(--violet); color:var(--paper)}
.ml-bars{display:flex; flex-direction:column; gap:8px}
.ml-bar{display:flex; align-items:center; gap:10px}
.ml-bl{width:52px; flex:none; font-family:var(--display); font-weight:700; font-size:18px}
.ml-track{flex:1; min-width:0; height:22px; background:var(--paper-2); border-radius:8px; overflow:hidden}
.ml-track i{display:block; height:100%; min-width:3px; background:var(--sun); border-radius:8px}
.ml-eqs{display:flex; flex-wrap:wrap; gap:8px}
.ml-eqs span{background:var(--lemon); border-radius:12px; padding:6px 14px; font-family:var(--display); font-weight:700; font-size:18px}
.ml-kilo{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.ml-kilo>div{background:var(--paper-2); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:4px; min-width:0}
.ml-kilo b{font-family:var(--display); font-size:19px}
.ml-kilo small{font-weight:800; font-size:15px; color:var(--ink-soft)}

/* fridge */
.ml-fh{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px}
.ml-print{border:0; border-radius:14px; background:var(--accent); color:var(--paper); font-weight:700; font-size:17px; padding:8px 16px; min-height:44px}
.ml-fgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.ml-fk{background:var(--paper-2); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; min-width:0}
.ml-fk h3{font-size:19px}
.ml-fk h3 small{display:block; font-size:13px; color:var(--ink-soft); font-weight:700}
.ml-chips{display:flex; flex-wrap:wrap; align-items:center; gap:3px}
.ml-chip{display:inline-flex; align-items:center; gap:3px; background:var(--lemon); border-radius:10px; padding:2px 8px; font-size:15px}
.ml-chip b{font-family:var(--display)}
.ml-arrow{font-weight:800; color:var(--ink-soft)}
.ml-fk ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:3px; font-weight:700; font-size:16px}
.ml-fk ul.far{border-top:2px dashed var(--paper-3); padding-top:6px}
.ml-fk ul.far li{color:var(--accent-deep)}

@media (max-width:760px){
  .ml-fgrid,.ml-vs,.ml-kilo{grid-template-columns:1fr}
  .ml-vs{grid-template-columns:1fr 1fr}
  .ml-step{grid-template-columns:auto 1fr; padding:8px 10px}
  .ml-step .ml-ex{grid-column:1 / -1}
  .ml-eq{font-size:19px}
  .ml-cap{font-size:12px}
}
@media (max-width:420px){ .ml-vs{grid-template-columns:1fr} .ml-step{width:calc(var(--w) + 0%); }}

@media print{
  body:has(.fridge){background:#fff!important}
  body:has(.fridge) .topbar, body:has(.fridge) .u-tabs, body:has(.fridge) .no-print, body:has(.fridge) .fs-btn{display:none!important}
